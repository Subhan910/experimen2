          package id.cfm.webui;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.SocketTimeoutException;
          import java.security.MessageDigest;
          import java.security.SecureRandom;

          /**
           * Server TCP milik Agen. Mengurus jabat tangan + PIN, mengirim paket video dari Backend, dan meneruskan
           * pesan kontrol ke Backend. Satu klien aktif pada satu waktu: klien baru yang lolos PIN menggantikan yang lama
           * (pengendali memulai ulang aliran saat ganti kualitas atau berpindah dari grid ke layar kontrol).
           *
           * Murni Java; Backend (tangkap layar, encoder, sentuhan) disediakan AgentService.
           */
          final class AgentServer {

              /** Tempat encoder menaruh paket. Boleh dipanggil dari thread mana pun; melempar IOException bila klien putus. */
              interface Sink {
                  void packet(boolean config, boolean key, long ptsUs, byte[] data, int off, int len) throws IOException;
              }

              /** Dilempar Backend.startVideo bila layar belum tersedia: sesi tetap terbuka dalam keadaan siaga. */
              static final class NoVideoException extends IOException {
                  NoVideoException(String m) {
                      super(m);
                  }
              }

              interface Backend {
                  String deviceName();

                  /** Ukuran layar penuh saat ini {lebar, tinggi}; dipakai sebagai ukuran awal bila sesi masuk siaga. */
                  int[] screenSize();

                  /** Minta layar dibagikan kembali (mis. membuka dialog izin tangkap layar di HP ini). Harus cepat kembali. */
                  void reclaim();

                  /** true bila sentuhan/tombol bisa dijalankan (layanan Aksesibilitas aktif). */
                  boolean controlReady();

                  /**
                   * Mulai menangkap layar. Mengembalikan {lebar, tinggi} video awal. Harus menghentikan aliran sebelumnya.
                   * Melempar NoVideoException bila layar belum tersedia.
                   */
                  int[] startVideo(int maxSize, int bitrate, int fps, Sink sink) throws IOException;

                  /**
                   * Hentikan aliran video. s = sink milik sesi yang berhenti: bila aliran sudah dipegang sesi lain
                   * (klien menyambung ulang secepat itu), tidak boleh dihentikan. s == null berarti hentikan apa pun.
                   */
                  void stopVideo(Sink s);

                  void requestSync();

                  /** nx, ny: 0..65535 relatif ke layar penuh. action: 0 turun, 1 angkat, 2 geser. */
                  void touch(int action, int nx, int ny);

                  void key(int code);

                  void text(String s);
              }

              private final Backend backend;
              private final int port;
              private final long idleMs;
              private final long beatMs;
              private final SecureRandom rnd = new SecureRandom();
              private volatile String pin;
              private ServerSocket server;
              private Thread acceptor;
              private volatile boolean closed;
              private Session current;

              AgentServer(Backend backend, String pin, int port) {
                  this(backend, pin, port, 10000, 1500);
              }

              AgentServer(Backend backend, String pin, int port, long idleMs, long beatMs) {
                  this.backend = backend;
                  this.pin = pin == null ? "" : pin;
                  this.port = port;
                  this.idleMs = idleMs;
                  this.beatMs = beatMs;
              }

              void setPin(String p) {
                  pin = p == null ? "" : p;
              }

              int port() {
                  return server == null ? port : server.getLocalPort();
              }

              synchronized boolean hasClient() {
                  return current != null;
              }

              /** Backend memberi tahu: layar kini tersedia. Bila klien sedang siaga, video dilanjutkan di sesi yang sama. */
              void videoReady() {
                  Session s;
                  synchronized (this) {
                      s = current;
                  }
                  if (s != null) s.resume();
              }

              /** Backend memberi tahu: layar hilang (sudah dihentikan di sisi backend). Klien masuk siaga + menerima alasannya. */
              void videoLost(String reason) {
                  Session s;
                  synchronized (this) {
                      s = current;
                  }
                  if (s != null) s.lost(reason);
              }

              /** Putuskan klien yang sedang tersambung (mis. encoder mati). Server tetap menerima sambungan baru. */
              void kick() {
                  Session s;
                  synchronized (this) {
                      s = current;
                  }
                  if (s != null) s.close();
              }

              void start() throws IOException {
                  ServerSocket ss = new ServerSocket();
                  ss.setReuseAddress(true);
                  try {
                      ss.bind(new InetSocketAddress(port));
                  } catch (IOException e) {
                      try { ss.close(); } catch (IOException ignored) { }
                      throw new IOException("Port " + port + " tidak bisa dibuka (" + e.getMessage() + ")");
                  }
                  server = ss;
                  acceptor = new Thread(this::acceptLoop, "agent-accept");
                  acceptor.setDaemon(true);
                  acceptor.start();
              }

              void stop() {
                  closed = true;
                  ServerSocket ss = server;
                  if (ss != null) {
                      try { ss.close(); } catch (IOException ignored) { }
                  }
                  Session s;
                  synchronized (this) {
                      s = current;
                      current = null;
                  }
                  if (s != null) s.close();
                  backend.stopVideo(null);
              }

              private void acceptLoop() {
                  while (!closed) {
                      final Socket s;
                      try {
                          s = server.accept();
                      } catch (IOException e) {
                          if (closed || server.isClosed()) return;
                          // galat sementara (mis. kehabisan deskriptor berkas): server berumur panjang, jangan berhenti menerima selamanya
                          try {
                              Thread.sleep(250);
                          } catch (InterruptedException ie) {
                              return;
                          }
                          continue;
                      }
                      Thread t = new Thread(() -> new Session(s).run(), "agent-client");
                      t.setDaemon(true);
                      t.start();
                  }
              }

              private final class Session implements Sink {
                  final Socket sock;
                  DataInputStream in;
                  DataOutputStream out;
                  final Object wlock = new Object();
                  volatile boolean dead;
                  volatile long lastWrite;
                  volatile boolean standby;
                  int maxSize, bitrate, fps;
                  Thread beat;
                  Thread self;

                  Session(Socket s) {
                      sock = s;
                  }

                  void close() {
                      dead = true;
                      try { sock.close(); } catch (IOException ignored) { }
                  }

                  void run() {
                      self = Thread.currentThread();
                      boolean owner = false;
                      try {
                          sock.setTcpNoDelay(true);
                          sock.setSoTimeout(5000);
                          in = new DataInputStream(new BufferedInputStream(sock.getInputStream(), 4096));
                          out = new DataOutputStream(new BufferedOutputStream(sock.getOutputStream(), 65536));

                          byte[] nonce = new byte[16];
                          rnd.nextBytes(nonce);
                          out.write(AgentWire.MAGIC);
                          out.writeByte(AgentWire.VERSION);
                          out.write(nonce);
                          out.flush();

                          byte[] got = new byte[32];
                          in.readFully(got);
                          maxSize = in.readInt();
                          bitrate = in.readInt();
                          fps = in.readInt();
                          if (!MessageDigest.isEqual(got, AgentWire.hash(nonce, pin))) {
                              out.writeByte(AgentWire.ST_BADPIN);
                              out.flush();
                              return;
                          }
                          if (maxSize < 0 || maxSize > 4096) maxSize = 0;
                          if (bitrate < 50000 || bitrate > 40000000) bitrate = 1000000;
                          if (fps < 1 || fps > 60) fps = 30;

                          // klien lolos PIN: gantikan klien lama
                          Session old;
                          synchronized (AgentServer.this) {
                              if (closed) return;
                              old = current;
                              current = this;
                              owner = true;
                          }
                          if (old != null) {
                              old.close();
                              try { old.self.join(3000); } catch (InterruptedException ignored) { }
                          }

                          // kunci tulis dipegang sejak encoder dimulai sampai header terkirim: paket pertama encoder
                          // (yang bisa keluar seketika) menunggu di sini, jadi tidak pernah mendahului header
                          synchronized (wlock) {
                              int[] size;
                              String notice = null;
                              try {
                                  size = backend.startVideo(maxSize, bitrate, fps, this);
                                  standby = false;
                              } catch (NoVideoException e) {
                                  standby = true;
                                  notice = e.getMessage();
                                  size = backend.screenSize();
                              } catch (Throwable e) {
                                  String m = e.getMessage() == null ? e.toString() : e.getMessage();
                                  out.write(AgentWire.errorReply(m));
                                  out.flush();
                                  return;
                              }
                              boolean ctl = backend.controlReady();
                              out.writeByte(standby ? (ctl ? AgentWire.ST_STANDBY : AgentWire.ST_STANDBY_NOCONTROL)
