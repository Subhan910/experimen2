          .rr .a{flex:1;min-width:0}
          .rr .a b{font:600 14px var(--mono)}
          .rr .a small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
          .rr .ms{color:var(--mute);font:12px var(--mono)}
          .tl{padding:6px 14px}
          .ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
          .ev:first-child{border-top:0}
          .ev .tm{flex:none;width:62px;color:var(--mute);font:12px var(--mono);padding-top:2px}
          .ev .tx{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
          .ev .tx small{display:block;color:var(--dim);font:12px var(--mono);margin-top:2px}
          .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
          </svg>
          <div class="page">
            <div class="row">
              <div class="grow"><h1 class="h1">IP &amp; Jaringan</h1><p class="sub" id="upd">Memuat...</p></div>
              <button class="btn sm" id="bRf" type="button"><svg class="i sm"><use href="#i-refresh"/></svg>Segarkan</button>
            </div>

            <div class="sec"><span>Antarmuka aktif</span><span class="chip" id="cnt">0</span></div>
            <div id="ifs"></div>

            <div class="sec"><span>Cek server</span></div>
            <div class="card">
              <label class="field" for="host">Alamat server</label>
              <input class="input mono" id="host" value="192.168.43.1" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Alamat server">
              <div class="ports" id="pc">
                <button class="pc" type="button" data-p="80">80 · WebUI</button>
                <button class="pc" type="button" data-p="9090">9090 · API</button>
                <button class="pc" type="button" data-p="8088">8088 · NAS</button>
              </div>
              <label class="field" for="ports">Port (pisahkan dengan koma)</label>
              <input class="input mono" id="ports" value="80,9090,8088" inputmode="numeric" placeholder="mis. 80,9090" aria-label="Port">
              <button class="btn pri blk" id="bChk" type="button" style="margin-top:14px"><svg class="i sm"><use href="#i-play"/></svg>Cek sekarang</button>
              <div class="res" id="chk" hidden></div>
            </div>

            <div class="sec"><span>Log jaringan</span><button class="btn sm ghost" id="bCp" type="button"><svg class="i sm"><use href="#i-copy"/></svg>Salin semua</button></div>
            <div class="card tl" id="log"></div>
          </div>
          <script>
          'use strict';
          var $ = function (s) { return document.querySelector(s); };
          function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
          var raw = { now: '', log: '' };

          function kind(n) {
            if (/^(ap|swlan|softap|wlan1)/i.test(n)) return ['Hotspot', 'acc'];
            if (/^(wlan|wifi)/i.test(n)) return ['Wi-Fi', 'ok'];
            if (/^(rmnet|ccmni|pdp|v4-rmnet|data|seth)/i.test(n)) return ['Seluler', 'warn'];
            if (/^(tun|tap|wg|ppp|ipsec)/i.test(n)) return ['VPN', 'acc'];
            if (/^(eth|usb|rndis)/i.test(n)) return ['Ethernet / USB', 'ok'];
            if (/^lo/i.test(n)) return ['Loopback', ''];
            return ['Lainnya', ''];
          }
          function copy(t) { CFM.copy(t).then(function () { CFM.toast('Disalin: ' + t); }); }

          function renderNow(s) {
            raw.now = s;
            var box = $('#ifs'); box.textContent = '';
            var items = [];
            s.split('\n').forEach(function (l) {
              var m = l.match(/^([^:\s]+):\s*(.+)$/);
              if (m) items.push({ n: m[1], ips: m[2].split(/,\s*/).filter(Boolean) });
            });
            $('#cnt').textContent = items.length;
            if (!items.length) {
              var e = el('div', 'card empty');
              e.appendChild(el('div', 'big', '📡'));
              e.appendChild(el('b', '', 'Tidak ada jaringan aktif'));
              e.appendChild(el('div', '', 'Hubungkan ke Wi-Fi atau aktifkan data seluler.'));
              box.appendChild(e);
              return;
            }
            items.forEach(function (it) {
              var c = el('div', 'card ifc fade-in'), hd = el('div', 'hd'), k = kind(it.n);
              hd.appendChild(el('span', 'nm', it.n));
              hd.appendChild(el('span', 'chip ' + k[1], k[0]));
              c.appendChild(hd);
              it.ips.forEach(function (ip) {
                var r = el('div', 'ip');
                r.appendChild(el('span', 'a', ip));
                r.appendChild(el('span', 'chip', ip.indexOf(':') >= 0 ? 'IPv6' : 'IPv4'));
                var ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                ic.setAttribute('class', 'i sm dim');
                var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                u.setAttribute('href', '#i-copy'); ic.appendChild(u); r.appendChild(ic);
                r.onclick = function () { copy(ip); };
                c.appendChild(r);
              });
              box.appendChild(c);
            });
          }

          function renderLog(s) {
            raw.log = s;
            var box = $('#log'); box.textContent = '';
            var lines = s.split('\n').filter(function (x) { return x.trim(); });
            if (!lines.length) { box.appendChild(el('div', 'empty', 'Belum ada kejadian jaringan.')); return; }
            lines.forEach(function (l) {
              var m = l.match(/^\[(\d\d:\d\d:\d\d)\]\s+Network\s+(up|down)\s+(.*)$/);
              var ev = el('div', 'ev');
              if (!m) { ev.appendChild(el('div', 'tx', l)); box.appendChild(ev); return; }
              ev.appendChild(el('div', 'tm', m[1]));
              var tx = el('div', 'tx'), up = m[2] === 'up', rest = m[3];
              var d = rest.match(/^(.*?),\s*address:\s*(.*?),\s*dns:\s*(.*)$/);
              var head = el('div');
              head.appendChild(el('span', 'chip ' + (up ? 'ok' : 'bad'), up ? 'Terhubung' : 'Putus'));
              head.appendChild(document.createTextNode('  ' + (d ? d[1] : rest)));
              tx.appendChild(head);
              if (d) tx.appendChild(el('small', '', (d[2] ? d[2] : '-') + '  ·  dns ' + (d[3] || '-')));
              ev.appendChild(tx);
              box.appendChild(ev);
            });
          }

          function refresh() {
            CFM.netInfo().then(renderNow);
            CFM.netLog().then(renderLog);
            var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
            $('#upd').textContent = 'Diperbarui ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
          }

          function verdict(r) {
            if (r === 'open') return ['ok', 'Terbuka', 'Server menerima koneksi'];
            if (r === 'refused') return ['warn', 'Ditolak', 'Alamat ada, tetapi server tidak berjalan'];
            if (r === 'timeout') return ['bad', 'Timeout', 'Alamat tidak terjangkau'];
            return ['bad', 'Gagal', String(r).replace(/^error:\s*/, '')];
          }

          function ports() { return $('#ports').value.split(/[,\s]+/).filter(function (p) { return /^\d+$/.test(p); }); }
          function syncChips() {
            var cur = ports();
            document.querySelectorAll('.pc').forEach(function (b) { b.classList.toggle('on', cur.indexOf(b.dataset.p) >= 0); });
          }
          document.querySelectorAll('.pc').forEach(function (b) {
            b.onclick = function () {
              var cur = ports(), i = cur.indexOf(b.dataset.p);
              if (i >= 0) cur.splice(i, 1); else cur.push(b.dataset.p);
              $('#ports').value = cur.join(',');
              syncChips();
            };
          });
          $('#ports').oninput = syncChips;

          $('#bRf').onclick = refresh;
          $('#bCp').onclick = function () {
            CFM.copy(raw.now + '\n' + raw.log).then(function () { CFM.toast('Disalin'); });
          };
          $('#bChk').onclick = function () {
            var host = $('#host').value.trim() || '192.168.43.1', ps = ports(), out = $('#chk'), btn = $('#bChk');
            out.hidden = false; out.textContent = '';
            if (!ps.length) { out.appendChild(el('div', 'dim', 'Isi port dulu, mis. 80,9090')); return; }
            btn.disabled = true;
            out.appendChild(el('div', 'dim', 'Memeriksa ' + ps.length + ' port...'));
            Promise.all(ps.map(function (p) {
              var t0 = Date.now();
              return CFM.checkPort(host, +p, 2000).then(function (r) { return { p: p, r: r, ms: Date.now() - t0 }; });
            })).then(function (l) {
              out.textContent = '';
              l.forEach(function (x) {
                var v = verdict(x.r), row = el('div', 'rr fade-in'), a = el('div', 'a');
                a.appendChild(el('b', '', host + ':' + x.p));
                a.appendChild(el('small', '', v[2]));
                row.appendChild(a);
                row.appendChild(el('span', 'ms', x.ms + ' ms'));
                row.appendChild(el('span', 'chip ' + v[0], v[1]));
                out.appendChild(row);
              });
            }).then(function () { btn.disabled = false; }, function () { btn.disabled = false; });
          };

          CFM.on('show', refresh);
          CFM.on('net', refresh);
          syncChips();
          refresh();
          </script>
          </body>
          </html>
          EOF_FILE
          cat > app/src/main/assets/plugins/kalkulator.html <<'EOF_FILE'
          <!doctype html>
          <html lang="id">
          <head>
