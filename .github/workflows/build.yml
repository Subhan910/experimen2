          .tile{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px}
          .empty{text-align:center;color:var(--dim);padding:48px 18px}
          .empty .big{font-size:38px;margin-bottom:10px}
          .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

          /* tombol */
          .btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:0 16px;min-height:44px;font:600 14px/1 system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s,filter .12s}
          .btn:active{transform:scale(.97);filter:brightness(1.18)}
          .btn.pri{background:linear-gradient(180deg,#5b86f6,var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(62,107,240,.8)}
          .btn.ghost{background:transparent}
          .btn.bad{color:var(--bad)}
          .btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
          .btn.blk{width:100%}
          .btn[disabled]{opacity:.45;pointer-events:none}
          .ibtn{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
          .ibtn:active{background:var(--card2);color:var(--text)}
