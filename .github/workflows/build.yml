          /**
           * Satu HP di phone farm. Terhubung lewat ADB WiFi (library dadb, tanpa server adb di HP ini),
           * lalu menjalankan scrcpy-server di HP target dan memutar aliran H.264-nya dengan MediaCodec.
           * Sentuhan dan tombol dikirim lewat saluran kontrol scrcpy.
           *
           * Perangkat bisa juga berjenis "Agen" (agent = true): HP itu menjalankan aplikasi ini dalam Mode Agen dan
           * disambung lewat TCP port 5600 dengan PIN, tanpa ADB sama sekali (lihat AgentWire).
           *
           * Mode "headless" (surface == null): aliran video dibuang tanpa didekode, hanya saluran kontrol
           * yang aktif. Dipakai agar HP lain tetap menerima perintah saat mode sinkron.
           */
          final class FarmDevice {

              static final int ST_IDLE = 0, ST_CONNECTING = 1, ST_LIVE = 2, ST_ERROR = 3;
              static final int KEY_HOME = 3, KEY_BACK = 4, KEY_VOL_UP = 24, KEY_VOL_DOWN = 25, KEY_POWER = 26, KEY_RECENTS = 187;
              static final int ACT_DOWN = 0, ACT_UP = 1, ACT_MOVE = 2;

              interface Listener {
                  void onChanged(FarmDevice d);
              }

              interface Result {
                  void done(FarmDevice d, String out, String err);
              }

              static final class Profile {
                  final int maxSize, bitrate, fps;

                  Profile(int maxSize, int bitrate, int fps) {
                      this.maxSize = maxSize;
                      this.bitrate = bitrate;
                      this.fps = fps;
                  }
              }

              // ---------- lingkungan bersama (kunci ADB, berkas scrcpy-server) ----------
              private static final byte[] POISON = new byte[0];
              private static final ExecutorService POOL = Executors.newCachedThreadPool(r -> {
                  Thread t = new Thread(r, "farm-pool");
                  t.setDaemon(true);
                  return t;
              });
              private static final ScheduledExecutorService WATCH = Executors.newSingleThreadScheduledExecutor(r -> {
                  Thread t = new Thread(r, "farm-watch");
                  t.setDaemon(true);
                  return t;
              });

              private static Context appCtx;
              private static AdbKeyPair keys;
              private static File jarFile;
              private static String serverVer = "";

              static void attach(Context c) {
                  appCtx = c.getApplicationContext();
              }

              // kunci ADB milik aplikasi ini. Dipakai bersama oleh sambungan WiFi (dadb) dan sambungan USB (UsbAdb),
              // jadi HP yang sudah diizinkan lewat USB langsung dipercaya saat disambung lewat WiFi.
              private static PrivateKey privKey;
              private static byte[] pubLine;

              static synchronized void initKeys() throws IOException {
                  if (keys != null) return;
                  Context c = appCtx;
                  if (c == null) throw new IOException("Konteks belum siap");
                  File dir = c.getNoBackupFilesDir(); // kunci ADB tidak ikut backup
                  File priv = new File(dir, "adbkey.pk8"), pub = new File(dir, "adbkey.pub");
                  try {
                      try {
                          if (!priv.exists() || !pub.exists()) generateKeys(priv, pub);
                          loadKeys(priv, pub);
                      } catch (Exception first) {
                          generateKeys(priv, pub);
                          loadKeys(priv, pub);
                      }
                  } catch (Exception e) {
                      throw new IOException("Kunci ADB gagal dibuat: " + e.getMessage());
                  }
                  keys = new AdbKeyPair(privKey, pubLine);
              }

              static PrivateKey privateKey() throws IOException {
                  initKeys();
                  return privKey;
              }

              /** Kunci publik dalam format ADB (base64 + komentar + NUL), siap dikirim ke HP. */
              static byte[] publicKeyLine() throws IOException {
                  initKeys();
                  return pubLine;
              }

              static synchronized void init() throws IOException {
                  initKeys();
                  if (jarFile != null) return;
                  Context c = appCtx;
                  File jar = new File(c.getCacheDir(), "cfm-scrcpy.jar");
                  String ver;
                  try {
                      try (InputStream in = c.getAssets().open("scrcpy-server.jar"); FileOutputStream os = new FileOutputStream(jar)) {
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = in.read(buf)) != -1) os.write(buf, 0, n);
                      }
                      try (InputStream in = c.getAssets().open("scrcpy-version.txt")) {
                          ver = new String(readAll(in), "UTF-8").trim();
                      }
                  } catch (IOException e) {
                      throw new IOException("scrcpy-server tidak ada di APK ini (" + e.getMessage() + ")");
                  }
                  jarFile = jar;
                  serverVer = ver;
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) != -1) bo.write(buf, 0, n);
                  return bo.toByteArray();
              }

              private static byte[] readBytes(File f) throws IOException {
                  try (InputStream in = new FileInputStream(f)) {
                      return readAll(in);
                  }
              }

              private static void writeBytes(File f, byte[] b) throws IOException {
                  try (FileOutputStream os = new FileOutputStream(f)) {
                      os.write(b);
                  }
              }

              private static void generateKeys(File priv, File pub) throws Exception {
                  KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
                  g.initialize(2048);
                  KeyPair kp = g.generateKeyPair();
                  byte[] adb = adbPublicKey((RSAPublicKey) kp.getPublic());
                  String line = Base64.encodeToString(adb, Base64.NO_WRAP) + " cfm@android";
                  writeBytes(priv, kp.getPrivate().getEncoded());
                  writeBytes(pub, line.getBytes("UTF-8"));
              }

              private static void loadKeys(File priv, File pub) throws Exception {
                  PrivateKey pk = KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(readBytes(priv)));
                  byte[] line = readBytes(pub);
                  pubLine = Arrays.copyOf(line, line.length + 1); // ADB mengharapkan akhiran NUL
                  privKey = pk;
              }

              // format kunci publik RSA milik ADB (struct RSAPublicKey), lihat adb_host_auth.c
              private static byte[] adbPublicKey(RSAPublicKey pubkey) {
                  final int words = 64; // 2048 bit / 32
                  BigInteger r32 = BigInteger.ZERO.setBit(32);
                  BigInteger n = pubkey.getModulus();
                  BigInteger r = BigInteger.ZERO.setBit(words * 32);
                  BigInteger rr = r.modPow(BigInteger.valueOf(2), n);
                  BigInteger rem = n.remainder(r32);
                  BigInteger n0inv = rem.modInverse(r32);
                  int[] myN = new int[words], myRr = new int[words];
                  for (int i = 0; i < words; i++) {
                      BigInteger[] res = rr.divideAndRemainder(r32);
                      rr = res[0];
                      rem = res[1];
                      myRr[i] = rem.intValue();
                      res = n.divideAndRemainder(r32);
                      n = res[0];
                      rem = res[1];
                      myN[i] = rem.intValue();
                  }
                  ByteBuffer bb = ByteBuffer.allocate(524).order(ByteOrder.LITTLE_ENDIAN);
                  bb.putInt(words);
                  bb.putInt(n0inv.negate().intValue());
                  for (int v : myN) bb.putInt(v);
                  for (int v : myRr) bb.putInt(v);
                  bb.putInt(pubkey.getPublicExponent().intValue());
                  return bb.array();
              }

              static String probe(String host, int port, int timeout) {
                  try (Socket k = new Socket()) {
                      k.connect(new InetSocketAddress(host, port), timeout);
                      return "open";
                  } catch (SocketTimeoutException e) {
                      return "timeout";
                  } catch (Exception e) {
                      String m = String.valueOf(e.getMessage());
                      return m.contains("refused") ? "refused" : "error: " + m;
                  }
              }

              // ---------- pesan kontrol scrcpy ----------
              static byte[] touchMsg(int action, int x, int y, int w, int h) {
                  ByteBuffer b = ByteBuffer.allocate(32);
                  b.put((byte) 2).put((byte) action);
                  b.putLong(-2L); // POINTER_ID_GENERIC_FINGER
                  b.putInt(x).putInt(y).putShort((short) w).putShort((short) h);
                  b.putShort((short) (action == ACT_UP ? 0 : 0xffff)); // tekanan 1.0 (u16 fixed point)
                  b.putInt(0).putInt(0);
                  return b.array();
              }

              static byte[] keyMsg(int action, int code) {
                  ByteBuffer b = ByteBuffer.allocate(14);
                  b.put((byte) 0).put((byte) action).putInt(code).putInt(0).putInt(0);
                  return b.array();
              }

              static byte[] textMsg(String s) {
                  byte[] t;
                  try {
                      t = s.getBytes("UTF-8");
                  } catch (Exception e) {
                      t = new byte[0];
                  }
                  ByteBuffer b = ByteBuffer.allocate(5 + t.length);
                  b.put((byte) 1).putInt(t.length).put(t);
                  return b.array();
              }

              static byte[] simpleMsg(int type) {
                  return new byte[]{(byte) type};
              }

              // ---------- data per perangkat ----------
              final String host;
              final int port;
              /** true = HP farm menjalankan Mode Agen (tanpa ADB). */
