            if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
            return String(parseFloat(v.toPrecision(12)));
          }
          function group(s) { // 1234567.5 -> 1.234.567,5 hanya untuk tampilan hasil
            var m = s.match(/^(-?)(\d+)(\.\d+)?(e.*)?$/);
            if (!m) return s;
            return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (m[3] ? ',' + m[3].slice(1) : '') + (m[4] || '');
          }

          function paint() {
            disp.textContent = exp || '0';
            var n = (exp || '0').length;
            disp.style.fontSize = n > 20 ? '24px' : n > 14 ? '30px' : n > 9 ? '38px' : '46px';
            res.className = '';
            try {
              var r = fmt(calc(exp));
              res.textContent = exp === r || !exp ? '' : '= ' + group(r);
            } catch (e) { res.textContent = ''; }
          }

          function key(k) {
            var isNum = /[0-9.()]/.test(k);
            if (k === 'C') { exp = ''; last.textContent = ''; justEq = false; }
            else if (k === '←') { exp = exp.slice(0, -1); justEq = false; }
            else if (k === '=') {
              if (!exp) return;
