              boolean lockScreen() {
                  if (Build.VERSION.SDK_INT < 28) return false;
                  main.post(() -> {
                      try {
                          performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
                      } catch (Throwable ignored) { }
                  });
                  return true;
              }

