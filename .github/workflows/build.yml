            sv.appendChild(svt);
            st.appendChild(cnt); st.appendChild(sv);
            s.appendChild(st);
            app.appendChild(s);

            function stats() { cnt.textContent = words(b.value + ' ' + t.value) + ' kata · ' + b.value.length + ' karakter'; }
            function commit() {
              cur.t = t.value.trim(); cur.b = b.value;
              if (blank(cur)) return;
