          package id.cfm.webui;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.security.PrivateKey;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import javax.crypto.Cipher;

          /**
           * Klien ADB lewat kabel USB (HP ini sebagai host, HP target sebagai perangkat). Dipakai untuk mengaktifkan
           * ADB WiFi di HP target tanpa PC: baca IP-nya, lalu kirim "tcpip:5555".
           *
           * Lapisan transport dipisah (Pipe) supaya protokolnya bisa diuji tanpa perangkat keras.
           */
          final class UsbAdb {

              /** Saluran dua arah ke HP target. */
              interface Pipe {
                  /** Baca paling banyak len byte. Mengembalikan jumlah byte, 0 atau negatif bila belum ada data. */
                  int read(byte[] b, int off, int len, int timeoutMs);

                  int write(byte[] b, int off, int len, int timeoutMs);

                  /** false bila kabel sudah dicabut. */
                  boolean alive();
              }

              interface Waiter {
                  /** Dipanggil saat HP target menunggu pengguna menekan "Izinkan debugging". */
                  void onAuthPrompt();
              }

              static final int A_CNXN = 0x4e584e43, A_AUTH = 0x48545541, A_OPEN = 0x4e45504f,
                      A_OKAY = 0x59414b4f, A_CLSE = 0x45534c43, A_WRTE = 0x45545257;
              static final int AUTH_TOKEN = 1, AUTH_SIGNATURE = 2, AUTH_RSAPUBLICKEY = 3;
              private static final int VERSION = 0x01000000, MAXDATA = 4096;
              private static final int READ_CHUNK = 16384; // batas buffer bulkTransfer di Android
              private static final byte[] SIG_PAD = buildPad();
              private static final Pattern INET = Pattern.compile("inet\\s+(?:addr:)?(\\d{1,3}(?:\\.\\d{1,3}){3})");

              private static final class Msg {
                  int cmd, a0, a1;
                  byte[] data;
              }

              private final Pipe pipe;
              private final PrivateKey key;
              private final byte[] pubLine;
              private final byte[] rbuf = new byte[READ_CHUNK];
              private int rpos, rlen;
              private int nextId = 1;
              String banner = "";

              UsbAdb(Pipe pipe, PrivateKey key, byte[] pubLine) {
                  this.pipe = pipe;
                  this.key = key;
                  this.pubLine = pubLine;
              }

              // padding PKCS#1 v1.5 untuk SHA-1 (token ADB dianggap sudah berupa hash 20 byte)
              private static byte[] buildPad() {
                  byte[] prefix = {0x30, 0x21, 0x30, 0x09, 0x06, 0x05, 0x2b, 0x0e, 0x03, 0x02, 0x1a, 0x05, 0x00, 0x04, 0x14};
                  byte[] p = new byte[256 - 20];
                  p[0] = 0;
                  p[1] = 1;
                  for (int i = 2; i < p.length - prefix.length - 1; i++) p[i] = (byte) 0xff;
                  p[p.length - prefix.length - 1] = 0;
                  System.arraycopy(prefix, 0, p, p.length - prefix.length, prefix.length);
                  return p;
              }

              static byte[] signToken(PrivateKey key, byte[] token) throws IOException {
                  try {
                      Cipher c = Cipher.getInstance("RSA/ECB/NoPadding");
                      c.init(Cipher.ENCRYPT_MODE, key);
                      c.update(SIG_PAD);
                      return c.doFinal(token);
                  } catch (Exception e) {
                      throw new IOException("Gagal menandatangani token: " + e.getMessage());
                  }
              }

              // ---------- kirim / terima pesan ----------
              private static int checksum(byte[] d) {
                  int s = 0;
                  if (d != null) for (byte b : d) s += b & 0xff;
                  return s;
              }

              private void writeAll(byte[] b, int len) throws IOException {
                  int off = 0;
                  int zero = 0;
                  while (off < len) {
                      int n = pipe.write(b, off, len - off, 4000);
                      if (n < 0 || (n == 0 && ++zero > 3)) {
                          throw new IOException(pipe.alive() ? "Gagal menulis ke USB" : "Kabel USB terlepas");
                      }
                      off += n;
                  }
              }

              private void send(int cmd, int a0, int a1, byte[] data) throws IOException {
                  int len = data == null ? 0 : data.length;
                  ByteBuffer h = ByteBuffer.allocate(24).order(ByteOrder.LITTLE_ENDIAN);
                  h.putInt(cmd).putInt(a0).putInt(a1).putInt(len).putInt(checksum(data)).putInt(cmd ^ 0xffffffff);
                  writeAll(h.array(), 24); // header dan isi dikirim sebagai dua transfer terpisah, seperti adb
                  if (len > 0) writeAll(data, len);
              }

              private void need(long deadline) throws IOException {
                  while (rpos >= rlen) {
                      int n = pipe.read(rbuf, 0, READ_CHUNK, 1000);
                      if (n > 0) {
                          rpos = 0;
                          rlen = n;
                          return;
                      }
                      if (!pipe.alive()) throw new IOException("Kabel USB terlepas");
                      if (System.currentTimeMillis() > deadline) throw new IOException("HP tidak merespons");
                  }
              }

              private byte[] readBytes(int count, long deadline) throws IOException {
                  byte[] out = new byte[count];
                  int got = 0;
                  while (got < count) {
                      need(deadline);
                      int n = Math.min(count - got, rlen - rpos);
                      System.arraycopy(rbuf, rpos, out, got, n);
                      rpos += n;
                      got += n;
                  }
                  return out;
              }

              private Msg read(long deadline) throws IOException {
                  ByteBuffer b = ByteBuffer.wrap(readBytes(24, deadline)).order(ByteOrder.LITTLE_ENDIAN);
                  Msg m = new Msg();
                  m.cmd = b.getInt();
                  m.a0 = b.getInt();
                  m.a1 = b.getInt();
                  int len = b.getInt();
                  b.getInt(); // checksum
                  int magic = b.getInt();
                  if (magic != (m.cmd ^ 0xffffffff) || len < 0 || len > (1 << 20)) throw new IOException("Paket USB rusak");
                  m.data = len > 0 ? readBytes(len, deadline) : new byte[0];
                  return m;
              }

              // ---------- koneksi ----------
              /** Jabat tangan + otorisasi. Menunggu sampai timeoutMs bila pengguna harus menekan Izinkan di HP target. */
              void connect(long timeoutMs, Waiter w) throws IOException {
                  long deadline = System.currentTimeMillis() + timeoutMs;
                  send(A_CNXN, VERSION, MAXDATA, "host::\0".getBytes("UTF-8"));
                  boolean signed = false, keySent = false;
                  while (true) {
                      Msg m = read(deadline);
                      if (m.cmd == A_CNXN) {
                          banner = new String(m.data, "UTF-8");
                          return;
                      }
                      if (m.cmd == A_AUTH && m.a0 == AUTH_TOKEN) {
                          if (!signed) {
                              send(A_AUTH, AUTH_SIGNATURE, 0, signToken(key, m.data));
                              signed = true;
                          } else if (!keySent) {
                              send(A_AUTH, AUTH_RSAPUBLICKEY, 0, pubLine);
                              keySent = true;
                              if (w != null) w.onAuthPrompt();
                          } else {
                              throw new IOException("HP menolak izin debugging");
                          }
                      }
                      // pesan lain (sisa sesi sebelumnya) diabaikan
                  }
              }

              /** Buka layanan (mis. "shell:ip addr") dan kumpulkan keluarannya sampai ditutup. */
              String service(String name, long timeoutMs, boolean stopAtNewline) throws IOException {
                  long deadline = System.currentTimeMillis() + timeoutMs;
                  int local = nextId++;
                  send(A_OPEN, local, 0, (name + "\0").getBytes("UTF-8"));
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  int remote = -1;
                  while (true) {
                      Msg m = read(deadline);
                      if (m.cmd == A_OKAY && m.a1 == local) {
                          remote = m.a0;
                      } else if (m.cmd == A_WRTE && m.a1 == local) {
                          out.write(m.data, 0, m.data.length);
                          boolean done = stopAtNewline && indexOfNewline(m.data) >= 0;
                          try {
                              send(A_OKAY, local, m.a0, null);
                          } catch (IOException e) {
                              if (!done) throw e; // HP sengaja memutus USB saat adbd restart: balasan sudah kita terima
                          }
                          if (done) return out.toString("UTF-8");
                      } else if (m.cmd == A_CLSE && (m.a1 == local || (remote >= 0 && m.a0 == remote))) {
                          return out.toString("UTF-8");
                      }
                  }
              }

              private static int indexOfNewline(byte[] d) {
                  for (int i = 0; i < d.length; i++) if (d[i] == '\n') return i;
                  return -1;
              }

              String shell(String cmd) throws IOException {
                  return service("shell:" + cmd, 15000, false).replace("\r", "");
              }

              /** Mengalihkan adbd HP target ke mode TCP. Mengembalikan balasan HP. */
              String tcpip(int port) throws IOException {
                  return service("tcpip:" + port, 10000, true).trim();
              }

              /** IP WiFi dari keluaran "ip -o -f inet addr show" dan "ifconfig wlan0" (HP lama). */
              static String parseWifiIp(String out) {
                  if (out == null) return "";
                  String fallback = "";
                  for (String line : out.split("\n")) {
                      Matcher m = INET.matcher(line);
                      if (!m.find()) continue;
                      String ip = m.group(1);
                      if (ip.startsWith("127.")) continue;
                      String l = line.toLowerCase();
                      if (l.contains("wlan") || l.contains("wifi") || l.contains(" wl")) return ip;
                      if (l.contains("rmnet") || l.contains("ccmni") || l.contains("tun") || l.contains("lo ")) continue;
                      if (fallback.isEmpty()) fallback = ip;
                  }
                  return fallback;
              }
          }
