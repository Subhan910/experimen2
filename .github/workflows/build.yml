      - name: Unduh scrcpy-server (untuk kontrol HP lewat WiFi)
        run: |
          set -e
          SCRCPY_VER=3.3.3
          SCRCPY_SHA256=7e70323ba7f259649dd4acce97ac4fefbae8102b2c6d91e2e7be613fd5354be0
          A=webui-app/app/src/main/assets
          mkdir -p "$A"
          curl -fsSL --retry 3 -o "$A/scrcpy-server.jar" "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VER}/scrcpy-server-v${SCRCPY_VER}"
          echo "${SCRCPY_SHA256}  $A/scrcpy-server.jar" | sha256sum -c -
          echo "${SCRCPY_VER}" > "$A/scrcpy-version.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: webui-app
        run: gradle assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp webui-app/app/build/outputs/apk/debug/app-debug.apk CFM-WebUI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CFM-WebUI-apk
          path: CFM-WebUI.apk

      - name: Rilis (unduh APK langsung dari tab Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "apk-${{ github.run_number }}"
          name: "CFM WebUI #${{ github.run_number }}"
          files: CFM-WebUI.apk
