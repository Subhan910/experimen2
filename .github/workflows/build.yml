              /** Layout yang menaruh satu konten video di tengah dengan rasio aspek yang benar. */
              static final class Fit extends FrameLayout {
                  float boxRatio; // tinggi/lebar wadah, 0 = ikuti induk
                  float ratio;    // lebar/tinggi video, 0 = isi penuh
                  View content;

                  Fit(Context c) {
                      super(c);
                  }

                  void setRatio(float r) {
                      if (Math.abs(r - ratio) > 0.0005f) {
                          ratio = r;
                          requestLayout();
                      }
                  }

                  @Override
                  protected void onMeasure(int wm, int hm) {
                      if (boxRatio > 0) {
                          int w = MeasureSpec.getSize(wm);
                          super.onMeasure(MeasureSpec.makeMeasureSpec(w, MeasureSpec.EXACTLY),
                                  MeasureSpec.makeMeasureSpec(Math.round(w * boxRatio), MeasureSpec.EXACTLY));
                      } else {
                          super.onMeasure(wm, hm);
                      }
                  }

                  @Override
                  protected void onLayout(boolean changed, int l, int t, int r, int b) {
                      int w = r - l, hh = b - t;
                      for (int i = 0; i < getChildCount(); i++) {
                          View c = getChildAt(i);
                          if (c == content && ratio > 0) {
                              int cw = w, ch = Math.round(w / ratio);
                              if (ch > hh) {
                                  ch = hh;
                                  cw = Math.round(hh * ratio);
                              }
                              int x = (w - cw) / 2, y = (hh - ch) / 2;
                              c.layout(x, y, x + cw, y + ch);
                          } else {
                              c.layout(0, 0, w, hh);
                          }
                      }
                  }
              }

              /** ScrollView dengan tinggi maksimum, dipakai di dalam dialog. */
              static final class MaxScroll extends ScrollView {
                  int max;

                  MaxScroll(Context c, int max) {
                      super(c);
                      this.max = max;
                  }

                  @Override
                  protected void onMeasure(int wm, int hm) {
                      super.onMeasure(wm, MeasureSpec.makeMeasureSpec(max, MeasureSpec.AT_MOST));
                  }
              }

              // ---------- satu kotak HP di grid ----------
              private final class Tile implements TextureView.SurfaceTextureListener {
                  final FarmDevice dev;
                  final LinearLayout card;
                  final View dotV;
                  final TextView nameTv, hostTv, status;
                  final Fit screen;
                  final TextureView tv;
                  Surface surface;
                  int retries;
                  final Runnable retry = new Runnable() {
                      @Override
                      public void run() {
                          if (active && detail == null && dev.state == FarmDevice.ST_ERROR) applyStreams();
                      }
                  };

                  Tile(FarmDevice d) {
                      dev = d;
                      card = new LinearLayout(h);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(dp(6), dp(6), dp(6), dp(6));
                      card.setBackground(h.rip(MainActivity.CARD, 12, MainActivity.LINE));
                      card.setOnClickListener(v -> {
                          if (dev.state == FarmDevice.ST_ERROR) {
                              retries = 0;
                              dev.invalidate();
                              applyStreams();
                          } else {
                              openDetail(dev);
                          }
                      });
                      card.setOnLongClickListener(v -> {
                          tileMenu(dev);
                          return true;
                      });

                      LinearLayout head = new LinearLayout(h);
                      head.setGravity(Gravity.CENTER_VERTICAL);
                      head.setPadding(dp(4), dp(2), 0, dp(6));
                      dotV = new View(h);
                      LinearLayout.LayoutParams dp0 = new LinearLayout.LayoutParams(dp(8), dp(8));
                      dp0.setMargins(0, 0, dp(7), 0);
                      head.addView(dotV, dp0);
                      LinearLayout col = new LinearLayout(h);
                      col.setOrientation(LinearLayout.VERTICAL);
                      nameTv = h.text("", 12.5f, MainActivity.FG, true);
                      nameTv.setSingleLine(true);
                      nameTv.setEllipsize(TextUtils.TruncateAt.END);
                      hostTv = h.text(d.host, 10, MainActivity.DIM, false);
                      hostTv.setSingleLine(true);
                      hostTv.setEllipsize(TextUtils.TruncateAt.END);
                      col.addView(nameTv);
                      col.addView(hostTv);
                      head.addView(col, new LinearLayout.LayoutParams(0, -2, 1));
                      ImageView more = h.icon(R.drawable.ic_more, MainActivity.DIM, 18);
                      more.setPadding(dp(4), dp(4), dp(4), dp(4));
                      more.setOnClickListener(v -> tileMenu(dev));
                      head.addView(more, new LinearLayout.LayoutParams(dp(26), dp(26)));
                      card.addView(head, new LinearLayout.LayoutParams(-1, -2));

                      screen = new Fit(h);
                      screen.boxRatio = 2.0f;
                      screen.setBackground(h.shape(0xFF05070B, 8));
                      tv = new TextureView(h);
                      tv.setSurfaceTextureListener(this);
                      screen.content = tv;
                      screen.addView(tv, new FrameLayout.LayoutParams(-1, -1));
                      status = h.text("", 11, MainActivity.DIM, false);
                      status.setGravity(Gravity.CENTER);
                      status.setPadding(dp(8), dp(8), dp(8), dp(8));
                      screen.addView(status, new FrameLayout.LayoutParams(-1, -1));
                      card.addView(screen, new LinearLayout.LayoutParams(-1, -2));
                  }

                  void dispose() {
                      ui.removeCallbacks(retry);
                  }

                  @Override
                  public void onSurfaceTextureAvailable(SurfaceTexture st, int w, int hh) {
                      surface = new Surface(st);
                      applyStreams();
                  }

                  @Override
                  public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int hh) { }

                  @Override
                  public boolean onSurfaceTextureDestroyed(final SurfaceTexture st) {
                      final Surface s = surface;
                      surface = null;
                      if (s == null) return true;
                      // lepas Surface hanya setelah decoder benar-benar berhenti memakainya
                      dev.stopSurface(s, () -> {
                          try { s.release(); } catch (Throwable ignored) { }
                          try { st.release(); } catch (Throwable ignored) { }
                      });
                      return false;
                  }

                  @Override
                  public void onSurfaceTextureUpdated(SurfaceTexture st) { }

                  void onState() {
                      if (dev.state == FarmDevice.ST_LIVE) {
                          retries = 0;
                      } else if (dev.state == FarmDevice.ST_ERROR && active && detail == null && retries < MAX_RETRY) {
                          retries++;
                          ui.removeCallbacks(retry);
                          ui.postDelayed(retry, 5000L * retries);
                      }
                      refresh();
                  }

                  void refresh() {
                      nameTv.setText(dev.label());
                      hostTv.setText(dev.host + (dev.agent ? " · Agen" : (dev.port != 5555 ? ":" + dev.port : "")));
                      dotV.setBackground(dot(dotColor(dev)));
                      if (dev.vw > 0 && dev.vh > 0) screen.setRatio(dev.vw / (float) dev.vh);
                      switch (dev.state) {
                          case FarmDevice.ST_LIVE:
                              if (dev.standby) {
                                  status.setVisibility(View.VISIBLE);
                                  status.setTextColor(MainActivity.WARN);
                                  status.setText("Siaga · layar tidak dikirim\nKetuk untuk kontrol atau Ambil layar");
                              } else {
                                  status.setVisibility(View.GONE);
                              }
                              break;
                          case FarmDevice.ST_CONNECTING:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.DIM);
                              status.setText(dev.message);
                              break;
                          case FarmDevice.ST_ERROR:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.BAD);
                              status.setText(dev.message + "\n\n" + (retries < MAX_RETRY ? "Mencoba lagi otomatis..." : "Ketuk untuk mencoba lagi"));
                              break;
                          default:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.DIM);
                              status.setText(active && detail == null ? "Menunggu..." : "Berhenti");
                      }
                  }
              }

              private void tileMenu(final FarmDevice d) {
                  final boolean canReclaim = d.agent && d.state == FarmDevice.ST_LIVE && d.standby;
                  final List<String> items = new ArrayList<>();
                  items.add("Buka kontrol");
                  if (canReclaim) items.add("Ambil layar");
                  items.add("Mulai ulang");
                  items.add("Perintah shell");
                  items.add("Ubah nama / alamat");
                  items.add("Hapus dari daftar");
                  final String[] arr = items.toArray(new String[0]);
                  h.new Dlg(h).setTitle(d.label()).setItems(arr, (dlg, i) -> {
                      String what = arr[i];
                      if (what.equals("Buka kontrol")) {
                          openDetail(d);
                      } else if (what.equals("Ambil layar")) {
                          reclaimScreen(d);
                      } else if (what.equals("Mulai ulang")) {
                          Tile t = tiles.get(d);
                          d.invalidate();
                          if (t != null) t.retries = 0;
                          if (t != null && t.surface != null && active && detail == null) d.start(t.surface, GRID[quality]);
                      } else if (what.equals("Perintah shell")) {
                          List<FarmDevice> one = new ArrayList<>();
                          one.add(d);
                          shellDialog(one, d.label());
                      } else if (what.equals("Ubah nama / alamat")) {
                          editDialog(d);
                      } else {
                          removeDevice(d);
                      }
                  }).show();
              }

              private void removeDevice(FarmDevice d) {
                  d.stop();
                  devs.remove(d);
                  save();
                  rebuildGrid();
              }

              // ---------- layar kontrol satu HP ----------
              private void openDetail(FarmDevice d) {
                  if (detail != null) return;
                  detail = new Detail(d);
                  detailHost.removeAllViews();
                  detailHost.addView(detail.page, new FrameLayout.LayoutParams(-1, -1));
                  detailHost.setVisibility(View.VISIBLE);
                  gridPage.setVisibility(View.GONE);
                  h.farmChanged();
                  applyStreams();
              }

              private void closeDetail() {
                  Detail dt = detail;
                  if (dt == null) return;
                  detail = null;
                  dt.dispose();
                  detailHost.removeAllViews();
                  detailHost.setVisibility(View.GONE);
                  gridPage.setVisibility(View.VISIBLE);
                  for (Tile t : tiles.values()) t.retries = 0;
                  h.farmChanged();
                  applyStreams();
                  updateSummary();
              }

