          .steps span.on{background:var(--acc)}
          .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(122,167,255,.16);color:var(--acc);font-size:12px;font-weight:700;margin-right:8px}
          .ct{display:flex;align-items:center;font-weight:700;font-size:15px;margin:0 0 12px}
          .ct .grow{display:flex;align-items:center}
          #inp{min-height:170px;font:13px/1.55 var(--mono)}
          #out{min-height:260px;font:12.5px/1.6 var(--mono);white-space:pre;overflow:auto;background:#080a12;color:#cfe0ff;border-color:#1b2233}
          #err{color:var(--bad);font-size:13px;white-space:pre-wrap;word-break:break-all;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25)}
          .act{display:flex;gap:10px;margin-top:12px}
          .act .btn{flex:1}
          .gap{height:12px}
          </style>
