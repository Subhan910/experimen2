          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
            <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></symbol>
            <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></symbol>
            <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
          </svg>
          <div id="app"></div>
          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            share: function (t) { if (navigator.share) return navigator.share({ text: t }); return Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var app = document.getElementById('app');
          var notes = [], cur = null, q = '', flushFn = null;

          function h(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
          }
          function ico(name, cls) {
            var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
            var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            u.setAttribute('href', '#i-' + name);
            s.appendChild(u);
            return s;
          }
          function ibtn(name, label, fn, cls) {
            var b = h('button', 'ibtn' + (cls ? ' ' + cls : ''));
            b.type = 'button';
            b.setAttribute('aria-label', label);
            b.appendChild(ico(name));
            b.onclick = fn;
            return b;
          }
          function persist() {
            var clean = notes.map(function (n) { return { t: n.t, b: n.b, u: n.u, p: n.p ? 1 : 0 }; });
            return C.set('n', JSON.stringify(clean));
          }
          function words(s) { return (s.trim().match(/\S+/g) || []).length; }
          function when(ts) {
            if (!ts || ts < 1e11) return '';
            var d = new Date(ts), n = new Date(), p2 = function (x) { return (x < 10 ? '0' : '') + x; };
            var day = function (x) { return x.getFullYear() * 400 + x.getMonth() * 32 + x.getDate(); };
            if (day(d) === day(n)) return 'Hari ini, ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            var y = new Date(n.getTime() - 864e5);
            if (day(d) === day(y)) return 'Kemarin, ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            var o = { day: 'numeric', month: 'short' };
            if (d.getFullYear() !== n.getFullYear()) o.year = 'numeric';
            return d.toLocaleDateString('id-ID', o);
          }
          function ordered() {
            var l = notes.slice();
            l.sort(function (a, b) { return (b.p ? 1 : 0) - (a.p ? 1 : 0) || b.u - a.u; });
            if (q) {
              var k = q.toLowerCase();
              l = l.filter(function (n) { return (n.t + '\n' + n.b).toLowerCase().indexOf(k) >= 0; });
            }
            return l;
          }
          function blank(n) { return !n.t.trim() && !n.b.trim(); }

          /* ---------- daftar ---------- */
          function showList(keepFocus) {
            cur = null; flushFn = null;
            app.textContent = '';
            var s = h('div', 'screen fade-in');
            var bar = h('header', 'appbar');
            var sw = h('div', 'search');
            sw.appendChild(ico('search'));
            var qi = h('input', 'input');
            qi.type = 'search'; qi.placeholder = 'Cari catatan'; qi.value = q;
            qi.setAttribute('aria-label', 'Cari catatan');
            sw.appendChild(qi);
            bar.appendChild(sw);
            bar.appendChild(ibtn('save', 'Cadangkan semua', function () {
              if (!notes.length) { C.toast('Belum ada catatan'); return; }
              var all = notes.map(function (o) { return '== ' + (o.t || '') + ' ==\n' + (o.b || '') + '\n\n'; }).join('');
              C.share(all);
            }));
            s.appendChild(bar);

            var sc = h('div', 'scroll');
            var list = h('div');
            sc.appendChild(list);
            s.appendChild(sc);
            var fab = h('button', 'fab');
            fab.type = 'button'; fab.setAttribute('aria-label', 'Catatan baru');
            fab.appendChild(ico('plus'));
            fab.firstChild.setAttribute('style', 'width:26px;height:26px;stroke-width:2.4');
            fab.onclick = function () { openNote(null); };
            s.appendChild(fab);
            app.appendChild(s);

            function render() {
              list.textContent = '';
              var l = ordered();
              if (!notes.length) {
                var e = h('div', 'empty');
                e.appendChild(h('div', 'big', '📝'));
                e.appendChild(h('b', '', 'Belum ada catatan'));
                e.appendChild(h('div', '', 'Ketuk tombol + untuk membuat catatan pertama.'));
                list.appendChild(e);
                return;
              }
              if (!l.length) {
                var e2 = h('div', 'empty');
                e2.appendChild(h('div', 'big', '🔎'));
                e2.appendChild(h('b', '', 'Tidak ditemukan'));
                e2.appendChild(h('div', '', 'Tidak ada catatan yang cocok dengan "' + q + '".'));
                list.appendChild(e2);
                return;
              }
              list.appendChild(h('div', 'count', l.length + (q ? ' hasil' : ' catatan')));
              l.forEach(function (n) {
                var card = h('div', 'card tap note');
                var t = h('div', 't');
                t.appendChild(h('span', '', n.t || '(tanpa judul)'));
                if (n.p) t.appendChild(ico('pin', 'sm'));
                card.appendChild(t);
                var body = n.b.replace(/\s+/g, ' ').trim();
                if (body) card.appendChild(h('div', 'p', body.slice(0, 160)));
                var w = when(n.u);
                if (w) card.appendChild(h('div', 'd', w));
                card.onclick = function () { openNote(n); };
                list.appendChild(card);
              });
            }
            qi.oninput = function () { q = qi.value.trim(); render(); };
            render();
            if (keepFocus) qi.focus();
          }

          /* ---------- editor ---------- */
          function leave() {
            if (flushFn) flushFn();
            if (cur && blank(cur)) {
              var i = notes.indexOf(cur);
              if (i >= 0) { notes.splice(i, 1); persist(); }
            }
            showList();
          }
          function openNote(n) {
            var isNew = !n;
            cur = n || { t: '', b: '', u: Date.now(), p: 0 };
            app.textContent = '';
            var s = h('div', 'screen fade-in');
            var bar = h('header', 'appbar');
            bar.appendChild(ibtn('back', 'Kembali', leave));
            bar.appendChild(h('div', 'grow'));
            var pin = ibtn('pin', 'Sematkan', function () {
              cur.p = cur.p ? 0 : 1;
              pin.classList.toggle('on', !!cur.p);
              cur.u = Date.now();
              commit();
              C.toast(cur.p ? 'Disematkan' : 'Sematan dilepas');
            }, cur.p ? 'on' : '');
            bar.appendChild(pin);
            bar.appendChild(ibtn('copy', 'Salin', function () {
              C.copy((t.value ? t.value + '\n\n' : '') + b.value).then(function () { C.toast('Disalin'); });
            }));
            bar.appendChild(ibtn('share', 'Bagikan', function () { C.share(t.value + '\n\n' + b.value); }));
            bar.appendChild(ibtn('trash', 'Hapus', function () {
              if (blank(cur) || confirm('Hapus catatan ini?')) {
                clearTimeout(tm); flushFn = null;
                var i = notes.indexOf(cur);
                if (i >= 0) { notes.splice(i, 1); persist(); }
                cur = null;
                showList();
              }
            }));
            s.appendChild(bar);

            var t = h('input', 'ti'); t.placeholder = 'Judul'; t.value = cur.t; t.setAttribute('aria-label', 'Judul');
            var b = h('textarea', 'bi'); b.placeholder = 'Mulai menulis...'; b.value = cur.b; b.setAttribute('aria-label', 'Isi catatan');
            s.appendChild(t); s.appendChild(b);

            var st = h('div', 'stat');
            var cnt = h('span', '');
            var sv = h('span', 'chip ok saved');
            sv.appendChild(ico('check', 'sm'));
            var svt = h('span', '', 'Tersimpan');
            sv.appendChild(svt);
            st.appendChild(cnt); st.appendChild(sv);
            s.appendChild(st);
            app.appendChild(s);

            function stats() { cnt.textContent = words(b.value + ' ' + t.value) + ' kata · ' + b.value.length + ' karakter'; }
            function commit() {
              cur.t = t.value.trim(); cur.b = b.value;
              if (blank(cur)) return;
              if (notes.indexOf(cur) < 0) notes.push(cur);
              persist();
            }
            var tm;
            function later() {
              stats();
              cur.u = Date.now();
              sv.className = 'chip warn saved'; svt.textContent = 'Menyimpan...';
              clearTimeout(tm);
              tm = setTimeout(function () { commit(); sv.className = 'chip ok saved'; svt.textContent = 'Tersimpan'; }, 500);
            }
            t.oninput = b.oninput = later;
            flushFn = function () { clearTimeout(tm); commit(); };
            stats();
            if (isNew) t.focus();
          }

          C.onBack(function () {
            if (cur) { leave(); return true; }
            if (q) { q = ''; showList(); return true; }
            return false;
          });
          addEventListener('cfm:hide', function () { if (flushFn) flushFn(); });
          document.addEventListener('visibilitychange', function () { if (document.hidden && flushFn) flushFn(); });

          C.get('n').then(function (s) {
            try { notes = JSON.parse(s || '[]'); } catch (e) { notes = []; }
            if (!Array.isArray(notes)) notes = [];
            // catatan lama belum punya waktu: pertahankan urutan lama (yang terakhir ditambahkan di atas)
            notes = notes.map(function (n, i) {
              return { t: String(n.t || ''), b: String(n.b || ''), u: n.u || (i + 1), p: n.p ? 1 : 0 };
            });
            showList();
          });
          </script>
          </body>
          </html>
          EOF_FILE
