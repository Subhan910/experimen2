                              runShell(targets, cmd);
                          })
                          .setNegativeButton("Batal", null).show();
              }

              private void runShell(final List<FarmDevice> targets, final String cmd) {
                  final String[] lines = new String[targets.size()];
                  final AtomicInteger pending = new AtomicInteger(targets.size());
                  h.toast("Menjalankan di " + targets.size() + " HP...");
                  for (int i = 0; i < targets.size(); i++) {
                      final int idx = i;
                      targets.get(i).exec(cmd, (d, out, err) -> {
                          String o = out == null ? "" : out.trim();
                          if (err != null) {
                              lines[idx] = d.label() + "  ·  GAGAL: " + err;
                          } else if (o.isEmpty()) {
                              lines[idx] = d.label() + "  ·  selesai";
                          } else {
                              if (o.length() > (targets.size() == 1 ? 4000 : 160)) o = o.substring(0, targets.size() == 1 ? 4000 : 160) + "…";
                              lines[idx] = d.label() + "  ·  " + (targets.size() == 1 ? "\n" : "") + o;
                          }
                          if (pending.decrementAndGet() == 0) {
                              ui.post(() -> {
                                  StringBuilder sb = new StringBuilder();
                                  for (String l : lines) {
                                      if (sb.length() > 0) sb.append("\n\n");
                                      sb.append(l);
                                  }
                                  TextView t = h.text(sb.toString(), 13, 0xFFC0C9DA, false);
                                  t.setTextIsSelectable(true);
                                  MaxScroll ms = new MaxScroll(h, dp(320));
                                  ms.addView(t, new FrameLayout.LayoutParams(-1, -2));
                                  h.new Dlg(h).setTitle("Hasil").setView(ms).setPositiveButton("Tutup", null).show();
                              });
                          }
                      });
                  }
              }

