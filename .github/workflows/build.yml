          </svg>
          <div id="c">
            <div class="top">
              <div class="t">Kalkulator</div>
              <button class="ibtn" id="bCp" type="button" aria-label="Salin hasil"><svg class="i"><use href="#i-copy"/></svg></button>
              <button class="ibtn" id="bHi" type="button" aria-label="Riwayat"><svg class="i"><use href="#i-clock"/></svg></button>
            </div>
            <div class="screen" id="scr">
              <div class="last" id="last"></div>
              <div id="disp">0</div>
              <div id="res"></div>
            </div>
            <div id="pad"></div>
          </div>
          <div class="scrim" id="scrim"></div>
          <div class="sheet" id="sheet" aria-hidden="true">
            <div class="hd"><b>Riwayat</b><button class="btn sm ghost bad" id="bClr" type="button">Hapus semua</button></div>
            <div class="hl" id="hl"></div>
          </div>
          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var $ = function (s) { return document.getElementById(s); };
          var exp = '', justEq = false, hist = [];
          var disp = $('disp'), res = $('res'), pad = $('pad'), last = $('last');
          var KEYS = ['C', '←', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '(', ')', '='];

          function calc(e) {
            var s = e.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'), p = 0;
            function pe() {
              var v = pt();
              while (p < s.length) {
                var c = s[p];
                if (c === '+') { p++; v += pt(); } else if (c === '-') { p++; v -= pt(); } else break;
              }
              return v;
            }
            function pt() {
              var v = pf();
              while (p < s.length) {
                var c = s[p];
                if (c === '*') { p++; v *= pf(); } else if (c === '/') { p++; v /= pf(); } else break;
              }
              return v;
            }
            function pf() {
              if (p >= s.length) throw new Error('x');
              var c = s[p];
              if (c === '-') { p++; return -pf(); }
              if (c === '+') { p++; return pf(); }
              var v;
              if (c === '(') {
                p++; v = pe();
                if (s[p] !== ')') throw new Error('x');
                p++;
              } else {
                var st = p;
                while (p < s.length && /[0-9.]/.test(s[p])) p++;
                if (st === p) throw new Error('x');
                v = Number(s.slice(st, p));
                if (isNaN(v)) throw new Error('x');
              }
              while (s[p] === '%') { p++; v /= 100; }
              return v;
            }
            var v = pe();
            if (p !== s.length) throw new Error('x');
            return v;
          }

          function fmt(v) {
