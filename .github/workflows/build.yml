            else if (k === 'C') c += ' f c';
            else if (k === '←' || k === '%' || k === '(' || k === ')') c += ' f';
            b.className = c;
            b.setAttribute('aria-label', { '←': 'Hapus satu', 'C': 'Bersihkan', '÷': 'Bagi', '×': 'Kali', '−': 'Kurang', '+': 'Tambah', '=': 'Hasil' }[k] || k);
            b.onclick = function () { key(k); };
            pad.appendChild(b);
          });

          /* keyboard fisik */
          addEventListener('keydown', function (e) {
            var m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '←', Escape: 'C', c: 'C', C: 'C' };
            var k = m[e.key] || e.key;
            if (KEYS.indexOf(k) >= 0) { e.preventDefault(); key(k); }
          });

          /* riwayat */
          var sheetOpen = false;
          function openSheet(on) {
            sheetOpen = on;
            $('sheet').classList.toggle('on', on);
            $('scrim').classList.toggle('on', on);
            $('sheet').setAttribute('aria-hidden', on ? 'false' : 'true');
