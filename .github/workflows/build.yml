                          + "Aksesibilitas lalu ketuk Mulai. Setelah itu ketuk Pindai WiFi di sini, masukkan PIN, dan layar semua HP "
                          + "tampil dan bisa disentuh.", 13.5f, MainActivity.DIM, false);
