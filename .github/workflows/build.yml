              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              /** Pengendali meminta layar kembali: minta izin tangkap layar sekarang (dialognya diterima otomatis bila bisa). */
              private void handleIntent(Intent in) {
                  if (in == null || !in.getBooleanExtra(EXTRA_RECLAIM, false)) return;
                  in.removeExtra(EXTRA_RECLAIM); // jangan terulang bila layar dibuat ulang
                  String tok = in.getStringExtra(EXTRA_TOKEN);
                  in.removeExtra(EXTRA_TOKEN);
                  if (tok == null || !tok.equals(AgentHost.reclaimToken(this))) return; // bukan dari aplikasi ini: abaikan
                  AgentService s = AgentService.instance;
                  if (s != null && s.hasProjection()) {
                      AgentHost.projectionReady();
                      reclaimMode = true;
                      leave();
                      return;
                  }
                  reclaimMode = true;
                  wantCapture = true;
                  AgentHost.armAutoAccept();
                  if (resumed) ui.post(this::runWanted);
              }

              /** Minta izin tangkap layar yang tertunda (setelah layar benar-benar tampil di depan). */
              private void runWanted() {
                  if (!wantCapture) return;
                  wantCapture = false;
                  requestCapture();
              }

              /** Kembali ke aplikasi yang sebelumnya di depan (mis. Macrorify), hanya dipakai pada mode "Ambil layar". */
              private void leave() {
                  if (!reclaimMode) return;
                  reclaimMode = false;
                  try { moveTaskToBack(true); } catch (Throwable ignored) { }
                  finish();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  resumed = true;
                  if (accessibilityOn()) AgentHost.ensure(this);
                  ui.post(tick);
                  if (wantCapture) ui.post(this::runWanted);
              }

              @Override
              protected void onPause() {
                  resumed = false;
                  ui.removeCallbacks(tick);
                  super.onPause();
              }

              private boolean accessibilityOn() {
                  if (AgentAccess.instance != null) return true;
                  try {
                      String s = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (s == null) return false;
                      String me = new ComponentName(this, AgentAccess.class).flattenToString();
                      String shortName = new ComponentName(this, AgentAccess.class).flattenToShortString();
                      for (String x : s.split(":")) if (x.equalsIgnoreCase(me) || x.equalsIgnoreCase(shortName)) return true;
                  } catch (Throwable ignored) { }
                  return false;
              }

              private void refresh() {
                  boolean acc = accessibilityOn();
                  accessState.setText(acc ? "✓ Aktif" : "✗ Belum aktif");
                  accessState.setTextColor(acc ? MainActivity.OK : MainActivity.WARN);
                  accessBtn.setVisibility(acc ? View.GONE : View.VISIBLE);
                  accessNote.setVisibility(acc || Build.VERSION.SDK_INT < 33 ? View.GONE : View.VISIBLE);

                  AgentService s = AgentService.instance;
                  boolean live = s != null && s.hasProjection();
                  boolean standby = s != null && !live;
                  if (live) {
                      shareState.setText("✓ Layar dibagikan");
                      shareState.setTextColor(MainActivity.OK);
                  } else if (standby) {
                      shareState.setText("◐ Siaga: layar tidak dibagikan");
                      shareState.setTextColor(MainActivity.WARN);
                  } else {
                      shareState.setText("○ Layar belum dibagikan");
                      shareState.setTextColor(MainActivity.DIM);
                  }
                  shareBtn.setText(live ? "Hentikan" : (standby ? "Ambil layar" : "Mulai"));
                  shareBtn.setBackground(live ? box(MainActivity.CARD2, 14, MainActivity.LINE) : box(MainActivity.ACC, 14, 0));
                  shareBtn.setTextColor(live ? MainActivity.FG : 0xFF0B0E14);
                  stopBtn.setVisibility(standby ? View.VISIBLE : View.GONE);
                  if (overlayNote != null) {
                      boolean ov = Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(this);
                      overlayNote.setText(ov ? "✓ Diizinkan" : "○ Belum diizinkan");
                      overlayNote.setTextColor(ov ? MainActivity.OK : MainActivity.WARN);
                      overlayBtn.setVisibility(ov ? View.GONE : View.VISIBLE);
                  }
                  String err = AgentService.lastError;
                  errTv.setText(err == null ? "" : err);
                  errTv.setVisibility(err == null || err.isEmpty() || live ? View.GONE : View.VISIBLE);

                  if (AgentHost.serverUp()) {
                      serverTv.setText("● Server Agen siap (port " + AgentWire.PORT + ")");
                      serverTv.setTextColor(MainActivity.OK);
                  } else if (!AgentHost.serverError.isEmpty()) {
                      serverTv.setText("✗ Server gagal dibuka: " + AgentHost.serverError);
                      serverTv.setTextColor(MainActivity.BAD);
                  } else {
                      serverTv.setText("○ Server Agen mati. Aktifkan Aksesibilitas atau ketuk Mulai");
                      serverTv.setTextColor(MainActivity.DIM);
                  }

                  List<String> ips = AgentService.addresses();
                  StringBuilder sb = new StringBuilder();
                  for (String ip : ips) {
                      if (sb.length() > 0) sb.append("\n");
                      sb.append(ip).append("  ·  port ").append(AgentWire.PORT);
                  }
                  addrTv.setText(ips.isEmpty() ? "Belum tersambung ke WiFi atau hotspot" : "Alamat:\n" + sb);
                  pinTv.setText(AgentService.pin(this));
                  if (!AgentHost.serverUp()) {
                      clientTv.setText("");
                  } else if (AgentHost.clientConnected()) {
                      clientTv.setText(live ? "● HP pengendali sedang tersambung" : "◐ HP pengendali tersambung (menunggu layar)");
                      clientTv.setTextColor(live ? MainActivity.OK : MainActivity.WARN);
                  } else {
                      clientTv.setText("○ Menunggu HP pengendali");
                      clientTv.setTextColor(MainActivity.DIM);
                  }
              }

              private void openAccessibility() {
                  try {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      Toast.makeText(this, "Pilih CFM Agen lalu aktifkan", Toast.LENGTH_LONG).show();
                  } catch (Throwable e) {
                      Toast.makeText(this, "Tidak bisa membuka pengaturan Aksesibilitas", Toast.LENGTH_LONG).show();
                  }
              }

              private void openOverlaySettings() {
                  try {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                  } catch (Throwable e) {
                      openAppInfo();
                  }
              }

              private void openAppInfo() {
                  try {
                      startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                  } catch (Throwable e) {
                      Toast.makeText(this, "Tidak bisa membuka Info aplikasi", Toast.LENGTH_LONG).show();
                  }
              }

              private void stopService() {
                  startService(new Intent(this, AgentService.class).setAction(AgentService.ACTION_STOP));
                  ui.postDelayed(this::refresh, 400);
              }

              private void toggleShare() {
                  AgentService s = AgentService.instance;
                  if (s != null && s.hasProjection()) {
                      stopService();
                      return;
                  }
                  requestCapture();
              }

              private void requestCapture() {
                  if (capturePending) return;
                  AgentService cur = AgentService.instance;
                  if (cur != null && cur.hasProjection()) {
                      leave();
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  if (m == null) {
                      Toast.makeText(this, "HP ini tidak mendukung tangkap layar", Toast.LENGTH_LONG).show();
                      if (reclaimMode) {
                          AgentService.lastError = "HP itu tidak mendukung tangkap layar";
                          AgentHost.projectionLost(AgentService.lastError);
                          leave();
                      }
                      return;
                  }
                  if (!accessibilityOn()) {
                      Toast.makeText(this, "Aksesibilitas belum aktif: layar tampil tetapi tidak bisa disentuh", Toast.LENGTH_LONG).show();
                  }
                  try {
                      capturePending = true;
                      startActivityForResult(m.createScreenCaptureIntent(), REQ_PROJ);
                  } catch (Throwable e) {
                      capturePending = false;
                      Toast.makeText(this, "Gagal meminta izin tangkap layar: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      if (reclaimMode) {
                          AgentService.lastError = "Gagal meminta izin tangkap layar di HP itu";
                          AgentHost.projectionLost(AgentService.lastError);
                          leave();
                      }
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_PROJ) return;
                  capturePending = false;
                  if (res != RESULT_OK || data == null) {
                      Toast.makeText(this, "Izin tangkap layar dibatalkan", Toast.LENGTH_LONG).show();
                      if (reclaimMode) {
                          AgentService.lastError = "Permintaan ambil layar dibatalkan di HP itu";
                          AgentHost.cancelReclaimNotice();
                          AgentHost.projectionLost(AgentService.lastError);
                          leave();
                      }
                      return;
                  }
                  AgentService.lastError = "";
                  Intent i = new Intent(this, AgentService.class).setAction(AgentService.ACTION_START)
                          .putExtra(AgentService.EXTRA_CODE, res).putExtra(AgentService.EXTRA_DATA, data);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                  } catch (Throwable e) {
                      AgentService.lastError = "Gagal memulai layanan: " + e.getMessage();
                      if (reclaimMode) AgentHost.projectionLost(AgentService.lastError);
                  }
                  ui.postDelayed(this::refresh, 500);
                  leave();
              }

              private void pinDialog() {
                  final EditText e = new EditText(this);
                  e.setInputType(InputType.TYPE_CLASS_NUMBER);
                  e.setText(AgentService.pin(this));
                  e.setSelectAllOnFocus(true);
                  e.setTextColor(MainActivity.FG);
                  e.setPadding(dp(20), dp(14), dp(20), dp(14));
                  new AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                          .setTitle("PIN Agen")
                          .setMessage("4 sampai 12 angka. Pakai PIN yang sama di semua HP farm agar sekali masuk di HP pengendali.")
                          .setView(e)
                          .setPositiveButton("Simpan", (d, w) -> {
                              String p = e.getText().toString().trim();
                              if (!p.matches("\\d{4,12}")) {
                                  Toast.makeText(this, "PIN harus 4 sampai 12 angka", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              AgentService.setPin(this, p);
                              refresh();
                          })
                          .setNegativeButton("Batal", null)
                          .show();
              }
          }
