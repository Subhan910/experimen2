              @Override
              public void onInterrupt() { }

              private DisplayMetrics realMetrics() {
                  DisplayMetrics dm = new DisplayMetrics();
                  DisplayManager m = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  Display d = m == null ? null : m.getDisplay(Display.DEFAULT_DISPLAY);
                  if (d != null) d.getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();
                  return dm;
              }

              // ---------- sentuhan ----------
              /** action 0 turun, 1 angkat, 2 geser. nx, ny: 0..65535 relatif ke layar penuh. */
              void touch(int action, int nx, int ny) {
                  if (Build.VERSION.SDK_INT < 24) return; // dispatchGesture baru ada di Android 7
                  DisplayMetrics dm = realMetrics();
                  float x = nx / 65535f * (dm.widthPixels - 1);
                  float y = ny / 65535f * (dm.heightPixels - 1);
                  long now = SystemClock.uptimeMillis();
                  ArrayList<float[]> done = null;
                  float density = dm.density;
                  synchronized (tl) {
                      if (action == 0) {
                          pts.clear();
                          down = true;
                          downAt = now;
                          pts.add(new float[]{x, y, 0});
                      } else if (!down) {
                          return;
                      } else if (action == 2) {
                          float[] l = pts.get(pts.size() - 1);
                          float dx = x - l[0], dy = y - l[1];
                          if (pts.size() < MAX_POINTS * 4 && (dx * dx + dy * dy >= 4f)) pts.add(new float[]{x, y, now - downAt});
                      } else {
                          pts.add(new float[]{x, y, now - downAt});
                          down = false;
                          done = new ArrayList<>(pts);
                          pts.clear();
                      }
                  }
                  if (done != null) fire(done, density);
              }

              private void fire(final ArrayList<float[]> p, float density) {
                  float[] first = p.get(0);
                  float[] last = p.get(p.size() - 1);
                  long elapsed = (long) last[2];
                  float travel = 0;
                  for (int i = 1; i < p.size(); i++) {
                      float dx = p.get(i)[0] - p.get(i - 1)[0], dy = p.get(i)[1] - p.get(i - 1)[1];
                      travel += (float) Math.sqrt(dx * dx + dy * dy);
                  }
                  boolean moved = travel > 10f * density;
                  Path path = new Path();
                  path.moveTo(first[0], first[1]);
                  long dur;
                  if (!moved) {
                      // ketukan cepat dibatasi 120 ms (selisih waktu tiba di jaringan bisa menggembung); tekan lama (>= 350 ms) dipertahankan
                      dur = elapsed < 350 ? Math.max(10, Math.min(elapsed, 120)) : Math.min(5000, elapsed);
                  } else {
                      // gesekan diputar lebih cepat dari aslinya supaya terasa responsif dan memicu fling
                      dur = Math.max(60, Math.min(600, elapsed));
                      int step = Math.max(1, (p.size() + MAX_POINTS - 1) / MAX_POINTS);
                      for (int i = 1; i < p.size(); i += step) path.lineTo(p.get(i)[0], p.get(i)[1]);
                      path.lineTo(last[0], last[1]);
                  }
                  final GestureDescription g;
                  try {
                      g = new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(path, 0, dur)).build();
                  } catch (RuntimeException e) {
                      return;
                  }
                  final long d = dur;
                  main.post(() -> {
                      long now = SystemClock.uptimeMillis();
                      if (busy && now > busyUntil) busy = false; // callback tidak pernah datang: jangan macet selamanya
                      if (queue.size() >= MAX_QUEUE) queue.pollFirst();
                      queue.addLast(new Object[]{g, d});
                      pump();
                  });
              }

              private void pump() {
                  if (busy) return;
                  Object[] j = queue.pollFirst();
                  if (j == null) return;
                  busy = true;
                  busyUntil = SystemClock.uptimeMillis() + (Long) j[1] + 1500;
                  boolean ok;
                  try {
                      ok = dispatchGesture((GestureDescription) j[0], new GestureResultCallback() {
                          @Override
                          public void onCompleted(GestureDescription gd) {
                              busy = false;
                              pump();
                          }

                          @Override
                          public void onCancelled(GestureDescription gd) {
                              busy = false;
                              pump();
                          }
                      }, main);
                  } catch (Throwable e) {
                      ok = false;
                  }
                  if (!ok) {
                      busy = false;
                      pump();
                  }
              }

              // ---------- tombol ----------
