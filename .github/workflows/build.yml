              final String pin;
              /** Agen terhubung tetapi layanan Aksesibilitasnya belum aktif: layar tampil, sentuhan tidak jalan. */
              volatile boolean noControl;
              /**
               * Agen tersambung (sentuhan dan tombol jalan) tetapi layarnya tidak dikirim: belum dibagikan atau direbut aplikasi
