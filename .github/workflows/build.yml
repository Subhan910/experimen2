              justEq = false;
              exp += k;
            }
            paint();
          }

          KEYS.forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = k;
            var c = 'k';
            if ('÷×−+'.indexOf(k) >= 0) c += ' o';
            else if (k === '=') c += ' eq';
            else if (k === 'C') c += ' f c';
            else if (k === '←' || k === '%' || k === '(' || k === ')') c += ' f';
            b.className = c;
            b.setAttribute('aria-label', { '←': 'Hapus satu', 'C': 'Bersihkan', '÷': 'Bagi', '×': 'Kali', '−': 'Kurang', '+': 'Tambah', '=': 'Hasil' }[k] || k);
            b.onclick = function () { key(k); };
            pad.appendChild(b);
          });

          /* keyboard fisik */
          addEventListener('keydown', function (e) {
            var m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '←', Escape: 'C', c: 'C', C: 'C' };
            var k = m[e.key] || e.key;
            if (KEYS.indexOf(k) >= 0) { e.preventDefault(); key(k); }
          });

