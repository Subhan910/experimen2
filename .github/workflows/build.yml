name: Build CFM WebUI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Buat proyek Android
        run: |
          set -e
          mkdir -p webui-app && cd webui-app
          mkdir -p app app/src/main app/src/main/java/id/cfm/webui app/src/main/res/drawable app/src/main/assets/plugins app/src/main/res/values app/src/main/res/drawable-anydpi-v26
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CFMWebUI"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.cfm.webui'
              compileSdk 34

              defaultConfig {
                  applicationId 'id.cfm.webui'
                  minSdk 21
                  targetSdk 34
                  versionCode 25
                  versionName '4.5'
              }

              signingConfigs {
                  fixed {
                      storeFile file('fixed.p12')
                      storeType 'pkcs12'
                      storePassword 'cfmwebui'
                      keyAlias 'cfm'
                      keyPassword 'cfmwebui'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              }
          }

          dependencies {
              implementation 'dev.mobile:dadb:1.2.10'
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Library Shizuku-API dibangun untuk minSdk 24; aplikasi ini minSdk 21. Provider-nya dimatikan di bawah Android 8 (lihat bools.xml) -->
              <uses-sdk tools:overrideLibrary="rikka.shizuku.api, rikka.shizuku.provider, rikka.shizuku.aidl, rikka.shizuku.shared" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />

              <!-- Android 11+: agar daftar aplikasi dan nama aplikasi yang dimatikan sebelum Ambil layar (mis. Macrorify) terbaca -->
              <queries>
                  <package android:name="com.kok_emm.mobile" />
                  <package android:name="moe.shizuku.privileged.api" />
                  <intent>
                      <action android:name="android.settings.APPLICATION_DETAILS_SETTINGS" />
                      <data android:scheme="package" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="CFM WebUI"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:hardwareAccelerated="true"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density|fontScale|layoutDirection"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Mode Agen: bagian dari aplikasi ini (dibuka dari menu), tanpa ikon sendiri. Dipasang di HP farm supaya
                       bisa dikontrol dari HP pengendali tanpa ADB -->
                  <activity
                      android:name=".AgentActivity"
                      android:label="Mode Agen"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density|fontScale|layoutDirection" />

                  <!-- Shizuku: menerima koneksi dari server Shizuku (tangkap layar tanpa MediaProjection). Hanya aktif di Android 8+ -->
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="@bool/cfm_shizuku_on"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <!-- Anti-tidur: alarm berkala yang membangunkan proses bila dimatikan sistem -->
                  <receiver
                      android:name=".AgentWatch"
                      android:exported="false" />

                  <service
                      android:name=".AgentService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".AgentAccess"
                      android:label="CFM Agen"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/agent_access" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
