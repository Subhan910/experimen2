              }

              // ---------- WebView fitur ----------
              // fitur yang mendeklarasikan <meta name="cfm-ui"> mendapat UI kit (cfm-ui.css)
              private boolean wantsUi(String html) {
                  Matcher m = TAG_META.matcher(html);
                  while (m.find()) {
                      String n = attr(m.group(), "name");
                      if (n != null && n.trim().equalsIgnoreCase("cfm-ui")) return true;
                  }
                  return false;
              }

              private String inject(String html) {
                  String tag = "<script>" + prelude + "</script>" + (wantsUi(html) ? "<style id=\"cfm-ui\">" + uiCss + "</style>" : "");
                  Matcher m = Pattern.compile("<head\\b[^>]*>", Pattern.CASE_INSENSITIVE).matcher(html);
                  if (m.find()) return html.substring(0, m.end()) + tag + html.substring(m.end());
                  m = Pattern.compile("<html\\b[^>]*>", Pattern.CASE_INSENSITIVE).matcher(html);
                  if (m.find()) return html.substring(0, m.end()) + "<head>" + tag + "</head>" + html.substring(m.end());
                  m = Pattern.compile("^\\s*<!doctype[^>]*>", Pattern.CASE_INSENSITIVE).matcher(html);
                  if (m.find()) return html.substring(0, m.end()) + tag + html.substring(m.end());
                  return tag + html;
              }

              private WebView pluginView(String id) {
                  WebView v = pluginViews.get(id);
                  if (v != null) return v;
                  Plugin p = plugins.get(id);
                  if (p == null) return null;
                  String html;
                  try { html = readFile(p.file); } catch (Exception e) { return null; }
                  v = new WebView(this);
                  v.setBackgroundColor(BG);
                  WebSettings s = v.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  v.addJavascriptInterface(new PluginBridge(id, v), "CFMNative");
                  v.setWebViewClient(pluginClient);
                  v.setWebChromeClient(chrome);
                  v.setVisibility(View.GONE);
                  body.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  pluginViews.put(id, v);
                  lastErr.remove(id);
                  v.loadDataWithBaseURL(ORIGIN + id + "/", inject(html), "text/html", "UTF-8", null);
                  return v;
              }

              private void dropView(String id) {
                  WebView v = pluginViews.remove(id);
                  if (v == null) return;
                  body.removeView(v);
                  v.destroy();
              }

              private void dispatch(WebView v, String name) {
                  if (v != null) v.evaluateJavascript("window.dispatchEvent(new Event('cfm:" + name + "'))", null);
              }

              private WebViewClient makePluginClient() {
                  return new WebViewClient() {
                      private boolean external(String url) {
                          if (url.startsWith(ORIGIN) || url.startsWith("about:") || url.startsWith("blob:") || url.startsWith("javascript:")) return false;
                          openExternal(url);
                          return true;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return external(r.getUrl().toString());
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          return external(url);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          if ("plugin.cfm.local".equals(r.getUrl().getHost())) {
                              return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found",
                                      new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                          }
                          return null;
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d) {
                          String found = null;
                          for (Map.Entry<String, WebView> e : pluginViews.entrySet()) {
                              if (e.getValue() == v) { found = e.getKey(); break; }
                          }
                          if (found != null) {
                              boolean was = ("p:" + found).equals(cur);
                              dropView(found);
                              if (was) show("webui");
                              toastL("Fitur berhenti mendadak. Buka lagi untuk memuat ulang.");
                          }
                          return true;
                      }
                  };
              }

