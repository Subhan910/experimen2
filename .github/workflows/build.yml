              }

              // ---------- pindai jaringan ----------
              private static final class Found {
                  final String host;
                  final boolean agent;

                  Found(String host, boolean agent) {
                      this.host = host;
                      this.agent = agent;
                  }

                  int port() {
                      return agent ? AgentWire.PORT : 5555;
                  }

                  String label() {
                      return (agent ? "Agen  ·  " : "ADB  ·  ") + host;
                  }
              }

              private interface PinCb {
                  void got(String pin);
              }

              private void scan() {
                  if (scanning) return;
                  final Set<String> own = new LinkedHashSet<>();
                  final Set<String> bases = new LinkedHashSet<>();
                  try {
                      Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                      while (en != null && en.hasMoreElements()) {
                          NetworkInterface ni = en.nextElement();
                          if (ni.isLoopback() || !ni.isUp()) continue;
                          for (InterfaceAddress ia : ni.getInterfaceAddresses()) {
                              if (!(ia.getAddress() instanceof Inet4Address)) continue;
                              Inet4Address a = (Inet4Address) ia.getAddress();
                              if (!a.isSiteLocalAddress()) continue;
                              String s = a.getHostAddress();
                              own.add(s);
                              bases.add(s.substring(0, s.lastIndexOf('.') + 1));
                          }
                      }
                  } catch (Exception ignored) { }
                  if (bases.isEmpty()) {
                      h.toastL("Tidak ada jaringan WiFi atau hotspot yang aktif");
                      return;
                  }
                  scanning = true;
                  scanDone = 0;
                  scanTotal = bases.size() * 254;
                  updateSummary();
                  final List<Found> found = Collections.synchronizedList(new ArrayList<Found>());
                  final AtomicInteger left = new AtomicInteger(scanTotal);
                  final ExecutorService ex = Executors.newFixedThreadPool(48);
                  for (final String base : bases) {
                      for (int i = 1; i <= 254; i++) {
                          final String ipAddr = base + i;
                          ex.execute(() -> {
                              if (!own.contains(ipAddr)) {
                                  // HP dengan ADB WiFi lebih diutamakan daripada Agen (sentuhan langsung, tanpa jeda)
                                  if ("open".equals(FarmDevice.probe(ipAddr, 5555, 450))) found.add(new Found(ipAddr, false));
                                  else if (AgentWire.probe(ipAddr, AgentWire.PORT, 450)) found.add(new Found(ipAddr, true));
                              }
                              final int rem = left.decrementAndGet();
                              if (rem == 0) {
                                  ui.post(() -> finishScan(found));
                              } else if (rem % 10 == 0) {
                                  ui.post(() -> {
                                      scanDone = scanTotal - rem;
                                      if (scanning) updateSummary();
                                  });
                              }
                          });
                      }
                  }
                  ex.shutdown();
              }

              private void finishScan(List<Found> found) {
                  scanning = false;
                  updateSummary();
                  final List<Found> fresh = new ArrayList<>();
                  synchronized (found) {
                      for (Found f : found) if (!has(f.host, f.port())) fresh.add(f);
                  }
                  Collections.sort(fresh, (a, b) -> {
                      String[] x = a.host.split("\\."), y = b.host.split("\\.");
                      for (int i = 0; i < 4; i++) {
                          int c = Integer.compare(Integer.parseInt(x[i]), Integer.parseInt(y[i]));
                          if (c != 0) return c;
                      }
                      return 0;
                  });
                  if (fresh.isEmpty()) {
                      h.toastL(found.isEmpty()
                              ? "Tidak ada HP dengan ADB WiFi (5555) atau Agen (5600) di jaringan ini. Ketuk Panduan."
                              : "Semua HP yang ditemukan sudah ada di daftar");
                      return;
                  }
                  final boolean[] sel = new boolean[fresh.size()];
                  LinearLayout list = new LinearLayout(h);
                  list.setOrientation(LinearLayout.VERTICAL);
                  for (int i = 0; i < fresh.size(); i++) {
                      final int idx = i;
                      sel[i] = true;
                      final TextView r = h.text("", 15, MainActivity.FG, false);
                      r.setPadding(dp(14), dp(12), dp(14), dp(12));
                      r.setOnClickListener(v -> {
                          sel[idx] = !sel[idx];
                          markRow(r, fresh.get(idx).label(), sel[idx]);
                      });
                      markRow(r, fresh.get(i).label(), true);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                      lp.setMargins(0, dp(2), 0, dp(2));
                      list.addView(r, lp);
                  }
                  MaxScroll ms = new MaxScroll(h, dp(300));
                  ms.addView(list, new FrameLayout.LayoutParams(-1, -2));
                  h.new Dlg(h).setTitle("Ditemukan " + fresh.size() + " HP")
                          .setMessage("ADB = ADB WiFi aktif. Agen = HP yang menjalankan CFM Agen (perlu PIN).")
                          .setView(ms)
                          .setPositiveButton("Tambahkan", (dlg, w) -> {
                              final List<Found> pick = new ArrayList<>();
                              boolean needPin = false;
                              for (int i = 0; i < fresh.size(); i++) {
                                  if (!sel[i]) continue;
                                  pick.add(fresh.get(i));
                                  if (fresh.get(i).agent) needPin = true;
                              }
                              if (pick.isEmpty()) return;
                              if (needPin) askPin(pin -> addFound(pick, pin));
                              else addFound(pick, "");
                          })
                          .setNegativeButton("Batal", null).show();
              }

              private void addFound(List<Found> pick, String pin) {
                  int added = 0;
                  for (Found f : pick) {
                      if (has(f.host, f.port())) continue;
                      devs.add(new FarmDevice("", f.host, f.port(), f.agent, f.agent ? pin : "", this));
                      added++;
                  }
                  if (added > 0) {
                      save();
                      rebuildGrid();
                      h.toast(added + " HP ditambahkan");
                  }
              }

              private void askPin(final PinCb cb) {
                  final EditText e = h.edit("PIN Agen");
