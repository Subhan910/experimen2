                return;
              }
            } else {
              if (justEq && isNum) exp = '';
              justEq = false;
              exp += k;
            }
            paint();
          }

          KEYS.forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = k;
