          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 3h6v3H9z"/><path d="M8 4.5H6a2 2 0 0 0-2 2V20a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
          </svg>
          <main class="page">
            <div class="hero">
              <div class="tile">🔁</div>
              <div class="grow"><h1 class="h1">V2Ray ke Clash</h1><p class="sub">Ubah link vless://, vmess://, dan trojan:// menjadi node Clash.</p></div>
            </div>

            <div class="card">
              <div class="ct"><div class="grow"><span class="num">1</span>Akun</div><span class="chip" id="cnt"></span></div>
              <label class="field" for="inp">Tempel satu akun per baris</label>
              <textarea class="input" id="inp" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="vless://…&#10;vmess://…&#10;trojan://…"></textarea>
              <div class="act">
                <button id="ps" type="button" class="btn sm"><svg class="i sm"><use href="#i-paste"/></svg>Tempel</button>
                <button id="cl" type="button" class="btn sm ghost"><svg class="i sm"><use href="#i-x"/></svg>Kosongkan</button>
              </div>
            </div>
            <div class="gap"></div>

            <div class="card" style="padding-top:12px;padding-bottom:4px">
              <div class="ct" style="margin-bottom:0"><span class="num">2</span>Opsi</div>
              <label class="sw"><span><b>Lewati verifikasi sertifikat</b><small>skip-cert-verify: true</small></span><input type="checkbox" id="sk" checked><i></i></label>
              <label class="sw"><span><b>Paksa IPv4</b><small>Menghindari IPv6 yang sering bikin nyangkut di data seluler</small></span><input type="checkbox" id="v4" checked><i></i></label>
            </div>
            <div class="gap"></div>

            <div class="card">
              <div class="ct"><div class="grow"><span class="num">3</span>Hasil</div><span class="chip" id="st"></span></div>
              <div id="err" class="hide"></div>
              <textarea class="input" id="out" readonly wrap="off" spellcheck="false" aria-label="Hasil YAML Clash" placeholder="YAML akan muncul di sini"></textarea>
              <div class="act">
                <button id="cp" type="button" class="btn pri"><svg class="i sm"><use href="#i-copy"/></svg>Salin YAML</button>
                <button id="dl" type="button" class="btn"><svg class="i sm"><use href="#i-dl"/></svg>Unduh .yaml</button>
              </div>
            </div>
          </main>

          <script>
          const $=id=>document.getElementById(id);
          const q=JSON.stringify;

          function b64(s){
            s=s.replace(/-/g,'+').replace(/_/g,'/');
            while(s.length%4)s+='=';
            return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
          }

          function parseUrl(l){
            const u=new URL(l),g=u.searchParams,sec=g.get('security')||'none';
            return{
              type:u.protocol.slice(0,-1),
              name:decodeURIComponent(u.hash.slice(1))||u.hostname,
              server:u.hostname.replace(/^\[|\]$/g,''),
              port:+u.port||443,
              id:decodeURIComponent(u.username),
              net:g.get('type')||'tcp',
              host:g.get('host')||'',
              path:g.get('path')||'/',
              tls:sec!=='none'||u.protocol==='trojan:',
              sni:g.get('sni')||g.get('peer')||'',
              fp:g.get('fp')||'',
              flow:g.get('flow')||'',
              pbk:sec==='reality'?g.get('pbk')||'':'',
              sid:g.get('sid')||'',
              service:g.get('serviceName')||'',
              alpn:g.get('alpn')||''
            };
          }

          function parseVmess(l){
            const j=JSON.parse(b64(l.slice(8).trim()));
            return{
              type:'vmess',name:j.ps||j.add,server:j.add,port:+j.port||443,id:j.id,
              aid:+j.aid||0,cipher:j.scy||'auto',net:j.net||'tcp',host:j.host||'',
              path:j.path||'/',tls:j.tls==='tls',sni:j.sni||'',fp:j.fp||'',
              flow:'',pbk:'',sid:'',service:j.path||'',alpn:j.alpn||''
            };
          }

          function node(p,name,fp,o){
            const L=['  - name: '+q(name)],a=(k,v)=>L.push('    '+k+': '+v),tr=p.type==='trojan';
            a('type',p.type);a('server',p.server);a('port',p.port);
            tr?a('password',q(p.id)):a('uuid',p.id);
            if(p.type==='vmess'){a('alterId',p.aid);a('cipher',p.cipher)}
            if(p.flow)a('flow',p.flow);
            a('udp',true);
            const sni=p.sni||p.host||'';
            if(!tr)a('tls',p.tls);
            if(p.tls&&sni)a(tr?'sni':'servername',sni);
            if(p.tls&&o.skip)a('skip-cert-verify',true);
            if(p.alpn)a('alpn','['+p.alpn.split(',').map(q).join(', ')+']');
            if(!(tr&&p.net==='tcp'))a('network',p.net);
            if(o.v4)a('ip-version','ipv4');
            if(fp)a('client-fingerprint',fp);
            if(p.pbk){L.push('    reality-opts:','      public-key: '+p.pbk);if(p.sid)L.push('      short-id: '+q(p.sid))}
            if(p.net==='ws')L.push('    ws-opts:','      path: '+q(p.path),'      headers:','        Host: '+(p.host||sni||p.server));
            if(p.net==='grpc')L.push('    grpc-opts:','      grpc-service-name: '+q(p.service));
            return L;
          }

          function gen(items,o){
            const names=new Set(),out=['# Simpan sebagai: ./proxy_provider/Clash.yaml','proxies:'],errs=[];
            let n=0,k=0;
            const uniq=s=>{let r=s,i=2;while(names.has(r))r=s+'-'+i++;names.add(r);return r};
            for(const l of items){
              let p;
              try{p=/^vmess:\/\//i.test(l)?parseVmess(l):/^(vless|trojan):\/\//i.test(l)?parseUrl(l):null}catch(e){p=undefined}
              if(!p){errs.push((p===null?'Format belum didukung: ':'Link rusak: ')+l.slice(0,48)+'…');continue}
              k++;
              out.push('  # Akun '+k,...node(p,uniq(p.name),p.tls?(p.fp||'chrome'):'',o),'');
              n++;
            }
            return{text:n?out.join('\n').trimEnd()+'\n':'',n,k,errs};
          }

          function run(){
            const o={skip:$('sk').checked,v4:$('v4').checked};
            const r=gen($('inp').value.split(/\s+/).filter(Boolean),o);
            $('out').value=r.text;
            $('st').textContent=r.k?r.n+' akun siap dipakai':'Belum ada akun yang terbaca';$('st').className='chip '+(r.n?'ok':'');$('cnt').textContent=r.k?r.k+' terdeteksi':'';$('err').classList.toggle('hide',!r.errs.length);$('cp').disabled=$('dl').disabled=!r.n;
            $('err').textContent=r.errs.join('\n');
          }

          ['inp','sk','v4'].forEach(id=>$(id).addEventListener(id==='inp'?'input':'change',run));

          const flash=(b,t)=>{if(!b.dataset.h)b.dataset.h=b.innerHTML;clearTimeout(b._t);b.textContent=t;b._t=setTimeout(()=>{b.innerHTML=b.dataset.h},1600)};

          $('cp').addEventListener('click',async()=>{
            const t=$('out').value;if(!t)return;
            if(window.CFM){await CFM.copy(t)}
            else{try{await navigator.clipboard.writeText(t)}catch(e){$('out').select();document.execCommand('copy')}}
            flash($('cp'),'Tersalin');
          });

          $('ps').addEventListener('click',async()=>{
            try{
              const t=(window.CFM?await CFM.paste():await navigator.clipboard.readText()).trim(),i=$('inp');
              if(t){i.value=i.value.trim()?i.value.trimEnd()+'\n'+t:t;run()}
            }catch(e){$('inp').focus();flash($('ps'),'Tempel manual')}
          });

          $('cl').addEventListener('click',()=>{$('inp').value='';run();$('inp').focus()});

          $('dl').addEventListener('click',async()=>{
            const t=$('out').value;if(!t)return;
            if(window.CFM){const ok=await CFM.saveFile('Clash.yaml',t);flash($('dl'),ok?'Tersimpan':'Dibatalkan');return}
            const a=document.createElement('a');
            a.href=URL.createObjectURL(new Blob([t],{type:'text/yaml'}));a.download='Clash.yaml';
            document.body.appendChild(a);a.click();a.remove();
            flash($('dl'),'Diunduh');
          });

          run();
          </script>
          </body>
          </html>
