          <meta name="cfm-name" content="IP &amp; Jaringan">
          <meta name="cfm-icon" content="🌐">
          <meta name="cfm-version" content="2">
          <meta name="cfm-order" content="20">
          <meta name="cfm-ui" content="1">
          <title>IP &amp; Jaringan</title>
          <style>
          .ifc{margin-bottom:10px;padding:14px 16px}
          .ifc .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
          .ifc .nm{font:700 15px var(--mono);flex:1;min-width:0}
          .ip{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
          .ip:first-of-type{border-top:0}
          .ip .a{flex:1;min-width:0;font:14px var(--mono);word-break:break-all}
          .ip:active .a{color:var(--acc)}
          .ports{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
          .pc{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--dim);border-radius:999px;padding:7px 12px;font:600 12.5px system-ui,sans-serif}
          .pc.on{background:rgba(122,167,255,.15);border-color:rgba(122,167,255,.5);color:var(--acc)}
          .res{margin-top:12px}
          .rr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
          .rr .a{flex:1;min-width:0}
          .rr .a b{font:600 14px var(--mono)}
          .rr .a small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
          .rr .ms{color:var(--mute);font:12px var(--mono)}
          .tl{padding:6px 14px}
          .ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
          .ev:first-child{border-top:0}
          .ev .tm{flex:none;width:62px;color:var(--mute);font:12px var(--mono);padding-top:2px}
          .ev .tx{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
          .ev .tx small{display:block;color:var(--dim);font:12px var(--mono);margin-top:2px}
          .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
          </svg>
          <div class="page">
            <div class="row">
              <div class="grow"><h1 class="h1">IP &amp; Jaringan</h1><p class="sub" id="upd">Memuat...</p></div>
              <button class="btn sm" id="bRf" type="button"><svg class="i sm"><use href="#i-refresh"/></svg>Segarkan</button>
            </div>

            <div class="sec"><span>Antarmuka aktif</span><span class="chip" id="cnt">0</span></div>
            <div id="ifs"></div>

            <div class="sec"><span>Cek server</span></div>
            <div class="card">
              <label class="field" for="host">Alamat server</label>
              <input class="input mono" id="host" value="192.168.43.1" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Alamat server">
              <div class="ports" id="pc">
                <button class="pc" type="button" data-p="80">80 · WebUI</button>
                <button class="pc" type="button" data-p="9090">9090 · API</button>
                <button class="pc" type="button" data-p="8088">8088 · NAS</button>
              </div>
              <label class="field" for="ports">Port (pisahkan dengan koma)</label>
              <input class="input mono" id="ports" value="80,9090,8088" inputmode="numeric" placeholder="mis. 80,9090" aria-label="Port">
              <button class="btn pri blk" id="bChk" type="button" style="margin-top:14px"><svg class="i sm"><use href="#i-play"/></svg>Cek sekarang</button>
              <div class="res" id="chk" hidden></div>
            </div>

            <div class="sec"><span>Log jaringan</span><button class="btn sm ghost" id="bCp" type="button"><svg class="i sm"><use href="#i-copy"/></svg>Salin semua</button></div>
            <div class="card tl" id="log"></div>
          </div>
          <script>
          'use strict';
          var $ = function (s) { return document.querySelector(s); };
          function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
          var raw = { now: '', log: '' };

          function kind(n) {
            if (/^(ap|swlan|softap|wlan1)/i.test(n)) return ['Hotspot', 'acc'];
            if (/^(wlan|wifi)/i.test(n)) return ['Wi-Fi', 'ok'];
            if (/^(rmnet|ccmni|pdp|v4-rmnet|data|seth)/i.test(n)) return ['Seluler', 'warn'];
            if (/^(tun|tap|wg|ppp|ipsec)/i.test(n)) return ['VPN', 'acc'];
            if (/^(eth|usb|rndis)/i.test(n)) return ['Ethernet / USB', 'ok'];
            if (/^lo/i.test(n)) return ['Loopback', ''];
            return ['Lainnya', ''];
          }
          function copy(t) { CFM.copy(t).then(function () { CFM.toast('Disalin: ' + t); }); }

          function renderNow(s) {
            raw.now = s;
            var box = $('#ifs'); box.textContent = '';
            var items = [];
            s.split('\n').forEach(function (l) {
              var m = l.match(/^([^:\s]+):\s*(.+)$/);
              if (m) items.push({ n: m[1], ips: m[2].split(/,\s*/).filter(Boolean) });
            });
            $('#cnt').textContent = items.length;
            if (!items.length) {
              var e = el('div', 'card empty');
              e.appendChild(el('div', 'big', '📡'));
              e.appendChild(el('b', '', 'Tidak ada jaringan aktif'));
              e.appendChild(el('div', '', 'Hubungkan ke Wi-Fi atau aktifkan data seluler.'));
              box.appendChild(e);
              return;
            }
            items.forEach(function (it) {
              var c = el('div', 'card ifc fade-in'), hd = el('div', 'hd'), k = kind(it.n);
              hd.appendChild(el('span', 'nm', it.n));
              hd.appendChild(el('span', 'chip ' + k[1], k[0]));
              c.appendChild(hd);
              it.ips.forEach(function (ip) {
                var r = el('div', 'ip');
                r.appendChild(el('span', 'a', ip));
                r.appendChild(el('span', 'chip', ip.indexOf(':') >= 0 ? 'IPv6' : 'IPv4'));
                var ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                ic.setAttribute('class', 'i sm dim');
                var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                u.setAttribute('href', '#i-copy'); ic.appendChild(u); r.appendChild(ic);
                r.onclick = function () { copy(ip); };
                c.appendChild(r);
              });
              box.appendChild(c);
            });
          }

          function renderLog(s) {
            raw.log = s;
            var box = $('#log'); box.textContent = '';
            var lines = s.split('\n').filter(function (x) { return x.trim(); });
            if (!lines.length) { box.appendChild(el('div', 'empty', 'Belum ada kejadian jaringan.')); return; }
            lines.forEach(function (l) {
              var m = l.match(/^\[(\d\d:\d\d:\d\d)\]\s+Network\s+(up|down)\s+(.*)$/);
              var ev = el('div', 'ev');
              if (!m) { ev.appendChild(el('div', 'tx', l)); box.appendChild(ev); return; }
              ev.appendChild(el('div', 'tm', m[1]));
              var tx = el('div', 'tx'), up = m[2] === 'up', rest = m[3];
              var d = rest.match(/^(.*?),\s*address:\s*(.*?),\s*dns:\s*(.*)$/);
              var head = el('div');
              head.appendChild(el('span', 'chip ' + (up ? 'ok' : 'bad'), up ? 'Terhubung' : 'Putus'));
              head.appendChild(document.createTextNode('  ' + (d ? d[1] : rest)));
              tx.appendChild(head);
              if (d) tx.appendChild(el('small', '', (d[2] ? d[2] : '-') + '  ·  dns ' + (d[3] || '-')));
              ev.appendChild(tx);
              box.appendChild(ev);
            });
          }

          function refresh() {
            CFM.netInfo().then(renderNow);
            CFM.netLog().then(renderLog);
            var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
            $('#upd').textContent = 'Diperbarui ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
          }

          function verdict(r) {
            if (r === 'open') return ['ok', 'Terbuka', 'Server menerima koneksi'];
            if (r === 'refused') return ['warn', 'Ditolak', 'Alamat ada, tetapi server tidak berjalan'];
            if (r === 'timeout') return ['bad', 'Timeout', 'Alamat tidak terjangkau'];
            return ['bad', 'Gagal', String(r).replace(/^error:\s*/, '')];
          }

          function ports() { return $('#ports').value.split(/[,\s]+/).filter(function (p) { return /^\d+$/.test(p); }); }
          function syncChips() {
            var cur = ports();
            document.querySelectorAll('.pc').forEach(function (b) { b.classList.toggle('on', cur.indexOf(b.dataset.p) >= 0); });
          }
          document.querySelectorAll('.pc').forEach(function (b) {
            b.onclick = function () {
              var cur = ports(), i = cur.indexOf(b.dataset.p);
              if (i >= 0) cur.splice(i, 1); else cur.push(b.dataset.p);
              $('#ports').value = cur.join(',');
              syncChips();
            };
          });
          $('#ports').oninput = syncChips;

          $('#bRf').onclick = refresh;
          $('#bCp').onclick = function () {
            CFM.copy(raw.now + '\n' + raw.log).then(function () { CFM.toast('Disalin'); });
          };
          $('#bChk').onclick = function () {
            var host = $('#host').value.trim() || '192.168.43.1', ps = ports(), out = $('#chk'), btn = $('#bChk');
            out.hidden = false; out.textContent = '';
            if (!ps.length) { out.appendChild(el('div', 'dim', 'Isi port dulu, mis. 80,9090')); return; }
            btn.disabled = true;
            out.appendChild(el('div', 'dim', 'Memeriksa ' + ps.length + ' port...'));
            Promise.all(ps.map(function (p) {
              var t0 = Date.now();
              return CFM.checkPort(host, +p, 2000).then(function (r) { return { p: p, r: r, ms: Date.now() - t0 }; });
            })).then(function (l) {
              out.textContent = '';
              l.forEach(function (x) {
                var v = verdict(x.r), row = el('div', 'rr fade-in'), a = el('div', 'a');
                a.appendChild(el('b', '', host + ':' + x.p));
                a.appendChild(el('small', '', v[2]));
                row.appendChild(a);
                row.appendChild(el('span', 'ms', x.ms + ' ms'));
                row.appendChild(el('span', 'chip ' + v[0], v[1]));
                out.appendChild(row);
              });
            }).then(function () { btn.disabled = false; }, function () { btn.disabled = false; });
          };

          CFM.on('show', refresh);
          CFM.on('net', refresh);
          syncChips();
          refresh();
          </script>
          </body>
          </html>
          EOF_FILE
          cat > app/src/main/assets/plugins/kalkulator.html <<'EOF_FILE'
          <!doctype html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="cfm-id" content="kalkulator">
          <meta name="cfm-name" content="Kalkulator">
          <meta name="cfm-icon" content="🧮">
          <meta name="cfm-version" content="2">
          <meta name="cfm-order" content="30">
          <meta name="cfm-ui" content="1">
          <title>Kalkulator</title>
          <style>
          html,body{height:100%;overflow:hidden}
          #c{display:flex;flex-direction:column;height:100%;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:12px}
          .top{display:flex;align-items:center;gap:4px}
          .top .t{flex:1;font-weight:700;font-size:15px;color:var(--dim);padding-left:6px}
          .screen{flex:1;min-height:110px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;text-align:right}
          .last{color:var(--mute);font:14px var(--mono);min-height:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #disp{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15;word-break:break-all;max-width:100%;font-size:46px;transition:font-size .12s}
          #res{min-height:30px;color:var(--acc);font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
          #res.err{color:var(--bad)}
          .shake{animation:sh .28s}
          @keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
          #pad{flex:none;height:min(52vh,420px);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:9px}
          .k{border:1px solid var(--line);border-radius:16px;background:var(--card2);color:var(--text);font:500 22px system-ui,sans-serif;cursor:pointer;transition:transform .08s,filter .08s}
          .k:active{transform:scale(.94);filter:brightness(1.3)}
          .k.f{background:var(--surface);color:var(--dim);font-size:19px}
          .k.o{background:rgba(122,167,255,.14);border-color:rgba(122,167,255,.3);color:var(--acc);font-size:26px}
          .k.c{color:var(--bad)}
          .k.eq{grid-column:1/-1;background:linear-gradient(180deg,#5b86f6,var(--acc2));border-color:transparent;color:#fff;font-size:28px;box-shadow:0 10px 24px -10px rgba(62,107,240,.9)}
          .scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
          .scrim.on{opacity:1;pointer-events:auto}
          .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:72%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
          .sheet.on{transform:none}
          .sheet .hd{display:flex;align-items:center;padding:14px 16px 8px}
          .sheet .hd b{flex:1;font-size:16px}
          .hl{overflow:auto;padding:0 12px 18px}
          .h{display:block;width:100%;text-align:right;border:0;background:transparent;color:var(--text);padding:12px 10px;border-top:1px solid var(--line);font:inherit;cursor:pointer}
          .h:first-child{border-top:0}
          .h:active{background:var(--card2)}
          .h small{display:block;color:var(--dim);font:13px var(--mono)}
          .h span{font-size:20px;font-variant-numeric:tabular-nums}
          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
          </svg>
          <div id="c">
            <div class="top">
              <div class="t">Kalkulator</div>
              <button class="ibtn" id="bCp" type="button" aria-label="Salin hasil"><svg class="i"><use href="#i-copy"/></svg></button>
              <button class="ibtn" id="bHi" type="button" aria-label="Riwayat"><svg class="i"><use href="#i-clock"/></svg></button>
            </div>
            <div class="screen" id="scr">
              <div class="last" id="last"></div>
              <div id="disp">0</div>
              <div id="res"></div>
            </div>
            <div id="pad"></div>
          </div>
          <div class="scrim" id="scrim"></div>
          <div class="sheet" id="sheet" aria-hidden="true">
            <div class="hd"><b>Riwayat</b><button class="btn sm ghost bad" id="bClr" type="button">Hapus semua</button></div>
            <div class="hl" id="hl"></div>
          </div>
          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var $ = function (s) { return document.getElementById(s); };
          var exp = '', justEq = false, hist = [];
          var disp = $('disp'), res = $('res'), pad = $('pad'), last = $('last');
          var KEYS = ['C', '←', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '(', ')', '='];

          function calc(e) {
            var s = e.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'), p = 0;
            function pe() {
              var v = pt();
              while (p < s.length) {
                var c = s[p];
                if (c === '+') { p++; v += pt(); } else if (c === '-') { p++; v -= pt(); } else break;
              }
              return v;
            }
            function pt() {
              var v = pf();
              while (p < s.length) {
                var c = s[p];
                if (c === '*') { p++; v *= pf(); } else if (c === '/') { p++; v /= pf(); } else break;
              }
              return v;
            }
            function pf() {
              if (p >= s.length) throw new Error('x');
              var c = s[p];
              if (c === '-') { p++; return -pf(); }
              if (c === '+') { p++; return pf(); }
              var v;
              if (c === '(') {
                p++; v = pe();
                if (s[p] !== ')') throw new Error('x');
                p++;
              } else {
                var st = p;
                while (p < s.length && /[0-9.]/.test(s[p])) p++;
                if (st === p) throw new Error('x');
                v = Number(s.slice(st, p));
                if (isNaN(v)) throw new Error('x');
              }
              while (s[p] === '%') { p++; v /= 100; }
              return v;
            }
            var v = pe();
            if (p !== s.length) throw new Error('x');
            return v;
          }

          function fmt(v) {
            if (!isFinite(v)) throw new Error('x');
            if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
            return String(parseFloat(v.toPrecision(12)));
          }
          function group(s) { // 1234567.5 -> 1.234.567,5 hanya untuk tampilan hasil
            var m = s.match(/^(-?)(\d+)(\.\d+)?(e.*)?$/);
            if (!m) return s;
            return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (m[3] ? ',' + m[3].slice(1) : '') + (m[4] || '');
          }

          function paint() {
            disp.textContent = exp || '0';
            var n = (exp || '0').length;
            disp.style.fontSize = n > 20 ? '24px' : n > 14 ? '30px' : n > 9 ? '38px' : '46px';
            res.className = '';
            try {
              var r = fmt(calc(exp));
              res.textContent = exp === r || !exp ? '' : '= ' + group(r);
            } catch (e) { res.textContent = ''; }
          }

          function key(k) {
            var isNum = /[0-9.()]/.test(k);
            if (k === 'C') { exp = ''; last.textContent = ''; justEq = false; }
            else if (k === '←') { exp = exp.slice(0, -1); justEq = false; }
            else if (k === '=') {
              if (!exp) return;
              try {
                var r = fmt(calc(exp));
                last.textContent = exp + ' =';
                hist.unshift({ e: exp, r: r });
                hist = hist.slice(0, 40);
                C.set('h', JSON.stringify(hist));
                exp = r; justEq = true;
              } catch (e) {
                res.textContent = 'Ekspresi tidak valid'; res.className = 'err';
                $('scr').classList.remove('shake'); void $('scr').offsetWidth; $('scr').classList.add('shake');
                return;
              }
            } else {
              if (justEq && isNum) exp = '';
              justEq = false;
              exp += k;
            }
            paint();
          }

          KEYS.forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = k;
            var c = 'k';
            if ('÷×−+'.indexOf(k) >= 0) c += ' o';
            else if (k === '=') c += ' eq';
            else if (k === 'C') c += ' f c';
            else if (k === '←' || k === '%' || k === '(' || k === ')') c += ' f';
            b.className = c;
            b.setAttribute('aria-label', { '←': 'Hapus satu', 'C': 'Bersihkan', '÷': 'Bagi', '×': 'Kali', '−': 'Kurang', '+': 'Tambah', '=': 'Hasil' }[k] || k);
            b.onclick = function () { key(k); };
            pad.appendChild(b);
          });

          /* keyboard fisik */
          addEventListener('keydown', function (e) {
            var m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '←', Escape: 'C', c: 'C', C: 'C' };
            var k = m[e.key] || e.key;
            if (KEYS.indexOf(k) >= 0) { e.preventDefault(); key(k); }
          });

          /* riwayat */
          var sheetOpen = false;
          function openSheet(on) {
            sheetOpen = on;
            $('sheet').classList.toggle('on', on);
            $('scrim').classList.toggle('on', on);
            $('sheet').setAttribute('aria-hidden', on ? 'false' : 'true');
            if (on) renderHist();
          }
          function renderHist() {
            var box = $('hl'); box.textContent = '';
            if (!hist.length) {
              var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Belum ada perhitungan.'; box.appendChild(e); return;
            }
            hist.forEach(function (it) {
              var b = document.createElement('button'); b.type = 'button'; b.className = 'h';
              var s = document.createElement('small'); s.textContent = it.e + ' =';
              var r = document.createElement('span'); r.textContent = group(it.r);
              b.appendChild(s); b.appendChild(r);
              b.onclick = function () { exp = it.r; justEq = true; last.textContent = it.e + ' ='; paint(); openSheet(false); };
              box.appendChild(b);
            });
          }
          $('bHi').onclick = function () { openSheet(true); };
          $('scrim').onclick = function () { openSheet(false); };
          $('bClr').onclick = function () { hist = []; C.set('h', '[]'); renderHist(); };
          $('bCp').onclick = function () {
            var t = exp || '';
            try { t = fmt(calc(exp)); } catch (e) {}
            if (!t) return;
            C.copy(t).then(function () { C.toast('Disalin: ' + t); });
          };
          C.onBack(function () { if (sheetOpen) { openSheet(false); return true; } return false; });

          C.get('h').then(function (s) {
            try { hist = JSON.parse(s || '[]'); } catch (e) { hist = []; }
            if (!Array.isArray(hist)) hist = [];
          });
          paint();
          </script>
          </body>
          </html>
