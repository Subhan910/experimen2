                              lastWrite = System.currentTimeMillis();
                              if (standby && notice != null && !notice.isEmpty()) writeNoticeLocked(notice);
                          }
                          startBeat();
                          sock.setSoTimeout((int) idleMs);
                          control();
                      } catch (Throwable ignored) {
                          // klien putus atau salah protokol: cukup tutup
                      } finally {
                          close();
                          boolean mine = false;
                          synchronized (AgentServer.this) {
                              if (owner && current == this) {
                                  current = null;
                                  mine = true;
                              }
                          }
                          if (mine) backend.stopVideo(this);
