                  boolean onTouch(View v, MotionEvent e) {
                      int a = e.getActionMasked();
                      int act;
                      if (a == MotionEvent.ACTION_DOWN) act = FarmDevice.ACT_DOWN;
                      else if (a == MotionEvent.ACTION_MOVE) act = FarmDevice.ACT_MOVE;
                      else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) act = FarmDevice.ACT_UP;
                      else return true; // abaikan jari kedua
                      if (act == FarmDevice.ACT_DOWN && dev.noControl && !warnedNoControl) {
                          warnedNoControl = true;
                          h.toastL("Sentuhan belum aktif di " + dev.label() + ". Di HP itu aktifkan Aksesibilitas CFM Agen, lalu sambungkan ulang.");
                      }
                      float w = v.getWidth(), hh = v.getHeight();
                      if (w <= 0 || hh <= 0) return true;
                      sendTouch(dev, act, clamp01(e.getX() / w), clamp01(e.getY() / hh));
                      return true;
                  }

                  void dispose() {
                      ui.removeCallbacks(retry);
                  }

                  @Override
                  public void onSurfaceTextureAvailable(SurfaceTexture st, int w, int hh) {
                      surface = new Surface(st);
                      applyStreams();
                  }

                  @Override
                  public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int hh) { }

                  @Override
                  public boolean onSurfaceTextureDestroyed(final SurfaceTexture st) {
                      final Surface s = surface;
                      surface = null;
                      if (s == null) return true;
                      dev.stopSurface(s, () -> {
                          try { s.release(); } catch (Throwable ignored) { }
                          try { st.release(); } catch (Throwable ignored) { }
                      });
                      return false;
                  }

                  @Override
                  public void onSurfaceTextureUpdated(SurfaceTexture st) { }

                  void onState() {
                      if (dev.state == FarmDevice.ST_LIVE) {
                          retries = 0;
                      } else if (dev.state == FarmDevice.ST_ERROR && active && retries < MAX_RETRY) {
                          retries++;
                          ui.removeCallbacks(retry);
                          ui.postDelayed(retry, 4000L * retries);
                      }
                      refresh();
                  }

                  void refresh() {
                      titleTv.setText(dev.label());
                      subTv.setText(dev.host + (dev.vw > 0 ? " · " + dev.vw + "×" + dev.vh : ""));
                      dotV.setBackground(dot(dotColor(dev)));
                      if (dev.vw > 0 && dev.vh > 0) screen.setRatio(dev.vw / (float) dev.vh);
                      syncChip.setText(sync ? "Sinkron: Hidup" : "Sinkron: Mati");
                      pillOn(syncChip, sync);
                      if (sync) {
                          int n = 0;
                          for (FarmDevice d : devs) if (d != dev && d.isLive()) n++;
                          banner.setVisibility(View.VISIBLE);
                          banner.setText("Sinkron aktif · gerakan ditiru ke " + n + " HP lain");
                      } else {
                          banner.setVisibility(View.GONE);
                      }
                      boolean sb = dev.state == FarmDevice.ST_LIVE && dev.standby;
                      reclaimBtn.setVisibility(sb ? View.VISIBLE : View.GONE);
                      status.setBackgroundColor(sb ? 0xB005070B : 0x00000000);
                      switch (dev.state) {
                          case FarmDevice.ST_LIVE:
                              if (sb) {
                                  status.setVisibility(View.VISIBLE);
                                  status.setTextColor(MainActivity.WARN);
                                  status.setText("Siaga: layar tidak dikirim\n\n" + dev.message
                                          + "\n\nSentuhan dan tombol di bawah tetap berjalan. Ambil layar meminta HP itu membagikan layar lagi "
                                          + "(layar direbut dari aplikasi yang memakainya, mis. Macrorify).");
                              } else {
                                  status.setVisibility(View.GONE);
                              }
                              break;
                          case FarmDevice.ST_ERROR:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.BAD);
                              status.setText(dev.message + "\n\n" + (retries < MAX_RETRY ? "Mencoba lagi otomatis..." : "Tutup lalu buka lagi untuk mencoba ulang"));
                              break;
                          default:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.DIM);
                              status.setText(dev.state == FarmDevice.ST_CONNECTING ? dev.message : "Menunggu...");
                      }
                  }
              }

