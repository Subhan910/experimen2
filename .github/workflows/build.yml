          .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(160deg,#6d93fa,var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -8px rgba(62,107,240,.9);cursor:pointer;transition:transform .12s}
          .fab:active{transform:scale(.93)}
          .i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          .i.sm{width:16px;height:16px}

          /* input */
          .input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font:15px system-ui,sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
          .input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(122,167,255,.18)}
          textarea.input{resize:none;line-height:1.5}
          .field{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 2px 6px}

          /* lencana */
          .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;border-radius:999px;padding:5px 10px;background:rgba(143,155,176,.15);color:var(--dim);white-space:nowrap}
          .chip.ok{background:rgba(61,214,140,.14);color:var(--ok)}
          .chip.warn{background:rgba(245,185,70,.14);color:var(--warn)}
          .chip.bad{background:rgba(255,107,107,.14);color:var(--bad)}
          .chip.acc{background:rgba(122,167,255,.15);color:var(--acc)}
          .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

          /* sakelar */
          .sw{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer}
          .sw+.sw{border-top:1px solid var(--line)}
          .sw small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
          .sw input{position:absolute;opacity:0;pointer-events:none}
          .sw i{flex:none;position:relative;width:46px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:background .2s,border-color .2s}
          .sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
          .sw input:checked+i{background:var(--acc2);border-color:var(--acc2)}
          .sw input:checked+i::after{transform:translateX(18px);background:#fff}
          .sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(122,167,255,.3)}

          .fade-in{animation:cfm-in .24s ease both}
          @keyframes cfm-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
