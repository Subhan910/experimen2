                          }
                          if (t < 0) return;
                          switch (t) {
                              case AgentWire.C_TOUCH: {
                                  int a = in.readUnsignedByte();
                                  int x = in.readUnsignedShort(), y = in.readUnsignedShort();
                                  if (a <= 2) backend.touch(a, x, y);
                                  break;
                              }
                              case AgentWire.C_KEY:
                                  backend.key(in.readInt());
                                  break;
                              case AgentWire.C_TEXT: {
                                  int n = in.readUnsignedShort();
                                  if (n > AgentWire.MAX_TEXT) return;
