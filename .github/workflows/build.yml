                      case 3:
                          action = GLOBAL_ACTION_HOME;
                          break;
                      case 4:
                          action = GLOBAL_ACTION_BACK;
                          break;
                      case 187:
                          action = GLOBAL_ACTION_RECENTS;
                          break;
                      default:
                          return false;
                  }
                  main.post(() -> {
                      try {
                          performGlobalAction(action);
                      } catch (Throwable ignored) { }
                  });
                  return true;
              }

