          package id.cfm.webui;

          import java.io.ByteArrayOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.ByteBuffer;
          import java.security.MessageDigest;

          /**
           * Protokol "Mode Agen": HP farm menjalankan aplikasi ini sebagai agen (tangkap layar + layanan Aksesibilitas),
           * HP pengendali menyambung lewat TCP. Tanpa ADB, tanpa kabel, tanpa PC.
           *
           * Murni Java (tanpa kelas Android) supaya bisa diuji di komputer.
           *
           * Jabat tangan:
           *   server -> klien : "CFMA" ver(1) nonce(16)
           *   klien  -> server: SHA-256(nonce + PIN)(32) maxSize(i32) bitrate(i32) fps(i32)
           *   server -> klien : status(1)  1 = OK, 2 = OK tetapi sentuhan belum aktif, 0 = PIN salah, 3 = galat + teks(u16 + utf8),
           *                     4 / 5 = SIAGA (seperti 1 / 2, tetapi layar belum dibagikan atau direbut aplikasi lain)
           *   bila OK/siaga   : nama(64) codec(i32 = "h264") lebar(i32) tinggi(i32)
           * Lalu server mengirim paket video seperti scrcpy: pts+flag(i64, bit63 = config, bit62 = keyframe) ukuran(i32) data.
           * Paket berukuran 0 = detak jantung (diabaikan). Paket dengan bit61 = PEMBERITAHUAN: isinya teks UTF-8 alasan
           * mengapa video berhenti (sesi masuk siaga dan tetap terbuka; video dilanjutkan di sesi yang sama bila layar
           * berhasil diambil kembali). Di keadaan siaga sentuhan dan tombol tetap berjalan.
           *
           * Klien -> server (setelah jabat tangan), tiap pesan diawali 1 byte tipe:
           *   1 TOUCH  aksi(u8) x(u16) y(u16)    koordinat 0..65535 relatif ke layar penuh
           *   2 KEY    kode(i32)                 kode keyevent Android
           *   3 TEXT   panjang(u16) utf8
           *   4 SYNC   minta keyframe baru
           *   5 PING   penanda hidup
           */
          final class AgentWire {

              static final int PORT = 5600;
              static final int VERSION = 1;
              static final byte[] MAGIC = {'C', 'F', 'M', 'A'};
              static final int CODEC_H264 = 0x68323634;

              static final int ST_BADPIN = 0, ST_OK = 1, ST_OK_NOCONTROL = 2, ST_ERROR = 3, ST_STANDBY = 4, ST_STANDBY_NOCONTROL = 5;
              static final int C_TOUCH = 1, C_KEY = 2, C_TEXT = 3, C_SYNC = 4, C_PING = 5, C_RECLAIM = 6;
              /** Bit penanda paket pemberitahuan teks pada kolom pts+flag. */
              static final long FLAG_NOTICE = 1L << 61;
              static final int MAX_TEXT = 4000;

              private AgentWire() { }

              /** Hasil jabat tangan di sisi klien. */
              static final class Hello {
                  String name = "";
                  int width, height;
                  boolean control;
                  /** true = layar belum tersedia (belum dibagikan atau direbut aplikasi lain); sesi tetap terbuka. */
                  boolean standby;
              }

              static byte[] hash(byte[] nonce, String pin) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      md.update(nonce);
                      md.update(pin == null ? new byte[0] : pin.getBytes("UTF-8"));
                      return md.digest();
                  } catch (Exception e) {
                      throw new IllegalStateException(e);
                  }
              }

              // ---------- pesan kontrol (klien -> server) ----------
              static int to16(float v) {
                  if (v != v) return 0;
                  int i = Math.round(v * 65535f);
                  return i < 0 ? 0 : (i > 65535 ? 65535 : i);
              }

              static byte[] touchMsg(int action, float nx, float ny) {
                  ByteBuffer b = ByteBuffer.allocate(6);
                  b.put((byte) C_TOUCH).put((byte) action).putShort((short) to16(nx)).putShort((short) to16(ny));
                  return b.array();
              }

              static byte[] keyMsg(int code) {
                  ByteBuffer b = ByteBuffer.allocate(5);
                  b.put((byte) C_KEY).putInt(code);
                  return b.array();
              }

              static byte[] textMsg(String s) {
                  byte[] t;
                  try {
                      t = s.getBytes("UTF-8");
                  } catch (Exception e) {
                      t = new byte[0];
                  }
                  if (t.length > MAX_TEXT) t = java.util.Arrays.copyOf(t, MAX_TEXT);
                  ByteBuffer b = ByteBuffer.allocate(3 + t.length);
                  b.put((byte) C_TEXT).putShort((short) t.length).put(t);
                  return b.array();
              }

              static byte[] simpleMsg(int type) {
                  return new byte[]{(byte) type};
              }

              // ---------- sisi klien ----------
              /** Jabat tangan dari sisi pengendali. Melempar IOException berisi pesan yang bisa ditampilkan ke pengguna. */
              static Hello clientHello(DataInputStream in, DataOutputStream out, String pin, int maxSize, int bitrate, int fps) throws IOException {
                  byte[] magic = new byte[4];
                  in.readFully(magic);
                  if (!java.util.Arrays.equals(magic, MAGIC)) throw new IOException("Bukan Agen CFM (port ini dipakai layanan lain)");
                  int ver = in.readUnsignedByte();
                  if (ver != VERSION) throw new IOException("Versi Agen berbeda (" + ver + "). Perbarui aplikasi di kedua HP");
                  byte[] nonce = new byte[16];
                  in.readFully(nonce);
                  out.write(hash(nonce, pin));
                  out.writeInt(maxSize);
                  out.writeInt(bitrate);
                  out.writeInt(fps);
                  out.flush();
                  int st = in.readUnsignedByte();
                  if (st == ST_BADPIN) throw new IOException("PIN Agen salah. Ubah PIN lewat menu titik tiga di kartu HP");
                  if (st == ST_ERROR) {
                      int n = in.readUnsignedShort();
                      byte[] m = new byte[n];
                      in.readFully(m);
                      throw new IOException(new String(m, "UTF-8"));
                  }
                  if (st != ST_OK && st != ST_OK_NOCONTROL && st != ST_STANDBY && st != ST_STANDBY_NOCONTROL) {
                      throw new IOException("Jawaban Agen tidak dikenal");
                  }
                  byte[] name = new byte[64];
                  in.readFully(name);
                  int len = 0;
                  while (len < name.length && name[len] != 0) len++;
                  Hello h = new Hello();
                  h.name = new String(name, 0, len, "UTF-8");
                  h.control = st == ST_OK || st == ST_STANDBY;
                  h.standby = st == ST_STANDBY || st == ST_STANDBY_NOCONTROL;
                  int codec = in.readInt();
                  if (codec != CODEC_H264) throw new IOException("Codec video Agen tidak didukung");
                  h.width = in.readInt();
                  h.height = in.readInt();
                  if (h.width <= 0 || h.height <= 0 || h.width > 8192 || h.height > 8192) throw new IOException("Ukuran video tidak valid");
                  return h;
              }

              /** true bila host:port menjawab seperti Agen CFM. Dipakai saat memindai jaringan. */
              static boolean probe(String host, int port, int timeoutMs) {
                  try (Socket s = new Socket()) {
                      s.connect(new InetSocketAddress(host, port), timeoutMs);
                      s.setSoTimeout(Math.max(500, timeoutMs));
                      DataInputStream in = new DataInputStream(s.getInputStream());
                      byte[] m = new byte[5];
                      in.readFully(m);
                      return m[0] == MAGIC[0] && m[1] == MAGIC[1] && m[2] == MAGIC[2] && m[3] == MAGIC[3];
                  } catch (Exception e) {
                      return false;
                  }
              }

              // ---------- bantuan sisi server ----------
              static byte[] errorReply(String msg) {
                  try {
                      byte[] t = msg.getBytes("UTF-8");
                      if (t.length > 400) t = java.util.Arrays.copyOf(t, 400);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      DataOutputStream d = new DataOutputStream(bo);
                      d.writeByte(ST_ERROR);
                      d.writeShort(t.length);
                      d.write(t);
                      return bo.toByteArray();
                  } catch (IOException e) {
                      return new byte[]{(byte) ST_ERROR, 0, 0};
                  }
              }
          }
