          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var $ = function (s) { return document.getElementById(s); };
          var exp = '', justEq = false, hist = [];
          var disp = $('disp'), res = $('res'), pad = $('pad'), last = $('last');
          var KEYS = ['C', '←', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '(', ')', '='];

          function calc(e) {
            var s = e.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'), p = 0;
            function pe() {
              var v = pt();
              while (p < s.length) {
                var c = s[p];
                if (c === '+') { p++; v += pt(); } else if (c === '-') { p++; v -= pt(); } else break;
              }
              return v;
            }
            function pt() {
              var v = pf();
              while (p < s.length) {
                var c = s[p];
                if (c === '*') { p++; v *= pf(); } else if (c === '/') { p++; v /= pf(); } else break;
              }
              return v;
            }
            function pf() {
              if (p >= s.length) throw new Error('x');
              var c = s[p];
              if (c === '-') { p++; return -pf(); }
              if (c === '+') { p++; return pf(); }
              var v;
              if (c === '(') {
                p++; v = pe();
                if (s[p] !== ')') throw new Error('x');
                p++;
              } else {
                var st = p;
                while (p < s.length && /[0-9.]/.test(s[p])) p++;
                if (st === p) throw new Error('x');
                v = Number(s.slice(st, p));
                if (isNaN(v)) throw new Error('x');
              }
              while (s[p] === '%') { p++; v /= 100; }
              return v;
            }
            var v = pe();
            if (p !== s.length) throw new Error('x');
            return v;
          }

          function fmt(v) {
            if (!isFinite(v)) throw new Error('x');
            if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
            return String(parseFloat(v.toPrecision(12)));
          }
          function group(s) { // 1234567.5 -> 1.234.567,5 hanya untuk tampilan hasil
            var m = s.match(/^(-?)(\d+)(\.\d+)?(e.*)?$/);
            if (!m) return s;
            return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (m[3] ? ',' + m[3].slice(1) : '') + (m[4] || '');
          }

          function paint() {
            disp.textContent = exp || '0';
            var n = (exp || '0').length;
            disp.style.fontSize = n > 20 ? '24px' : n > 14 ? '30px' : n > 9 ? '38px' : '46px';
            res.className = '';
            try {
              var r = fmt(calc(exp));
              res.textContent = exp === r || !exp ? '' : '= ' + group(r);
            } catch (e) { res.textContent = ''; }
          }

          function key(k) {
            var isNum = /[0-9.()]/.test(k);
            if (k === 'C') { exp = ''; last.textContent = ''; justEq = false; }
            else if (k === '←') { exp = exp.slice(0, -1); justEq = false; }
            else if (k === '=') {
              if (!exp) return;
              try {
                var r = fmt(calc(exp));
                last.textContent = exp + ' =';
                hist.unshift({ e: exp, r: r });
                hist = hist.slice(0, 40);
                C.set('h', JSON.stringify(hist));
                exp = r; justEq = true;
