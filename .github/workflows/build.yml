                      p.registerCallback(cb, hh); // wajib didaftarkan sebelum createVirtualDisplay (Android 14)
                      dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      if (dm != null) dm.registerDisplayListener(displayListener, hh);
                      instance = this;
                      applyWake();
                      updateNotification();
                      AgentHost.ensure(this);
                      AgentHost.projectionReady();
                  }
              }

              /** Lepaskan tangkap layar, encoder, dan layar virtual. Pemanggil harus memegang monitor layanan. */
              private void releaseLocked() {
                  if (dm != null) {
                      try { dm.unregisterDisplayListener(displayListener); } catch (Throwable ignored) { }
                      dm = null;
                  }
                  MediaProjection p;
                  MediaProjection.Callback cb;
                  synchronized (vlock) {
                      // projection dikosongkan lebih dulu di dalam vlock: startVideo yang menyusul akan melihat "belum ada layar"
                      // dan tidak membuat layar virtual baru pada projection yang sedang dilepas
                      p = projection;
                      cb = pcb;
                      projection = null;
                      pcb = null;
                      stopPipelineLocked();
                      sink = null;
                      if (vd != null) {
                          try { vd.release(); } catch (Throwable ignored) { }
                          vd = null;
                      }
                  }
                  if (p != null) {
                      try { if (cb != null) p.unregisterCallback(cb); } catch (Throwable ignored) { }
                      try { p.stop(); } catch (Throwable ignored) { }
                  }
              }

              /** Layar hilang tetapi layanan tetap hidup (siaga): pengendali diberi tahu dan bisa meminta layar kembali. */
              private void takeover(String reason) {
                  takeover(reason, null);
              }

              /** expect != null: hanya bila projection itu masih yang aktif (kabar lama dari projection yang sudah diganti diabaikan). */
              private void takeover(String reason, MediaProjection expect) {
                  synchronized (this) {
                      if (closing) return;
                      if (expect != null && projection != expect) return;
                      lastError = reason;
                      releaseLocked();
                      updateNotification();
                      AgentHost.projectionLost(reason); // hanya mengantre kabar (tidak memblokir)
                  }
              }

              private void shutdown() {
                  String why;
                  synchronized (this) {
                      if (closing) return;
                      closing = true;
                      releaseLocked();
                      if (wake != null) {
                          try { if (wake.isHeld()) wake.release(); } catch (Throwable ignored) { }
                          wake = null;
                      }
                      try { stopForeground(true); } catch (Throwable ignored) { }
                      if (ht != null) {
                          ht.quitSafely();
                          ht = null;
                          hh = null;
                      }
                      instance = null;
                      why = lastError == null || lastError.isEmpty() ? "Berbagi layar dihentikan di HP itu" : lastError;
                      AgentHost.projectionLost(why);
                  }
                  AgentHost.cancelReclaimNotice();
                  // Server tetap hidup bila Aksesibilitas masih aktif: pengendali tetap tersambung (siaga) dan bisa meminta layar lagi
                  AgentHost.stopIfIdle();
              }

              @SuppressWarnings("deprecation")
              private synchronized void applyWake() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm == null) return;
                  boolean want = keepAwake(this) && !closing && instance == this;
                  if (want && wake == null) {
                      wake = pm.newWakeLock(PowerManager.SCREEN_DIM_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP, "cfm:agent");
                      wake.setReferenceCounted(false);
                      wake.acquire();
                  } else if (!want && wake != null) {
                      try { if (wake.isHeld()) wake.release(); } catch (Throwable ignored) { }
                      wake = null;
                  }
              }

              // ---------- notifikasi ----------
              private Notification notification() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                      nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Mode Agen", NotificationManager.IMPORTANCE_LOW));
                  }
                  int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent open = PendingIntent.getActivity(this, 0, new Intent(this, AgentActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | imm);
                  PendingIntent stop = PendingIntent.getService(this, 1, new Intent(this, AgentService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_UPDATE_CURRENT | imm);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  List<String> ips = addresses();
                  boolean live = projection != null;
                  b.setContentTitle(live ? "CFM Agen aktif" : "CFM Agen siaga")
                          .setContentText(live ? "Siap dikontrol · " + (ips.isEmpty() ? "" : ips.get(0) + " · ") + "port " + AgentWire.PORT
                                  : "Layar dipakai aplikasi lain · sentuhan tetap jalan")
                          .setSmallIcon(Build.VERSION.SDK_INT >= 23 ? R.drawable.ic_farm : android.R.drawable.ic_menu_view)
                          .setOngoing(true)
                          .setContentIntent(open);
                  if (!live) {
                      PendingIntent take = PendingIntent.getActivity(this, 2, AgentHost.reclaimIntent(this), PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      b.addAction(android.R.drawable.ic_menu_view, "Ambil layar", take);
                  }
                  b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "Berhenti", stop);
                  return b.build();
              }

              private void updateNotification() {
                  if (closing) return;
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(NOTIF_ID, notification());
                  } catch (Throwable ignored) { }
              }

              // ---------- dipanggil AgentHost (Backend) ----------
              int[] startVideo(int maxSize, int bitrate, int fps, AgentServer.Sink s) throws IOException {
                  synchronized (vlock) {
                      if (projection == null || closing) {
                          String e = lastError;
                          throw new AgentServer.NoVideoException(e == null || e.isEmpty() ? "Layar belum dibagikan di HP itu" : e);
                      }
                      stopPipelineLocked();
                      reqMax = maxSize;
                      reqBitrate = bitrate;
                      reqFps = fps;
                      sink = s;
                      return startPipelineLocked();
                  }
              }

              void stopVideo(AgentServer.Sink s) {
                  synchronized (vlock) {
                      if (s != null && s != sink) return; // sesi lain sudah mengambil alih aliran
                      stopPipelineLocked();
                      sink = null;
                  }
              }

              void requestSync() {
                  synchronized (vlock) {
                      if (pipe != null) pipe.requestSync();
                  }
              }

              // ---------- tangkap layar + encoder ----------
              private int[] realSize() {
                  DisplayMetrics m = new DisplayMetrics();
                  DisplayManager d = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  Display disp = d == null ? null : d.getDisplay(Display.DEFAULT_DISPLAY);
                  if (disp != null) disp.getRealMetrics(m);
                  else m = getResources().getDisplayMetrics();
                  return new int[]{m.widthPixels, m.heightPixels, m.densityDpi};
              }

              private static int alignDown(int v, int a) {
                  return Math.max(a, (v / a) * a);
              }

              private int[] startPipelineLocked() throws IOException {
                  int[] r = realSize();
                  realW = r[0];
                  realH = r[1];
                  int w0 = r[0], h0 = r[1];
                  int mx = Math.max(w0, h0);
                  if (reqMax > 0 && mx > reqMax) {
                      float sc = reqMax / (float) mx;
                      w0 = Math.round(w0 * sc);
                      h0 = Math.round(h0 * sc);
                  }
                  IOException last = null;
                  for (int align : new int[]{8, 16, 32}) {
                      int w = alignDown(w0, align), h = alignDown(h0, align);
                      try {
                          pipe = new Pipe(w, h, r[2], reqBitrate, reqFps, sink);
                          return new int[]{w, h};
                      } catch (EncoderException e) {
                          last = e; // encoder menolak ukuran ini: coba kelipatan yang lebih besar
                      }
                  }
                  throw last != null ? last : new IOException("Encoder gagal");
              }

              private void stopPipelineLocked() {
                  Pipe p = pipe;
                  pipe = null;
                  if (p != null) p.shutdown();
              }

              private final DisplayManager.DisplayListener displayListener = new DisplayManager.DisplayListener() {
                  @Override
                  public void onDisplayAdded(int displayId) { }

                  @Override
                  public void onDisplayRemoved(int displayId) { }

                  @Override
                  public void onDisplayChanged(int displayId) {
                      if (displayId != Display.DEFAULT_DISPLAY) return;
                      synchronized (vlock) {
                          if (pipe == null || sink == null) return;
                          int[] r = realSize();
                          if (r[0] == realW && r[1] == realH) return;
                          // HP diputar: mulai ulang encoder dengan ukuran baru. Pengendali membaca ukuran baru dari SPS.
                          stopPipelineLocked();
                          try {
                              startPipelineLocked();
                          } catch (Throwable e) {
                              lastError = "Gagal mengikuti rotasi layar: " + e.getMessage();
                              AgentHost.kick();
                          }
                      }
                  }
              };

              private final class Pipe implements Runnable {
                  final MediaCodec codec;
                  final Surface surface;
                  final AgentServer.Sink out;
                  final Thread th;
                  volatile boolean stop;

                  Pipe(int w, int h, int dpi, int bitrate, int fps, AgentServer.Sink out) throws IOException {
                      this.out = out;
                      MediaCodec c = null;
                      Surface s = null;
                      try {
                          c = MediaCodec.createEncoderByType("video/avc");
                          MediaFormat f = MediaFormat.createVideoFormat("video/avc", w, h);
                          f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                          f.setInteger(MediaFormat.KEY_BIT_RATE, bitrate);
                          f.setInteger(MediaFormat.KEY_FRAME_RATE, 60); // wajib ada, tidak membatasi laju bingkai sebenarnya
                          f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 5);
                          f.setLong(MediaFormat.KEY_REPEAT_PREVIOUS_FRAME_AFTER, 500000L); // layar diam tetap mengirim bingkai
                          if (fps > 0) f.setFloat("max-fps-to-encoder", (float) fps);
                          c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                          s = c.createInputSurface();
                          c.start();
                      } catch (Throwable e) {
                          if (s != null) s.release();
                          if (c != null) {
                              try { c.release(); } catch (Throwable ignored) { }
                          }
                          throw new EncoderException("Encoder video gagal (" + w + "x" + h + "): " + e.getMessage());
                      }
                      codec = c;
                      surface = s;
                      try {
                          MediaProjection mp = projection;
                          if (mp == null) throw new AgentServer.NoVideoException("Layar baru saja direbut aplikasi lain");
                          if (vd == null) {
                              vd = mp.createVirtualDisplay("cfm-agent", w, h, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, s, null, null);
                              if (vd == null) throw new IOException("Layar virtual gagal dibuat");
                          } else {
                              vd.resize(w, h, dpi);
                              vd.setSurface(s);
                          }
                      } catch (Throwable e) {
                          try { c.stop(); } catch (Throwable ignored) { }
                          try { c.release(); } catch (Throwable ignored) { }
                          s.release();
                          if (e instanceof AgentServer.NoVideoException) throw (AgentServer.NoVideoException) e;
                          throw new IOException("Tangkap layar ditolak sistem: " + e.getMessage() + ". Hentikan lalu mulai ulang Mode Agen");
                      }
                      th = new Thread(this, "agent-enc");
                      th.setDaemon(true);
                      th.start();
                  }

                  void requestSync() {
                      try {
                          Bundle b = new Bundle();
                          b.putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0);
                          codec.setParameters(b);
                      } catch (Throwable ignored) { }
                  }

                  void shutdown() {
                      stop = true;
                      try {
                          if (vd != null) vd.setSurface(null);
                      } catch (Throwable ignored) { }
                      try { th.join(1500); } catch (InterruptedException ignored) { }
                      try { codec.stop(); } catch (Throwable ignored) { }
                      try { codec.release(); } catch (Throwable ignored) { }
                      try { surface.release(); } catch (Throwable ignored) { }
                  }

                  @Override
                  public void run() {
                      MediaCodec.BufferInfo bi = new MediaCodec.BufferInfo();
                      try {
                          while (!stop) {
                              int i = codec.dequeueOutputBuffer(bi, 100000);
                              if (i < 0) continue; // belum ada keluaran, atau format berubah
                              byte[] d = null;
                              boolean cfg = (bi.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                              boolean key = (bi.flags & MediaCodec.BUFFER_FLAG_KEY_FRAME) != 0;
                              long pts = bi.presentationTimeUs;
                              try {
                                  if (bi.size > 0) {
                                      ByteBuffer b = codec.getOutputBuffer(i);
                                      if (b != null) {
                                          d = new byte[bi.size];
                                          b.position(bi.offset);
                                          b.limit(bi.offset + bi.size);
                                          b.get(d);
                                      }
                                  }
                              } finally {
                                  codec.releaseOutputBuffer(i, false);
                              }
                              if (d != null) out.packet(cfg, key, pts, d, 0, d.length);
                              if ((bi.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break;
                          }
                      } catch (IOException e) {
                          // klien putus: sink sudah menutup sesinya
                      } catch (Throwable e) {
                          if (!stop) {
                              lastError = "Encoder berhenti: " + e.getMessage();
                              AgentHost.kick();
                          }
                      }
                  }
              }
          }
