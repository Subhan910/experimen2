          }
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
          body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
          ::-webkit-scrollbar{width:0;height:0}
          ::placeholder{color:var(--mute)}
          ::selection{background:rgba(122,167,255,.35)}
          button{font-family:inherit}

          /* tata letak */
          .page{padding:16px 16px 32px;max-width:720px;margin:0 auto}
          .row{display:flex;gap:10px;align-items:center}
          .col{display:flex;flex-direction:column;gap:10px}
          .grow{flex:1;min-width:0}
          .hide{display:none!important}
          .appbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:rgba(11,14,20,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

          /* teks */
          .h1{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:2px 0}
          .sub{color:var(--dim);font-size:13px;margin:2px 0 0}
          .sec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:22px 2px 10px}
          .mono{font-family:var(--mono)}
          .dim{color:var(--dim)}
          .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--acc)}

          /* kartu & daftar */
          .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
          .card.tap{cursor:pointer;transition:background .15s,transform .15s}
          .card.tap:active{background:var(--card2);transform:scale(.985)}
          .item{display:flex;gap:12px;align-items:center;padding:12px 0}
          .item+.item{border-top:1px solid var(--line)}
          .divider{height:1px;background:var(--line);margin:12px 0}
          .tile{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px}
          .empty{text-align:center;color:var(--dim);padding:48px 18px}
          .empty .big{font-size:38px;margin-bottom:10px}
          .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

          /* tombol */
          .btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:0 16px;min-height:44px;font:600 14px/1 system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s,filter .12s}
          .btn:active{transform:scale(.97);filter:brightness(1.18)}
          .btn.pri{background:linear-gradient(180deg,#5b86f6,var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(62,107,240,.8)}
          .btn.ghost{background:transparent}
          .btn.bad{color:var(--bad)}
          .btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
          .btn.blk{width:100%}
          .btn[disabled]{opacity:.45;pointer-events:none}
          .ibtn{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
          .ibtn:active{background:var(--card2);color:var(--text)}
          .ibtn.on{color:var(--acc);background:rgba(122,167,255,.14)}
          .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(160deg,#6d93fa,var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -8px rgba(62,107,240,.9);cursor:pointer;transition:transform .12s}
          .fab:active{transform:scale(.93)}
          .i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          .i.sm{width:16px;height:16px}

          /* input */
          .input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font:15px system-ui,sans-serif;outline:0;transition:border-color .15s,box-shadow .15s}
          .input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(122,167,255,.18)}
          textarea.input{resize:none;line-height:1.5}
          .field{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 2px 6px}

          /* lencana */
          .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;border-radius:999px;padding:5px 10px;background:rgba(143,155,176,.15);color:var(--dim);white-space:nowrap}
          .chip.ok{background:rgba(61,214,140,.14);color:var(--ok)}
          .chip.warn{background:rgba(245,185,70,.14);color:var(--warn)}
          .chip.bad{background:rgba(255,107,107,.14);color:var(--bad)}
          .chip.acc{background:rgba(122,167,255,.15);color:var(--acc)}
          .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

          /* sakelar */
          .sw{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer}
          .sw+.sw{border-top:1px solid var(--line)}
          .sw small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
          .sw input{position:absolute;opacity:0;pointer-events:none}
          .sw i{flex:none;position:relative;width:46px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:background .2s,border-color .2s}
          .sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
          .sw input:checked+i{background:var(--acc2);border-color:var(--acc2)}
          .sw input:checked+i::after{transform:translateX(18px);background:#fff}
          .sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(122,167,255,.3)}

          .fade-in{animation:cfm-in .24s ease both}
          @keyframes cfm-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
