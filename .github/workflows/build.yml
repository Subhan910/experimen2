                              if (key) pf |= 1L << 62;
                              out.writeLong(pf);
                              out.writeInt(len);
                              if (len > 0) out.write(data, off, len);
                              out.flush();
                              lastWrite = System.currentTimeMillis();
                          }
                      } catch (IOException e) {
                          close();
                          throw e;
                      }
                  }

                  /** Menulis pemberitahuan teks. Harus dipanggil dengan memegang wlock. */
                  void writeNoticeLocked(String msg) throws IOException {
                      byte[] t = msg.getBytes("UTF-8");
                      if (t.length > 400) t = java.util.Arrays.copyOf(t, 400);
