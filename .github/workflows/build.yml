              // ---------- aktifkan ADB WiFi lewat kabel OTG (tanpa PC) ----------
              private void usbSetup() {
                  if (usbBusy) return;
                  usbBusy = true;
                  labelPills();
                  h.toast("Mencari HP farm di kabel OTG...");
                  UsbSetup.run(h, 5555, new UsbSetup.Cb() {
                      @Override
                      public void progress(final String msg) {
                          ui.post(() -> h.toastL(msg));
                      }

                      @Override
                      public void done(final List<UsbSetup.Result> results, final String problem) {
                          ui.post(() -> usbDone(results, problem));
                      }
                  });
              }

              private void showText(String title, String body) {
                  TextView t = h.text(body, 13.5f, 0xFFC0C9DA, false);
                  t.setLineSpacing(0f, 1.15f);
                  MaxScroll ms = new MaxScroll(h, dp(340));
                  ms.addView(t, new FrameLayout.LayoutParams(-1, -2));
                  h.new Dlg(h).setTitle(title).setView(ms).setPositiveButton("Mengerti", null).show();
              }

              private void usbDone(List<UsbSetup.Result> results, String problem) {
                  usbBusy = false;
                  labelPills();
                  if (problem != null) {
                      showText("Via USB", problem);
                      return;
                  }
                  StringBuilder sb = new StringBuilder();
                  int added = 0;
                  for (UsbSetup.Result r : results) {
                      if (sb.length() > 0) sb.append("\n\n");
                      if (!r.ok) {
                          sb.append("✗ ").append(r.label).append("\n").append(r.error);
                      } else if (r.ip.isEmpty()) {
                          sb.append("✓ ").append(r.label).append("\nADB WiFi aktif, tetapi alamat IP tidak terbaca. "
                                  + "Pastikan HP farm tersambung ke WiFi/hotspot, lalu ketuk Pindai WiFi.");
                      } else if (has(r.ip, 5555)) {
                          sb.append("✓ ").append(r.label).append(" · ").append(r.ip).append("\nADB WiFi aktif (sudah ada di daftar)");
                      } else {
                          FarmDevice d = new FarmDevice("", r.ip, 5555, this);
                          d.model = r.model;
                          devs.add(d);
                          added++;
                          sb.append("✓ ").append(r.label).append(" · ").append(r.ip).append("\nADB WiFi aktif, ditambahkan ke daftar");
                      }
                  }
                  if (added > 0) {
                      save();
                      rebuildGrid();
                  } else {
                      for (Tile t : tiles.values()) t.retries = 0;
                  }
                  for (FarmDevice d : devs) d.invalidate();
                  applyStreams();
                  sb.append("\n\nKabel USB boleh dicabut.");
                  showText("Hasil Via USB", sb.toString());
              }

