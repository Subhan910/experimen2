              // ---------- navigasi samping ----------
              private List<String> keys() {
                  List<String> k = new ArrayList<>();
                  k.add("webui");
                  for (String id : plugins.keySet()) k.add("p:" + id);
                  k.add("nas");
                  k.add("farm");
                  k.add("manage");
                  return k;
              }

              private String nameOf(String key) {
                  if (key.equals("webui")) return "WebUI";
                  if (key.equals("nas")) return "NAS HP";
                  if (key.equals("farm")) return "Phone Farm";
                  if (key.equals("manage")) return "Kelola Fitur";
                  Plugin p = plugins.get(key.substring(2));
                  return p == null ? key : p.name;
              }

              private String subOf(String key) {
                  if (key.equals("webui")) return "Dasbor Clash · " + HOME_HOST;
                  if (key.equals("nas")) return "Penyimpanan WebDAV · port 8088";
                  if (key.equals("farm")) return farm == null ? "" : farm.subtitle();
                  if (key.equals("manage")) return plugins.size() + " fitur terpasang";
                  Plugin p = plugins.get(key.substring(2));
                  return p == null ? "" : "Fitur · v" + p.ver;
              }

