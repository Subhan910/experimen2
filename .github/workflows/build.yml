          /**
           * Mengaktifkan ADB WiFi di HP farm tanpa PC: HP farm dicolok ke HP ini dengan kabel OTG,
           * lalu aplikasi mengambil IP-nya dan mengirim "tcpip:5555" lewat ADB-over-USB (UsbAdb).
           */
          final class UsbSetup {

              private static final String ACTION_PERM = "id.cfm.webui.USB_PERMISSION";

              interface Cb {
                  /** Dipanggil dari thread latar. */
                  void progress(String msg);

                  void done(List<Result> results, String problem);
              }

              static final class Result {
                  String label = "", model = "", ip = "", error;
                  boolean ok;
              }

              private UsbSetup() { }

              static boolean isAdbInterface(UsbInterface i) {
                  return i.getInterfaceClass() == 255 && i.getInterfaceSubclass() == 66 && i.getInterfaceProtocol() == 1;
              }

              /** Jalankan di thread latar. Hasil dikirim lewat cb. */
              static void run(final Context ctx, final int port, final Cb cb) {
                  Thread t = new Thread(() -> {
                      try {
                          cb.done(work(ctx.getApplicationContext(), port, cb), null);
                      } catch (Throwable e) {
                          cb.done(new ArrayList<Result>(), e.getMessage() == null ? e.toString() : e.getMessage());
                      }
                  }, "usb-setup");
                  t.setDaemon(true);
                  t.start();
              }

              private static List<Result> work(Context ctx, int port, Cb cb) throws Exception {
                  if (!ctx.getPackageManager().hasSystemFeature(PackageManager.FEATURE_USB_HOST)) {
                      throw new IOException("HP ini tidak mendukung USB host (OTG)");
                  }
                  UsbManager um = (UsbManager) ctx.getSystemService(Context.USB_SERVICE);
                  if (um == null) throw new IOException("Layanan USB tidak tersedia");

                  List<UsbDevice> targets = new ArrayList<>();
                  int others = 0;
                  String otherName = "";
                  for (UsbDevice d : um.getDeviceList().values()) {
                      boolean adb = false;
                      for (int i = 0; i < d.getInterfaceCount(); i++) if (isAdbInterface(d.getInterface(i))) adb = true;
                      if (adb) {
                          targets.add(d);
                      } else {
                          others++;
                          otherName = d.getProductName() != null ? d.getProductName() : d.getDeviceName();
                      }
                  }
                  if (targets.isEmpty()) {
                      if (others == 0) {
                          throw new IOException("Tidak ada perangkat USB. Pasang adaptor OTG di HP ini (atau kabel USB-C ke USB-C bila kedua HP "
                                  + "USB-C, lalu pilih USB dikendalikan oleh Perangkat ini di pemberitahuan USB), sambungkan kabel data ke HP farm, "
                                  + "dan pastikan HP farm tidak hanya mengisi daya.");
                      }
                      throw new IOException(others + " perangkat USB terdeteksi (" + otherName + ") tetapi tanpa antarmuka ADB. "
                              + "Aktifkan Debugging USB di HP farm (Opsi pengembang), lalu coba lagi.");
                  }

                  List<Result> results = new ArrayList<>();
                  int n = 0;
                  for (UsbDevice d : targets) {
                      n++;
                      Result r = new Result();
                      r.label = (d.getProductName() != null ? d.getProductName() : "HP " + n);
                      results.add(r);
                      try {
                          String where = targets.size() > 1 ? " (" + n + "/" + targets.size() + ")" : "";
                          if (!um.hasPermission(d)) {
                              cb.progress("Izinkan akses USB di layar HP ini" + where);
                              requestPermission(ctx, um, d);
                              if (!um.hasPermission(d)) throw new IOException("Izin USB ditolak");
                          }
                          process(um, d, port, r, cb, where);
                          r.ok = true;
                      } catch (Throwable e) {
                          r.error = e.getMessage() == null ? e.toString() : e.getMessage();
                      }
                  }
                  return results;
              }

              private static void requestPermission(Context ctx, UsbManager um, UsbDevice d) throws IOException {
                  final CountDownLatch latch = new CountDownLatch(1);
                  BroadcastReceiver rx = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context c, Intent i) {
                          latch.countDown();
                      }
                  };
                  IntentFilter f = new IntentFilter(ACTION_PERM);
                  if (Build.VERSION.SDK_INT >= 33) ctx.registerReceiver(rx, f, Context.RECEIVER_NOT_EXPORTED);
                  else ctx.registerReceiver(rx, f);
                  try {
                      Intent in = new Intent(ACTION_PERM).setPackage(ctx.getPackageName());
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                      um.requestPermission(d, PendingIntent.getBroadcast(ctx, 0, in, flags));
                      if (!latch.await(60, TimeUnit.SECONDS)) throw new IOException("Izin USB tidak dijawab");
                  } catch (InterruptedException e) {
                      throw new IOException("Dibatalkan");
                  } finally {
                      try { ctx.unregisterReceiver(rx); } catch (Throwable ignored) { }
                  }
              }

              private static void process(final UsbManager um, final UsbDevice dev, int port, Result r, final Cb cb, String where) throws Exception {
                  UsbInterface itf = null;
                  for (int i = 0; i < dev.getInterfaceCount(); i++) {
                      if (isAdbInterface(dev.getInterface(i))) {
                          itf = dev.getInterface(i);
                          break;
                      }
                  }
                  if (itf == null) throw new IOException("Antarmuka ADB tidak ada");
                  UsbEndpoint in = null, out = null;
                  for (int i = 0; i < itf.getEndpointCount(); i++) {
                      UsbEndpoint e = itf.getEndpoint(i);
                      if (e.getType() != UsbConstants.USB_ENDPOINT_XFER_BULK) continue;
                      if (e.getDirection() == UsbConstants.USB_DIR_IN) in = e;
                      else out = e;
                  }
                  if (in == null || out == null) throw new IOException("Endpoint USB tidak lengkap");
                  final UsbEndpoint epIn = in, epOut = out;

                  final UsbDeviceConnection conn = um.openDevice(dev);
                  if (conn == null) throw new IOException("Tidak bisa membuka perangkat USB");
                  try {
                      if (!conn.claimInterface(itf, true)) throw new IOException("Antarmuka USB sedang dipakai");
                      UsbAdb adb = new UsbAdb(new UsbAdb.Pipe() {
                          @Override
                          public int read(byte[] b, int off, int len, int timeoutMs) {
                              return conn.bulkTransfer(epIn, b, off, len, timeoutMs);
                          }

                          @Override
                          public int write(byte[] b, int off, int len, int timeoutMs) {
                              return conn.bulkTransfer(epOut, b, off, len, timeoutMs);
                          }

                          @Override
                          public boolean alive() {
                              return um.getDeviceList().containsKey(dev.getDeviceName());
                          }
                      }, FarmDevice.privateKey(), FarmDevice.publicKeyLine());

                      cb.progress("Menghubungi HP farm lewat USB" + where + "...");
                      adb.connect(70000, () -> cb.progress("Di HP farm: ketuk Izinkan debugging (centang Selalu izinkan)"));

                      r.model = adb.shell("getprop ro.product.model").trim();
                      if (!r.model.isEmpty()) r.label = r.model;
                      r.ip = UsbAdb.parseWifiIp(adb.shell("ip -o -f inet addr show 2>/dev/null; echo ---; ifconfig wlan0 2>/dev/null"));

                      cb.progress("Mengaktifkan ADB WiFi di " + r.label + "...");
                      String resp = adb.tcpip(port);
                      if (!resp.toLowerCase().contains("restarting") && !resp.toLowerCase().contains("already")) {
                          throw new IOException(resp.isEmpty() ? "HP tidak membalas perintah tcpip" : resp);
                      }
                      try {
                          Thread.sleep(2500); // beri waktu adbd HP farm untuk restart sebelum disambung lewat WiFi
                      } catch (InterruptedException ignored) { }
                  } finally {
                      try { conn.releaseInterface(itf); } catch (Throwable ignored) { }
                      try { conn.close(); } catch (Throwable ignored) { }
                  }
              }
          }
