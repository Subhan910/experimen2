          </svg>
          <div id="c">
            <div class="top">
              <div class="t">Kalkulator</div>
              <button class="ibtn" id="bCp" type="button" aria-label="Salin hasil"><svg class="i"><use href="#i-copy"/></svg></button>
              <button class="ibtn" id="bHi" type="button" aria-label="Riwayat"><svg class="i"><use href="#i-clock"/></svg></button>
            </div>
            <div class="screen" id="scr">
              <div class="last" id="last"></div>
              <div id="disp">0</div>
              <div id="res"></div>
            </div>
            <div id="pad"></div>
          </div>
          <div class="scrim" id="scrim"></div>
          <div class="sheet" id="sheet" aria-hidden="true">
            <div class="hd"><b>Riwayat</b><button class="btn sm ghost bad" id="bClr" type="button">Hapus semua</button></div>
            <div class="hl" id="hl"></div>
          </div>
          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var $ = function (s) { return document.getElementById(s); };
          var exp = '', justEq = false, hist = [];
          var disp = $('disp'), res = $('res'), pad = $('pad'), last = $('last');
          var KEYS = ['C', '←', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '(', ')', '='];

          function calc(e) {
            var s = e.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'), p = 0;
            function pe() {
              var v = pt();
              while (p < s.length) {
                var c = s[p];
                if (c === '+') { p++; v += pt(); } else if (c === '-') { p++; v -= pt(); } else break;
              }
              return v;
            }
            function pt() {
              var v = pf();
              while (p < s.length) {
                var c = s[p];
                if (c === '*') { p++; v *= pf(); } else if (c === '/') { p++; v /= pf(); } else break;
              }
              return v;
            }
            function pf() {
              if (p >= s.length) throw new Error('x');
              var c = s[p];
              if (c === '-') { p++; return -pf(); }
              if (c === '+') { p++; return pf(); }
              var v;
              if (c === '(') {
                p++; v = pe();
                if (s[p] !== ')') throw new Error('x');
                p++;
              } else {
                var st = p;
                while (p < s.length && /[0-9.]/.test(s[p])) p++;
                if (st === p) throw new Error('x');
                v = Number(s.slice(st, p));
                if (isNaN(v)) throw new Error('x');
              }
              while (s[p] === '%') { p++; v /= 100; }
              return v;
            }
            var v = pe();
            if (p !== s.length) throw new Error('x');
            return v;
          }

          function fmt(v) {
            if (!isFinite(v)) throw new Error('x');
            if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
            return String(parseFloat(v.toPrecision(12)));
          }
          function group(s) { // 1234567.5 -> 1.234.567,5 hanya untuk tampilan hasil
            var m = s.match(/^(-?)(\d+)(\.\d+)?(e.*)?$/);
            if (!m) return s;
            return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (m[3] ? ',' + m[3].slice(1) : '') + (m[4] || '');
          }

          function paint() {
            disp.textContent = exp || '0';
            var n = (exp || '0').length;
            disp.style.fontSize = n > 20 ? '24px' : n > 14 ? '30px' : n > 9 ? '38px' : '46px';
            res.className = '';
            try {
              var r = fmt(calc(exp));
              res.textContent = exp === r || !exp ? '' : '= ' + group(r);
            } catch (e) { res.textContent = ''; }
          }

          function key(k) {
            var isNum = /[0-9.()]/.test(k);
            if (k === 'C') { exp = ''; last.textContent = ''; justEq = false; }
            else if (k === '←') { exp = exp.slice(0, -1); justEq = false; }
            else if (k === '=') {
              if (!exp) return;
              try {
                var r = fmt(calc(exp));
                last.textContent = exp + ' =';
                hist.unshift({ e: exp, r: r });
                hist = hist.slice(0, 40);
                C.set('h', JSON.stringify(hist));
                exp = r; justEq = true;
              } catch (e) {
                res.textContent = 'Ekspresi tidak valid'; res.className = 'err';
                $('scr').classList.remove('shake'); void $('scr').offsetWidth; $('scr').classList.add('shake');
                return;
              }
            } else {
              if (justEq && isNum) exp = '';
              justEq = false;
              exp += k;
            }
            paint();
          }

          KEYS.forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = k;
            var c = 'k';
            if ('÷×−+'.indexOf(k) >= 0) c += ' o';
            else if (k === '=') c += ' eq';
            else if (k === 'C') c += ' f c';
            else if (k === '←' || k === '%' || k === '(' || k === ')') c += ' f';
            b.className = c;
            b.setAttribute('aria-label', { '←': 'Hapus satu', 'C': 'Bersihkan', '÷': 'Bagi', '×': 'Kali', '−': 'Kurang', '+': 'Tambah', '=': 'Hasil' }[k] || k);
            b.onclick = function () { key(k); };
            pad.appendChild(b);
          });

          /* keyboard fisik */
          addEventListener('keydown', function (e) {
            var m = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '←', Escape: 'C', c: 'C', C: 'C' };
            var k = m[e.key] || e.key;
            if (KEYS.indexOf(k) >= 0) { e.preventDefault(); key(k); }
          });

          /* riwayat */
          var sheetOpen = false;
          function openSheet(on) {
            sheetOpen = on;
            $('sheet').classList.toggle('on', on);
            $('scrim').classList.toggle('on', on);
            $('sheet').setAttribute('aria-hidden', on ? 'false' : 'true');
            if (on) renderHist();
          }
          function renderHist() {
            var box = $('hl'); box.textContent = '';
            if (!hist.length) {
              var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Belum ada perhitungan.'; box.appendChild(e); return;
            }
            hist.forEach(function (it) {
              var b = document.createElement('button'); b.type = 'button'; b.className = 'h';
              var s = document.createElement('small'); s.textContent = it.e + ' =';
              var r = document.createElement('span'); r.textContent = group(it.r);
              b.appendChild(s); b.appendChild(r);
              b.onclick = function () { exp = it.r; justEq = true; last.textContent = it.e + ' ='; paint(); openSheet(false); };
              box.appendChild(b);
            });
          }
          $('bHi').onclick = function () { openSheet(true); };
          $('scrim').onclick = function () { openSheet(false); };
          $('bClr').onclick = function () { hist = []; C.set('h', '[]'); renderHist(); };
          $('bCp').onclick = function () {
            var t = exp || '';
            try { t = fmt(calc(exp)); } catch (e) {}
            if (!t) return;
            C.copy(t).then(function () { C.toast('Disalin: ' + t); });
          };
          C.onBack(function () { if (sheetOpen) { openSheet(false); return true; } return false; });

          C.get('h').then(function (s) {
            try { hist = JSON.parse(s || '[]'); } catch (e) { hist = []; }
            if (!Array.isArray(hist)) hist = [];
          });
          paint();
          </script>
          </body>
          </html>
