              // ---------- jembatan JS <-> native untuk fitur ----------
              private class PluginBridge {
                  private final String pid;
                  private final WebView wv;

                  PluginBridge(String pid, WebView wv) {
                      this.pid = pid;
                      this.wv = wv;
                  }

                  private SharedPreferences store() {
                      return getSharedPreferences("plug_" + pid, MODE_PRIVATE);
                  }

                  private void reply(String cid, boolean ok, Object val) {
                      final String js = "window.__cfm_done&&window.__cfm_done(" + JSONObject.quote(cid) + "," + ok + "," + lit(val) + ")";
                      runOnUiThread(() -> wv.evaluateJavascript(js, null));
                  }

                  @JavascriptInterface
                  public void invoke(final String cid, final String fn, final String argsJson) {
                      try {
                          final JSONArray a = new JSONArray(argsJson);
                          switch (fn) {
                              case "log": {
                                  String msg = a.optString(0) + ": " + a.optString(1);
                                  if (msg.length() > 600) msg = msg.substring(0, 600);
                                  lastErr.put(pid, msg);
                                  break;
                              }
                              case "copy": {
                                  final String t = a.optString(0);
                                  runOnUiThread(() -> { copyText(t); reply(cid, true, true); });
                                  break;
                              }
                              case "paste": {
                                  runOnUiThread(() -> reply(cid, true, pasteText()));
                                  break;
                              }
                              case "share": {
                                  final String t = a.optString(0);
                                  runOnUiThread(() -> { share(t); reply(cid, true, true); });
                                  break;
                              }
                              case "toast": {
                                  final String t = a.optString(0);
                                  runOnUiThread(() -> { toast(t); reply(cid, true, true); });
                                  break;
                              }
                              case "openUrl": {
                                  final String t = a.optString(0);
                                  runOnUiThread(() -> { openExternal(t); reply(cid, true, true); });
                                  break;
                              }
                              case "saveFile": {
                                  final String name = a.optString(0, "file.txt"), text = a.optString(1);
                                  runOnUiThread(() -> startSave(this, cid, name, text));
                                  break;
                              }
                              case "get": {
                                  reply(cid, true, store().getString(a.optString(0), null));
                                  break;
                              }
                              case "set": {
                                  store().edit().putString(a.optString(0), a.optString(1)).apply();
                                  reply(cid, true, true);
                                  break;
                              }
                              case "remove": {
                                  store().edit().remove(a.optString(0)).apply();
                                  reply(cid, true, true);
                                  break;
                              }
                              case "keys": {
                                  JSONArray ks = new JSONArray();
                                  for (String k : store().getAll().keySet()) ks.put(k);
                                  reply(cid, true, ks);
                                  break;
                              }
                              case "netInfo": {
                                  reply(cid, true, snap());
                                  break;
                              }
                              case "netLog": {
                                  reply(cid, true, logSnap);
                                  break;
                              }
                              case "checkPort": {
                                  final String host = a.optString(0, "192.168.43.1");
                                  final int port = a.optInt(1), to = Math.max(300, Math.min(15000, a.optInt(2, 2000)));
                                  new Thread(() -> reply(cid, true, probe(host, port, to))).start();
                                  break;
                              }
                              case "fetch": {
                                  final String url = a.optString(0);
                                  final JSONObject o = a.optJSONObject(1);
                                  new Thread(() -> {
                                      try {
                                          reply(cid, true, httpFetch(url, o));
                                      } catch (Exception e) {
                                          reply(cid, false, String.valueOf(e.getMessage()));
                                      }
                                  }).start();
                                  break;
                              }
                              case "info": {
                                  runOnUiThread(() -> {
                                      try {
                                          JSONObject o = new JSONObject();
                                          Plugin p = plugins.get(pid);
                                          o.put("id", pid);
                                          o.put("name", p == null ? "" : p.name);
                                          o.put("version", p == null ? "" : p.ver);
                                          o.put("app", APP_VER);
                                          reply(cid, true, o);
                                      } catch (Exception e) {
                                          reply(cid, false, String.valueOf(e.getMessage()));
                                      }
                                  });
                                  break;
                              }
                              default:
                                  reply(cid, false, "Fungsi tidak dikenal: " + fn);
                          }
                      } catch (Exception e) {
                          reply(cid, false, String.valueOf(e.getMessage()));
                      }
                  }
              }

              private void startSave(PluginBridge br, String cid, String name, String text) {
                  if (saveBridge != null) saveBridge.reply(saveCid, true, false);
                  saveBridge = br;
                  saveCid = cid;
                  saveText = text;
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT)
                          .addCategory(Intent.CATEGORY_OPENABLE)
                          .setType("application/octet-stream")
                          .putExtra(Intent.EXTRA_TITLE, name);
                  try {
                      startActivityForResult(i, REQ_SAVE);
                  } catch (Exception e) {
                      saveBridge = null;
                      br.reply(cid, true, false);
                      toastL("Tidak ada aplikasi pemilih file");
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_FILE) {
                      if (fileCb != null) {
                          fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                          fileCb = null;
                      }
                      return;
                  }
                  if (req == REQ_SAVE) {
                      PluginBridge br = saveBridge;
                      String cid = saveCid, text = saveText;
                      saveBridge = null;
                      saveText = null;
                      if (br == null) return;
                      boolean ok = false;
                      if (res == RESULT_OK && data != null && data.getData() != null && text != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(data.getData(), "wt")) {
                              os.write(text.getBytes("UTF-8"));
                              ok = true;
                              toast("Tersimpan");
                          } catch (Exception e) {
                              toastL("Gagal menyimpan: " + e.getMessage());
                          }
                      }
                      br.reply(cid, true, ok);
                      return;
                  }
                  if (req == REQ_IMPORT) {
                      if (res != RESULT_OK || data == null) return;
                      final List<Uri> us = new ArrayList<>();
                      if (data.getClipData() != null) {
                          for (int i = 0; i < data.getClipData().getItemCount(); i++) us.add(data.getClipData().getItemAt(i).getUri());
                      } else if (data.getData() != null) {
                          us.add(data.getData());
                      }
                      new Thread(() -> {
                          for (Uri u : us) {
                              final String name = displayName(u);
                              try (InputStream in = getContentResolver().openInputStream(u)) {
                                  final String html = new String(readAll(in, MAX_HTML, true), "UTF-8");
                                  final String fb = name.replaceAll("(?i)\\.html?$", "");
                                  runOnUiThread(() -> enqueue(fb, html, ""));
                              } catch (Exception e) {
                                  final String m = name + ": " + e.getMessage();
                                  runOnUiThread(() -> toastL("Gagal membaca " + m));
                              }
                          }
                      }).start();
                  }
              }

              private String displayName(Uri u) {
                  String n = null;
                  try (Cursor c = getContentResolver().query(u, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                      if (c != null && c.moveToFirst()) n = c.getString(0);
                  } catch (Exception ignored) { }
                  if (n == null) n = u.getLastPathSegment();
                  return n == null ? "" : n;
              }

