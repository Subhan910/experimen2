                  LinearLayout c = new LinearLayout(h);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.setPadding(dp(22), dp(28), dp(22), dp(24));
                  c.setBackground(h.box(MainActivity.CARD, 18, MainActivity.LINE));
                  c.addView(h.icon(R.drawable.ic_farm, MainActivity.ACC, 40), new LinearLayout.LayoutParams(dp(40), dp(40)));
                  TextView t = h.text("Belum ada HP", 17, MainActivity.FG, true);
                  t.setPadding(0, dp(12), 0, dp(6));
