          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.ArrayDeque;
          import java.util.ArrayList;

          /**
           * Sisi "tangan" Mode Agen: menjalankan sentuhan, tombol navigasi, dan pengetikan di HP ini atas perintah
           * pengendali. Memakai layanan Aksesibilitas, jadi tidak perlu root dan tidak perlu ADB. Pengguna harus
           * mengaktifkannya sekali di Pengaturan > Aksesibilitas.
           *
           * Sentuhan direkam dulu (turun, geser, angkat) lalu diputar ulang sebagai satu gestur saat jari diangkat,
           * karena API gestur Aksesibilitas tidak bisa menerima sentuhan secara langsung.
           */
          public final class AgentAccess extends AccessibilityService {

              static volatile AgentAccess instance;

              private static final int MAX_POINTS = 120;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final Object tl = new Object();
              private final ArrayList<float[]> pts = new ArrayList<>(); // x, y, waktu relatif (ms)
              private long downAt;
              private boolean down;

              // dispatchGesture membatalkan gestur yang sedang berjalan, jadi gestur dikirim satu per satu (hanya di thread utama)
              private static final int MAX_QUEUE = 6;
              private final ArrayDeque<Object[]> queue = new ArrayDeque<>(); // {GestureDescription, durasi}
              private boolean busy;
              private long busyUntil;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  // Sistem menyalakan layanan ini sendiri saat HP menyala, jadi server Agen ikut hidup tanpa membuka aplikasi.
                  // Pengendali bisa menyambung (siaga) dan meminta layar diambil bahkan setelah HP dinyalakan ulang.
                  AgentHost.ensure(this);
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  if (instance == this) instance = null;
                  main.removeCallbacks(acceptPoll);
                  AgentHost.stopIfIdle();
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  if (instance == this) instance = null;
                  AgentHost.stopIfIdle();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event != null && event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                          && SystemClock.uptimeMillis() < AgentHost.autoAcceptUntil) {
                      tryAccept();
                  }
              }

              // ---------- terima otomatis dialog izin tangkap layar (hanya saat pengendali meminta "Ambil layar") ----------
              /** Coba terima dialog sekarang, lalu ulangi sebentar bila belum muncul. Hanya aktif selama AgentHost.autoAcceptUntil. */
              void pollAccept() {
                  if (Build.VERSION.SDK_INT > 33) return; // Android 14+: dialognya berbeda dan sengaja tidak disentuh
                  main.post(acceptPoll);
              }

              private final Runnable acceptPoll = new Runnable() {
                  @Override
                  public void run() {
                      main.removeCallbacks(this);
                      if (SystemClock.uptimeMillis() >= AgentHost.autoAcceptUntil) return;
                      if (!tryAccept()) main.postDelayed(this, 400);
                  }
              };

              /**
               * Tekan "Mulai sekarang" pada dialog izin tangkap layar milik sistem. Hanya Android 13 ke bawah (Android 14
               * memakai dialog pilihan "satu aplikasi / seluruh layar" yang sengaja tidak disentuh), dan hanya jendela
               * com.android.systemui yang menyebut nama aplikasi ini. Kotak "Jangan tampilkan lagi" tidak pernah dicentang otomatis.
               */
              private boolean tryAccept() {
                  if (Build.VERSION.SDK_INT > 33) return false;
                  AccessibilityNodeInfo root = null;
                  try {
                      root = getRootInActiveWindow();
                      if (root == null) return false;
                      CharSequence pkg = root.getPackageName();
                      if (pkg == null || !"com.android.systemui".contentEquals(pkg)) return false;
                      // pastikan ini dialog milik aplikasi kita: teks dialog selalu menyebut nama aplikasi yang meminta
                      String label = getApplicationInfo().loadLabel(getPackageManager()).toString();
                      java.util.List<AccessibilityNodeInfo> mine = root.findAccessibilityNodeInfosByText(label);
                      if (mine == null || mine.isEmpty()) return false;
                      AccessibilityNodeInfo btn = null;
                      String[] words = {"Mulai sekarang", "Start now", "Mulai", "Start"};
                      for (String w : words) {
                          java.util.List<AccessibilityNodeInfo> l = root.findAccessibilityNodeInfosByText(w);
                          if (l == null) continue;
                          for (AccessibilityNodeInfo n : l) {
                              CharSequence t = n.getText();
                              if (n.isClickable() && t != null && w.equalsIgnoreCase(t.toString().trim())) {
                                  btn = n;
                                  break;
                              }
                          }
                          if (btn != null) break;
                      }
                      if (btn == null || !btn.isEnabled()) return false;
                      boolean ok = btn.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      if (ok) AgentHost.autoAcceptUntil = 0;
                      return ok;
                  } catch (Throwable e) {
                      return false;
                  } finally {
                      try { if (root != null) root.recycle(); } catch (Throwable ignored) { }
                  }
