              void invalidate() {
                  stale = true;
              }

              private void fail(Run r, Throwable e) {
                  boolean mine;
                  synchronized (this) {
                      mine = run == r && !r.dead;
                      if (mine) run = null;
                  }
                  if (!mine) return;
                  stale = true;
                  touching = false;
                  String m = e.getMessage();
                  if (e instanceof EOFException || m == null || m.isEmpty()) m = "Koneksi terputus";
                  if (agent && e instanceof SocketTimeoutException) m = "Agen tidak merespons (WiFi putus?)";
                  else if (agent && e instanceof SocketException) m = "Koneksi ke Agen terputus";
                  set(ST_ERROR, m);
              }

              // ---------- koneksi ADB ----------
              private Dadb ensureAdb() throws IOException {
                  init();
                  synchronized (adbLock) {
                      if (stale) {
                          closeAdbLocked();
                          stale = false;
                      }
                      if (adb != null) return adb;
                      String pr = probe(host, port, 2500);
                      if (!"open".equals(pr)) {
                          if ("refused".equals(pr)) throw new IOException("Port " + port + " ditolak. Aktifkan ADB WiFi (adb tcpip " + port + ")");
                          if ("timeout".equals(pr)) throw new IOException("Tidak terjangkau di jaringan");
                          throw new IOException(pr);
                      }
                      final Dadb d = Dadb.create(host, port, keys, 4000, 0);
                      // Bila HP menampilkan dialog "Izinkan debugging", sambungan menunggu jawaban. Batasi 60 detik.
                      final AtomicBoolean timedOut = new AtomicBoolean();
                      ScheduledFuture<?> guard = WATCH.schedule(() -> {
                          timedOut.set(true);
                          try { d.close(); } catch (Throwable ignored) { }
                      }, 60, TimeUnit.SECONDS);
                      try {
                          legacyShell(d, "echo ok"); // memaksa koneksi dan otorisasi
                      } catch (Throwable e) {
                          try { d.close(); } catch (Throwable ignored) { }
                          if (timedOut.get()) throw new IOException("Tidak ada izin. Terima dialog 'Izinkan debugging' di HP (centang Selalu izinkan)");
                          if (e instanceof IOException) throw (IOException) e;
                          throw new IOException(String.valueOf(e.getMessage()));
                      } finally {
                          guard.cancel(false);
                      }
                      adb = d;
                      pushed = false;
                      return d;
                  }
              }

              private void closeAdbLocked() {
                  if (adb != null) {
                      try { adb.close(); } catch (Throwable ignored) { }
                      adb = null;
                  }
              }

              // "shell:" versi lama: jalan di semua versi Android (shell_v2 baru ada di Android 7+)
              private static String legacyShell(Dadb d, String cmd) throws IOException {
                  AdbStream s = d.open("shell:" + cmd);
                  try {
                      return s.getSource().readUtf8().replace("\r", "");
                  } finally {
                      try { s.close(); } catch (Throwable ignored) { }
                  }
              }

              /** Jalankan perintah shell di HP ini (thread latar). cb dipanggil di thread latar. */
              void exec(final String cmd, final Result cb) {
                  if (agent) {
                      if (cb != null) cb.done(this, "", "Mode Agen tidak mendukung perintah shell");
                      return;
                  }
                  POOL.execute(() -> {
                      String out = "", err = null;
                      AdbStream s = null;
                      try {
                          Dadb d = ensureAdb();
                          s = d.open("shell:" + cmd);
                          final AdbStream fs = s;
                          ScheduledFuture<?> guard = WATCH.schedule(() -> { try { fs.close(); } catch (Throwable ignored) { } }, 25, TimeUnit.SECONDS);
                          try {
                              out = s.getSource().readUtf8().replace("\r", "");
                          } finally {
                              guard.cancel(false);
                          }
                      } catch (Throwable e) {
                          err = e.getMessage() == null ? e.getClass().getSimpleName() : e.getMessage();
                          stale = true;
                      } finally {
                          if (s != null) { try { s.close(); } catch (Throwable ignored) { } }
                      }
                      if (cb != null) cb.done(this, out, err);
                  });
              }

              // ---------- input ----------
              /** nx, ny = posisi 0..1 relatif ke layar HP. */
              void touch(int action, float nx, float ny) {
                  Run r = run;
                  int w = vw, h = vh;
                  if (r == null || state != ST_LIVE || w <= 0 || h <= 0) return;
                  if (action == ACT_DOWN) touching = true;
                  else if (!touching) return; // jangan kirim MOVE/UP tanpa DOWN
                  if (action == ACT_UP) touching = false;
                  if (agent) {
                      r.send(AgentWire.touchMsg(action, nx, ny), action == ACT_MOVE);
                      return;
                  }
                  int x = Math.max(0, Math.min(w - 1, Math.round(nx * w)));
                  int y = Math.max(0, Math.min(h - 1, Math.round(ny * h)));
                  r.send(touchMsg(action, x, y, w, h), action == ACT_MOVE);
              }

              void key(int code) {
                  Run r = run;
                  if (r != null && state == ST_LIVE) {
                      if (agent) {
                          r.send(AgentWire.keyMsg(code), false);
                      } else {
                          r.send(keyMsg(0, code), false);
                          r.send(keyMsg(1, code), false);
                      }
                  } else if (!agent) {
                      exec("input keyevent " + code, null);
                  }
              }

              boolean text(String s) {
                  Run r = run;
                  if (r == null || state != ST_LIVE) return false;
                  // batas scrcpy 300 byte per pesan: potong per 70 karakter. Agen mengganti isi kolom per pesan, jadi dipecah besar
                  int chunk = agent ? 1000 : 70;
                  int i = 0;
                  while (i < s.length()) {
                      int end = Math.min(s.length(), i + chunk);
                      if (end < s.length() && Character.isHighSurrogate(s.charAt(end - 1))) end--;
                      String part = s.substring(i, end);
                      r.send(agent ? AgentWire.textMsg(part) : textMsg(part), false);
                      i = end;
                  }
                  return true;
              }

              /** Agen siaga: minta HP itu membagikan layar lagi (merebutnya dari aplikasi lain). */
              boolean reclaim() {
                  Run r = run;
                  if (!agent || r == null || state != ST_LIVE) return false;
                  r.send(AgentWire.simpleMsg(AgentWire.C_RECLAIM), false);
                  if (standby) set(ST_LIVE, "Meminta HP itu membagikan layar...");
                  return true;
              }

              boolean rotate() {
                  Run r = run;
                  if (r == null || state != ST_LIVE || agent) return false; // Agen tidak bisa memutar layar: putar HP-nya
                  r.send(simpleMsg(11), false);
                  return true;
              }

              // ---------- satu kali sesi mirror ----------
              private final class Run {
                  final Surface surface;
                  final Profile prof;
                  final CountDownLatch done = new CountDownLatch(1);
                  final CountDownLatch codecGone = new CountDownLatch(1);
                  final LinkedBlockingQueue<byte[]> out = new LinkedBlockingQueue<>();
                  final Object lock = new Object();
                  final StringBuilder tail = new StringBuilder();
                  final AtomicBoolean killed = new AtomicBoolean();
                  volatile boolean dead;
                  volatile boolean shellDone;
                  Run prev;
                  AdbStream shell, video, control;
                  volatile Socket sock;
                  MediaCodec codec;
                  boolean gotConfig;
                  int cw, ch; // ukuran saat decoder dikonfigurasi

                  Run(Surface surface, Profile prof) {
                      this.surface = surface;
                      this.prof = prof;
                      alive.add(this);
                  }

                  boolean alive() {
                      return !dead && run == this;
                  }

                  void send(byte[] m, boolean droppable) {
                      if (dead) return;
                      if (droppable && out.size() > 24) return;
                      out.offer(m);
                  }

                  /** Berhenti tanpa memblokir pemanggil: penutupan stream butuh I/O jaringan, jadi dilakukan di thread lain. */
                  void kill() {
                      dead = true;
                      out.offer(POISON);
                      if (!killed.compareAndSet(false, true)) return;
                      Thread t = new Thread(this::shutdown, "farm-close-" + host);
                      t.setDaemon(true);
                      t.start();
                  }

                  void shutdown() {
                      dead = true;
                      out.offer(POISON);
                      synchronized (lock) {
                          releaseCodecLocked();
                      }
                      codecGone.countDown();
                      closeQuiet(video);
                      closeQuiet(control);
                      closeQuiet(shell);
                      closeSock();
                      alive.remove(this);
                      done.countDown();
                  }

                  void closeSock() {
                      Socket k = sock;
                      if (k != null) {
                          try { k.close(); } catch (Throwable ignored) { }
                      }
                  }

                  void closeQuiet(AdbStream s) {
                      if (s == null) return;
                      try { s.close(); } catch (Throwable ignored) { }
                  }

                  void releaseCodecLocked() {
                      MediaCodec c = codec;
                      codec = null;
                      if (c == null) return;
                      try { c.stop(); } catch (Throwable ignored) { }
                      try { c.release(); } catch (Throwable ignored) { }
                  }

                  void initCodec(int w, int h) throws IOException {
                      synchronized (lock) {
                          if (dead) throw new IOException("dibatalkan");
                          releaseCodecLocked();
                          if (surface == null) {
                              cw = w;
                              ch = h;
                              return;
                          }
                          if (!surface.isValid()) throw new IOException("Surface belum siap");
                          MediaFormat f = MediaFormat.createVideoFormat("video/avc", w, h);
                          int mx = Math.min(2160, Math.max(prof.maxSize, Math.max(w, h)));
                          f.setInteger(MediaFormat.KEY_MAX_WIDTH, mx);
                          f.setInteger(MediaFormat.KEY_MAX_HEIGHT, mx);
                          f.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 1 << 20);
                          if (Build.VERSION.SDK_INT >= 30) f.setInteger("low-latency", 1);
                          // coba decoder bawaan (hardware) dulu; bila jatah decoder habis, pakai decoder software
                          String[] names = {null, "c2.android.avc.decoder", "OMX.google.h264.decoder"};
                          MediaCodec c = null;
                          Throwable last = null;
                          for (String nm : names) {
                              MediaCodec t = null;
                              try {
                                  t = nm == null ? MediaCodec.createDecoderByType("video/avc") : MediaCodec.createByCodecName(nm);
                                  t.configure(f, surface, null, 0);
                                  t.start();
                                  c = t;
                                  break;
                              } catch (Throwable e) {
                                  last = e;
                                  if (t != null) {
                                      try { t.release(); } catch (Throwable ignored) { }
                                  }
                              }
                          }
                          if (c == null) throw new IOException("Decoder gagal: " + (last == null ? "?" : last.getMessage()));
                          codec = c;
                          gotConfig = false;
                          cw = w;
                          ch = h;
                      }
                  }

                  void appendTail(String s) {
                      synchronized (tail) {
                          tail.append(s);
                          if (tail.length() > 700) tail.delete(0, tail.length() - 700);
                      }
                  }

                  String tailText() {
                      synchronized (tail) {
                          return tail.toString().trim();
                      }
                  }

                  AdbStream openRetry(Dadb d, String dest, long timeoutMs) throws IOException {
                      long end = System.currentTimeMillis() + timeoutMs;
                      while (true) {
                          if (!alive()) throw new IOException("dibatalkan");
                          try {
                              return d.open(dest);
                          } catch (Exception e) {
                              if (shellDone) {
                                  String t = tailText();
                                  throw new IOException(t.isEmpty() ? "Server scrcpy berhenti" : "Server scrcpy: " + lastLine(t));
                              }
                              if (System.currentTimeMillis() > end) throw new IOException("Server scrcpy tidak merespons");
                              try {
                                  Thread.sleep(180);
                              } catch (InterruptedException ie) {
                                  throw new IOException("dibatalkan");
                              }
                          }
                      }
                  }

                  void main() {
                      try {
                          Run p = prev;
                          prev = null;
                          if (p != null) {
                              p.kill();
                              try { p.done.await(4, TimeUnit.SECONDS); } catch (InterruptedException ignored) { }
                          }
                          if (!alive()) return;
                          if (agent) {
                              runAgent();
                              return;
                          }

                          Dadb d = ensureAdb();
                          if (!alive()) return;
                          if (model.isEmpty()) {
                              try {
                                  String m = legacyShell(d, "getprop ro.product.model").trim();
                                  if (!m.isEmpty()) {
                                      model = m;
                                      listener.onChanged(FarmDevice.this);
                                  }
                              } catch (Exception ignored) { }
                          }

                          final String remote = "/data/local/tmp/cfm-scrcpy-" + serverVer + ".jar";
                          boolean need;
                          synchronized (adbLock) { need = !pushed; }
                          if (!need) {
                              String ls = legacyShell(d, "ls " + remote + " 2>&1").trim();
                              need = !ls.equals(remote);
                          }
                          if (need) {
                              d.push(jarFile, remote, 420, jarFile.lastModified());
                              synchronized (adbLock) { pushed = true; }
                          }
                          if (!alive()) return;

                          String scid = String.format(Locale.US, "%08x", new Random().nextInt(0x7fffffff));
                          String cmd = "CLASSPATH=" + remote + " app_process / com.genymobile.scrcpy.Server " + serverVer
                                  + " scid=" + scid + " log_level=warn audio=false clipboard_autosync=false cleanup=false"
                                  + " max_size=" + prof.maxSize + " video_bit_rate=" + prof.bitrate + " max_fps=" + prof.fps
                                  + " tunnel_forward=true";
                          shell = d.open("shell:" + cmd);
                          final BufferedSource ss = shell.getSource();
                          Thread drain = new Thread(() -> {
                              byte[] b = new byte[512];
                              try {
                                  int n;
                                  while ((n = ss.read(b)) != -1) appendTail(new String(b, 0, n, "UTF-8").replace("\r", ""));
                              } catch (Throwable ignored) { }
                              shellDone = true;
                          }, "farm-sh-" + host);
                          drain.setDaemon(true);
                          drain.start();

                          String sock = "localabstract:scrcpy_" + scid;
                          video = openRetry(d, sock, 12000);
                          BufferedSource vs = video.getSource();
                          vs.readByte(); // byte dummy: menandakan koneksi berhasil
                          control = openRetry(d, sock, 6000);
                          vs.skip(64); // nama perangkat
                          int codecId = vs.readInt();
                          int w = vs.readInt(), h = vs.readInt();
                          if (codecId != 0x68323634) throw new IOException("Codec video tidak didukung");
                          if (w <= 0 || h <= 0 || w > 8192 || h > 8192) throw new IOException("Ukuran video tidak valid");
                          if (!alive()) return;

                          vw = w;
                          vh = h;
                          initCodec(w, h);

                          startControlThreads();
                          set(ST_LIVE, "");
                          decodeLoop(new Frames() {
                              @Override
                              public long readLong() throws IOException {
                                  return vs.readLong();
                              }

                              @Override
                              public int readInt() throws IOException {
                                  return vs.readInt();
                              }

                              @Override
                              public void readFully(byte[] b) throws IOException {
                                  vs.readFully(b);
                              }
                          });
                      } catch (Throwable e) {
                          if (alive()) fail(this, e);
                      } finally {
                          shutdown();
                          synchronized (FarmDevice.this) {
                              if (run == this) run = null;
                          }
                      }
                  }

                  void startControlThreads() {
                      final AdbStream cs = control;
                      Thread wr = new Thread(() -> {
                          try {
                              BufferedSink sink = cs.getSink();
                              while (!dead) {
                                  byte[] m = out.take();
                                  if (m == POISON) break;
                                  sink.write(m);
                                  sink.flush();
                              }
                          } catch (Throwable ignored) { }
                      }, "farm-ctl-" + host);
                      wr.setDaemon(true);
                      wr.start();
                      Thread rd = new Thread(() -> {
                          byte[] b = new byte[512];
                          try {
                              BufferedSource src = cs.getSource();
                              while (!dead && src.read(b) != -1) { /* buang pesan dari HP */ }
                          } catch (Throwable ignored) { }
                      }, "farm-ctlr-" + host);
                      rd.setDaemon(true);
                      rd.start();
                  }

                  /** Sisi agen: sambungan TCP, jabat tangan PIN, lalu aliran video yang sama dengan scrcpy. */
                  void runAgent() throws Exception {
                      Socket s = new Socket();
                      sock = s;
                      if (dead) throw new IOException("dibatalkan");
                      s.setTcpNoDelay(true);
                      try {
                          s.connect(new InetSocketAddress(host, port), 4000);
                      } catch (SocketTimeoutException e) {
                          throw new IOException("Tidak terjangkau di jaringan");
                      } catch (IOException e) {
                          String m = String.valueOf(e.getMessage());
                          if (m.contains("refused")) throw new IOException("Agen belum aktif di HP itu. Buka CFM Agen di HP itu lalu ketuk Mulai");
                          throw e;
                      }
                      s.setSoTimeout(12000);
                      final DataInputStream din = new DataInputStream(new BufferedInputStream(s.getInputStream(), 65536));
                      DataOutputStream dout = new DataOutputStream(new BufferedOutputStream(s.getOutputStream(), 1024));
                      AgentWire.Hello hl = AgentWire.clientHello(din, dout, pin, prof.maxSize, prof.bitrate, prof.fps);
                      if (!alive()) return;
                      if (model.isEmpty() && !hl.name.isEmpty()) {
                          model = hl.name;
                          listener.onChanged(FarmDevice.this);
                      }
                      noControl = !hl.control;
                      vw = hl.width;
                      vh = hl.height;
                      initCodec(hl.width, hl.height);
                      startAgentControl(dout);
                      standby = hl.standby; // pemberitahuan alasan menyusul sebagai paket teks
                      set(ST_LIVE, hl.standby ? "Layar belum dibagikan di HP itu" : "");
                      decodeLoop(new Frames() {
                          @Override
                          public long readLong() throws IOException {
                              return din.readLong();
                          }

                          @Override
                          public int readInt() throws IOException {
                              return din.readInt();
                          }

                          @Override
                          public void readFully(byte[] b) throws IOException {
                              din.readFully(b);
                          }
                      });
                  }

                  void startAgentControl(final DataOutputStream dout) {
                      Thread wr = new Thread(() -> {
                          try {
                              while (!dead) {
                                  byte[] m = out.poll(2500, TimeUnit.MILLISECONDS);
                                  if (m == POISON) break;
                                  if (m == null) m = AgentWire.simpleMsg(AgentWire.C_PING); // agen memutus bila kita diam terlalu lama
                                  dout.write(m);
                                  dout.flush();
                              }
                          } catch (Throwable e) {
                              if (!dead) closeSock(); // tulis gagal: biarkan pembaca video ikut gagal dan melaporkan
                          }
                      }, "farm-actl-" + host);
                      wr.setDaemon(true);
                      wr.start();
                  }

                  void decodeLoop(Frames vs) throws IOException {
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      long lastReset = 0;
                      while (alive()) {
                          long pf = vs.readLong();
                          int size = vs.readInt();
                          if (size < 0 || size > 16 * 1024 * 1024) throw new IOException("Paket video rusak");
                          if (size == 0) continue; // detak jantung dari Agen
                          byte[] data = new byte[size];
                          vs.readFully(data);
                          if (agent && (pf & AgentWire.FLAG_NOTICE) != 0) {
                              // Agen memberi tahu video berhenti (mis. layar direbut Macrorify). Sesi tetap terbuka: sentuhan tetap jalan.
                              if (size > 1000) throw new IOException("Pemberitahuan Agen rusak");
                              String msg = new String(data, "UTF-8");
                              touching = false;
                              standby = true;
                              set(ST_LIVE, msg.isEmpty() ? "Layar tidak tersedia" : msg);
                              continue;
                          }
                          boolean cfg = (pf & (1L << 63)) != 0;
                          boolean key = (pf & (1L << 62)) != 0;
                          long pts = pf & 0x3FFFFFFFFFFFFFFFL;

                          boolean flushFirst = false;
                          if (cfg && standby) {
                              // video dilanjutkan setelah layar diambil kembali: konfigurasi baru menandai awal aliran
                              standby = false;
                              set(ST_LIVE, "");
                          }
                          if (cfg) {
                              int[] wh = spsSize(data);
                              if (wh != null && (wh[0] != cw || wh[1] != ch)) {
                                  // HP diputar atau resolusi berubah: buat ulang decoder dengan ukuran baru
                                  initCodec(wh[0], wh[1]);
                                  vw = wh[0];
                                  vh = wh[1];
                                  listener.onChanged(FarmDevice.this);
                              } else if (gotConfig) {
                                  flushFirst = true; // konfigurasi baru dengan ukuran sama (mis. setelah reset): mulai dari awal
                              }
                          }
                          if (surface == null) continue;
                          MediaCodec c;
                          synchronized (lock) { c = codec; }
                          if (c == null) throw new IOException("Decoder berhenti");
                          try {
                              if (flushFirst) c.flush();
                              int idx = c.dequeueInputBuffer(cfg ? 500000 : 300000);
                              if (idx >= 0) {
                                  ByteBuffer ib = c.getInputBuffer(idx);
                                  if (ib != null && size <= ib.capacity()) {
                                      ib.clear();
                                      ib.put(data);
                                      c.queueInputBuffer(idx, 0, size, pts,
                                              cfg ? MediaCodec.BUFFER_FLAG_CODEC_CONFIG : (key ? MediaCodec.BUFFER_FLAG_KEY_FRAME : 0));
                                      if (cfg) gotConfig = true;
                                  } else {
                                      c.queueInputBuffer(idx, 0, 0, pts, 0);
                                  }
                              } else if (!cfg) {
                                  // paket terbuang: gambar bisa rusak sampai keyframe berikutnya, minta HP mulai ulang aliran
                                  long now = System.currentTimeMillis();
                                  if (now - lastReset > 4000) {
                                      lastReset = now;
                                      // RESET_VIDEO (scrcpy) atau SYNC (Agen): minta keyframe baru
                                      send(agent ? AgentWire.simpleMsg(AgentWire.C_SYNC) : simpleMsg(17), false);
                                  }
                              }
                              int oi = c.dequeueOutputBuffer(info, cfg ? 0 : 20000);
                              while (oi != MediaCodec.INFO_TRY_AGAIN_LATER) {
                                  if (oi >= 0) c.releaseOutputBuffer(oi, true);
                                  oi = c.dequeueOutputBuffer(info, 0);
                              }
                          } catch (IllegalStateException e) {
                              if (dead) return;
                              throw new IOException("Decoder error: " + e.getMessage());
                          }
                      }
                  }
              }

              /** Sumber paket video: dari AdbStream (scrcpy) atau dari soket TCP (Agen). */
              private interface Frames {
                  long readLong() throws IOException;

                  int readInt() throws IOException;

                  void readFully(byte[] b) throws IOException;
              }

              private static String lastLine(String t) {
                  String[] ls = t.split("\n");
                  for (int i = ls.length - 1; i >= 0; i--) {
                      String s = ls[i].trim();
                      if (!s.isEmpty()) return s.length() > 120 ? s.substring(0, 120) : s;
                  }
                  return t;
              }

              // ---------- baca ukuran video dari SPS H.264 (agar sesuai persis dengan ukuran milik scrcpy) ----------
              private static final class Bits {
                  final byte[] b;
                  int pos;

                  Bits(byte[] b) {
                      this.b = b;
                  }

                  int bit() {
                      if ((pos >> 3) >= b.length) throw new IllegalStateException("eof");
                      int v = (b[pos >> 3] >> (7 - (pos & 7))) & 1;
                      pos++;
                      return v;
                  }

                  int u(int n) {
                      int v = 0;
                      for (int i = 0; i < n; i++) v = (v << 1) | bit();
                      return v;
                  }

                  int ue() {
                      int z = 0;
                      while (bit() == 0) {
                          if (++z > 31) throw new IllegalStateException("ue");
                      }
                      if (z == 0) return 0;
                      long v = ((1L << z) - 1) + u(z);
                      return (int) v;
                  }

                  int se() {
                      int k = ue();
                      return (k & 1) == 1 ? (k + 1) / 2 : -(k / 2);
                  }
              }

              static int[] spsSize(byte[] d) {
                  try {
                      for (int i = 0; i + 4 < d.length; i++) {
                          int sc = -1;
                          if (d[i] == 0 && d[i + 1] == 0 && d[i + 2] == 1) sc = i + 3;
                          else if (d[i] == 0 && d[i + 1] == 0 && d[i + 2] == 0 && d[i + 3] == 1) sc = i + 4;
                          if (sc < 0 || sc >= d.length) continue;
                          if ((d[sc] & 0x1f) != 7) continue;
                          int end = d.length;
                          for (int j = sc + 1; j + 2 < d.length; j++) {
                              if (d[j] == 0 && d[j + 1] == 0 && (d[j + 2] == 1 || (d[j + 2] == 0 && j + 3 < d.length && d[j + 3] == 1))) {
                                  end = j;
                                  break;
                              }
                          }
                          ByteArrayOutputStream rb = new ByteArrayOutputStream();
                          int zeros = 0;
                          for (int j = sc + 1; j < end; j++) {
                              int v = d[j] & 0xff;
                              if (zeros >= 2 && v == 3) {
                                  zeros = 0;
                                  continue;
                              }
                              zeros = v == 0 ? zeros + 1 : 0;
                              rb.write(v);
                          }
                          return parseSps(rb.toByteArray());
                      }
                  } catch (Exception ignored) { }
                  return null;
              }

              private static int[] parseSps(byte[] rbsp) {
                  Bits r = new Bits(rbsp);
                  int profile = r.u(8);
                  r.u(8);
                  r.u(8);
                  r.ue();
                  int chroma = 1;
                  if (profile == 100 || profile == 110 || profile == 122 || profile == 244 || profile == 44 || profile == 83 || profile == 86
                          || profile == 118 || profile == 128 || profile == 138 || profile == 139 || profile == 134 || profile == 135) {
                      chroma = r.ue();
                      if (chroma == 3) r.u(1);
                      r.ue();
                      r.ue();
                      r.u(1);
                      if (r.u(1) == 1) {
                          int lists = chroma != 3 ? 8 : 12;
                          for (int i = 0; i < lists; i++) {
                              if (r.u(1) == 1) {
                                  int sz = i < 6 ? 16 : 64, last = 8, next = 8;
                                  for (int j = 0; j < sz; j++) {
                                      if (next != 0) {
                                          next = (last + r.se() + 256) % 256;
                                      }
                                      last = next == 0 ? last : next;
                                  }
                              }
                          }
                      }
                  }
                  r.ue();
                  int poc = r.ue();
                  if (poc == 0) {
                      r.ue();
                  } else if (poc == 1) {
                      r.u(1);
                      r.se();
                      r.se();
                      int n = r.ue();
                      for (int i = 0; i < n; i++) r.se();
                  }
                  r.ue();
                  r.u(1);
                  int mbw = r.ue() + 1;
                  int mbh = r.ue() + 1;
                  int frameMbsOnly = r.u(1);
                  if (frameMbsOnly == 0) r.u(1);
                  r.u(1);
                  int cl = 0, cr = 0, ct = 0, cb = 0;
                  if (r.u(1) == 1) {
                      cl = r.ue();
                      cr = r.ue();
                      ct = r.ue();
                      cb = r.ue();
                  }
                  int cux = chroma == 0 || chroma == 3 ? 1 : 2;
                  int cuy = (chroma == 0 || chroma == 3 ? 1 : 2) * (2 - frameMbsOnly);
                  int w = mbw * 16 - cux * (cl + cr);
                  int h = (2 - frameMbsOnly) * mbh * 16 - cuy * (ct + cb);
                  if (w <= 0 || h <= 0) return null;
                  return new int[]{w, h};
              }
          }
