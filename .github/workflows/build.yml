          var sheetOpen = false;
          function openSheet(on) {
            sheetOpen = on;
            $('sheet').classList.toggle('on', on);
            $('scrim').classList.toggle('on', on);
            $('sheet').setAttribute('aria-hidden', on ? 'false' : 'true');
            if (on) renderHist();
          }
          function renderHist() {
            var box = $('hl'); box.textContent = '';
            if (!hist.length) {
              var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Belum ada perhitungan.'; box.appendChild(e); return;
            }
            hist.forEach(function (it) {
              var b = document.createElement('button'); b.type = 'button'; b.className = 'h';
              var s = document.createElement('small'); s.textContent = it.e + ' =';
              var r = document.createElement('span'); r.textContent = group(it.r);
              b.appendChild(s); b.appendChild(r);
              b.onclick = function () { exp = it.r; justEq = true; last.textContent = it.e + ' ='; paint(); openSheet(false); };
              box.appendChild(b);
            });
          }
          $('bHi').onclick = function () { openSheet(true); };
          $('scrim').onclick = function () { openSheet(false); };
          $('bClr').onclick = function () { hist = []; C.set('h', '[]'); renderHist(); };
          $('bCp').onclick = function () {
            var t = exp || '';
            try { t = fmt(calc(exp)); } catch (e) {}
            if (!t) return;
            C.copy(t).then(function () { C.toast('Disalin: ' + t); });
          };
          C.onBack(function () { if (sheetOpen) { openSheet(false); return true; } return false; });

          C.get('h').then(function (s) {
            try { hist = JSON.parse(s || '[]'); } catch (e) { hist = []; }
            if (!Array.isArray(hist)) hist = [];
          });
          paint();
          </script>
          </body>
          </html>
