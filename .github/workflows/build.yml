            C.copy(t).then(function () { C.toast('Disalin: ' + t); });
          };
          C.onBack(function () { if (sheetOpen) { openSheet(false); return true; } return false; });

          C.get('h').then(function (s) {
            try { hist = JSON.parse(s || '[]'); } catch (e) { hist = []; }
            if (!Array.isArray(hist)) hist = [];
          });
          paint();
          </script>
          </body>
          </html>
