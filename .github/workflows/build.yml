               */
              volatile boolean standby;
              volatile String name;
              volatile String model = "";
              volatile int state = ST_IDLE;
              volatile String message = "";
              volatile int vw, vh;

              private final Listener listener;
              private final Object adbLock = new Object();
              private final CopyOnWriteArraySet<Run> alive = new CopyOnWriteArraySet<>();
              private Dadb adb;
              private boolean pushed;
              private volatile boolean stale;
              private volatile boolean touching;
              private volatile Run run;

              FarmDevice(String name, String host, int port, Listener l) {
                  this(name, host, port, false, "", l);
              }

              FarmDevice(String name, String host, int port, boolean agent, String pin, Listener l) {
                  this.name = name == null ? "" : name;
                  this.host = host;
                  this.port = port;
                  this.agent = agent;
                  this.pin = pin == null ? "" : pin;
                  this.listener = l;
              }

              String key() {
                  return host + ":" + port;
              }

              String label() {
                  String n = name;
                  if (n != null && !n.isEmpty()) return n;
                  String m = model;
                  return m == null || m.isEmpty() ? host : m;
              }

              boolean isLive() {
                  return state == ST_LIVE;
              }

              boolean running() {
                  return run != null;
              }

              boolean usesSurface(Surface s) {
                  Run r = run;
                  return r != null && r.surface == s;
              }

              private void set(int st, String msg) {
                  if (st != ST_LIVE) standby = false;
                  state = st;
                  message = msg == null ? "" : msg;
                  listener.onChanged(this);
              }

              /** Mulai (atau mulai ulang) mirror ke surface yang diberikan; surface null = hanya kontrol. Aman dari thread UI. */
              void start(Surface surface, Profile p) {
                  Run r = new Run(surface, p);
                  Run old;
                  synchronized (this) {
                      old = run;
                      run = r;
                  }
                  r.prev = old;
                  touching = false;
                  if (old != null) old.kill();
                  set(ST_CONNECTING, "Menghubungkan...");
                  Thread t = new Thread(r::main, "farm-" + host);
                  t.setDaemon(true);
                  t.start();
              }

              /** Hentikan mirror. Koneksi ADB dibiarkan terbuka agar sambung ulang cepat. */
              void stop() {
                  Run r;
                  synchronized (this) {
                      r = run;
                      run = null;
                  }
                  touching = false;
                  if (r != null) {
                      r.kill();
                      set(ST_IDLE, "");
                  }
              }

              /**
               * Hentikan semua sesi yang memakai surface ini, lalu panggil after (di thread latar) setelah decoder
               * benar-benar dilepas, jadi aman melepas Surface sesudahnya.
               */
              void stopSurface(final Surface s, final Runnable after) {
                  final List<Run> hit = new ArrayList<>();
                  boolean cleared = false;
                  synchronized (this) {
                      for (Run r : alive) if (r.surface == s) hit.add(r);
                      Run cur = run;
                      if (cur != null && cur.surface == s) {
                          run = null;
                          cleared = true;
                      }
                  }
                  for (Run r : hit) r.kill();
                  if (cleared) {
                      touching = false;
                      set(ST_IDLE, "");
                  }
                  if (hit.isEmpty()) {
                      if (after != null) after.run();
                      return;
                  }
                  Thread t = new Thread(() -> {
                      for (Run r : hit) {
