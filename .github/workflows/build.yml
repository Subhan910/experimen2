                  /** Layar hilang: masuk siaga dan beri tahu klien alasannya. */
                  void lost(String reason) {
                      synchronized (wlock) {
                          if (dead) return;
                          standby = true;
                          try {
                              writeNoticeLocked(reason == null ? "Layar tidak tersedia" : reason);
                          } catch (IOException e) {
                              close();
                          }
                      }
                  }
              }
          }
