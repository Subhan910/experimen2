          cat > app/src/main/assets/cfm-prelude.js <<'EOF_FILE'
          (function () {
            if (window.CFM) return;
            var N = window.CFMNative, cbs = {}, seq = 0, backFn = null;

            function call(fn, args) {
              return new Promise(function (res, rej) {
                if (!N) { rej(new Error('Jembatan CFM tidak tersedia')); return; }
                var id = String(++seq);
                cbs[id] = { res: res, rej: rej };
                try { N.invoke(id, fn, JSON.stringify(args || [])); }
                catch (e) { delete cbs[id]; rej(e); }
              });
            }

            window.__cfm_done = function (id, ok, val) {
              var c = cbs[id];
              if (!c) return;
              delete cbs[id];
              if (ok) c.res(val); else c.rej(new Error(String(val)));
            };

            function log(kind, msg) {
              try { N.invoke('0', 'log', JSON.stringify([kind, String(msg)])); } catch (e) {}
            }
            window.addEventListener('error', function (e) { log('error', (e.message || 'error') + ' @' + (e.lineno || 0)); });
            window.addEventListener('unhandledrejection', function (e) {
              var r = e.reason;
              log('promise', r && r.message ? r.message : r);
            });

            window.CFM = {
              // clipboard, berbagi, toast
              copy: function (t) { return call('copy', [String(t)]); },
              paste: function () { return call('paste'); },
              share: function (t) { return call('share', [String(t)]); },
              toast: function (m) { return call('toast', [String(m)]); },
              openUrl: function (u) { return call('openUrl', [String(u)]); },
              // simpan file lewat pemilih lokasi Android; resolve true bila tersimpan
              saveFile: function (name, text) { return call('saveFile', [String(name), String(text)]); },
              // penyimpanan per fitur (aman, tidak hilang saat fitur diperbarui)
              get: function (k) { return call('get', [String(k)]); },
              set: function (k, v) { return call('set', [String(k), String(v)]); },
              remove: function (k) { return call('remove', [String(k)]); },
              keys: function () { return call('keys'); },
              // jaringan
              netInfo: function () { return call('netInfo'); },
              netLog: function () { return call('netLog'); },
              checkPort: function (host, port, timeoutMs) { return call('checkPort', [String(host), Number(port), Number(timeoutMs || 2000)]); },
              fetch: function (url, opts) { return call('fetch', [String(url), opts || {}]); },
              // info fitur & aplikasi: {id, name, version, app}
              info: function () { return call('info'); },
              // event dari aplikasi: 'show', 'hide', 'net'
              on: function (name, fn) { window.addEventListener('cfm:' + name, fn); },
              // tombol Kembali: return true bila sudah ditangani fitur, selain itu kembali ke WebUI
              onBack: function (fn) { backFn = fn; },
              _back: function () { return backFn ? !!backFn() : false; }
            };
          })();
          EOF_FILE
          cat > app/src/main/assets/PLUGIN_GUIDE.md <<'EOF_FILE'
          # Panduan membuat fitur untuk CFM WebUI

          Tempel panduan ini ke AI, lalu minta: "buatkan fitur HTML untuk ...".
          Satu fitur = satu file HTML mandiri. Pasang lewat menu Kelola Fitur
          (Impor HTML / Tempel / Dari URL). Fitur langsung muncul di menu aplikasi.
          Memasang file dengan cfm-id yang sama = upgrade fitur itu (versi lama disimpan, bisa dikembalikan).

          ## Aturan file
          - Satu file HTML. CSS dan JS ditulis inline. Jangan merujuk file lokal lain (./style.css tidak akan termuat).
          - Library dari CDN https boleh, tetapi hanya jalan saat ada internet.
          - Mobile-first, tema gelap. Disarankan memakai UI kit aplikasi (lihat bagian "UI kit") agar tampilan seragam dan profesional; tombol minimal 44px.
          - Jangan pakai fungsi yang butuh izin khusus (kamera, GPS). Yang tersedia hanya API CFM di bawah.
          - alert(), confirm(), prompt() boleh dipakai.

          ## Metadata (taruh di <head>)
          ```html
          <meta name="cfm-id" content="contoh">            <!-- wajib untuk upgrade: huruf kecil, angka, tanda minus -->
          <meta name="cfm-name" content="Contoh Fitur">     <!-- nama di menu -->
          <meta name="cfm-icon" content="🧩">               <!-- emoji di menu (opsional) -->
          <meta name="cfm-version" content="1">             <!-- naikkan tiap rilis: 1, 1.1, 2 ... -->
          <meta name="cfm-order" content="50">              <!-- urutan menu, kecil = atas (opsional) -->
          <meta name="cfm-ui" content="1">                  <!-- opsional: aplikasi menyisipkan UI kit (CSS) ke fitur ini -->
          <meta name="cfm-update-url" content="https://.../contoh.html">  <!-- opsional: tombol Cek pembaruan mengunduh dari sini -->
          ```
          Tanpa cfm-id, id diambil dari nama file atau judul. Tanpa cfm-version, dianggap 1.

          ## API window.CFM (semua mengembalikan Promise)
          - CFM.copy(teks) / CFM.paste() -> teks clipboard
          - CFM.share(teks) -> buka menu Bagikan Android
          - CFM.toast(pesan)
          - CFM.openUrl(url) -> buka di browser (http/https)
          - CFM.saveFile(nama, teks) -> true bila tersimpan, false bila dibatalkan
          - CFM.get(kunci) -> string atau null; CFM.set(kunci, string); CFM.remove(kunci); CFM.keys()
            Simpan data fitur di sini (simpan objek dengan JSON.stringify). Data tetap ada saat fitur diganti versi.
          - CFM.netInfo() -> teks daftar IP aktif; CFM.netLog() -> teks log perubahan jaringan
          - CFM.checkPort(host, port, timeoutMs) -> "open" | "timeout" | "refused" | "error: ..."
          - CFM.fetch(url, {method, headers, body, timeout}) -> {status, ok, contentType, body}
            HTTP lewat sisi native, tanpa batasan CORS. Hanya teks, maksimal 2 MB. Metode: GET POST PUT DELETE HEAD OPTIONS.
          - CFM.info() -> {id, name, version, app}
          - CFM.on('show' | 'hide' | 'net', fn) -> 'show' saat fitur dibuka, 'hide' saat ditinggalkan, 'net' saat jaringan berubah
          - CFM.onBack(fn) -> tombol Kembali memanggil fn lebih dulu; return true bila sudah ditangani
            (contoh: menutup layar editor). Jika false/tidak ada, aplikasi kembali ke WebUI.

          Input file: <input type="file"> berfungsi; baca isinya dengan FileReader.
          Kesalahan JavaScript otomatis dicatat; lihat di Kelola Fitur > ketuk fitur > Lihat error terakhir.

          ## UI kit (dengan <meta name="cfm-ui" content="1">)
          Aplikasi menyisipkan stylesheet siap pakai sebelum CSS fitur, jadi cukup pakai class dan variabel ini.
          - Variabel: --bg #0b0e14, --surface, --card, --card2, --line, --text, --dim, --mute, --acc #7aa7ff, --acc2, --ok, --warn, --bad, --mono
          - Tata letak: .page (padding), .row, .col, .grow, .appbar (header lengket), .sec (judul seksi kecil kapital), .h1, .sub, .hide
          - Komponen: .card (.tap = bisa diketuk), .item, .tile, .empty, .btn (.pri .ghost .bad .sm .blk), .ibtn (tombol ikon), .fab,
            .input, .field (label), .chip (.ok .warn .bad .acc), .dot, .sw (sakelar: <label class="sw"><span>Teks</span><input type="checkbox"><i></i></label>)
          - Ikon: SVG inline dengan class "i" (stroke mengikuti warna teks), contoh <svg class="i"><use href="#i-plus"/></svg> setelah mendefinisikan <symbol id="i-plus">.
          Tanpa meta ini, tulis CSS sendiri (latar #0b0e14, teks #e8ecf3, aksen #7aa7ff).

          ## Template minimal
          ```html
          <!doctype html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="cfm-id" content="contoh">
          <meta name="cfm-name" content="Contoh Fitur">
          <meta name="cfm-icon" content="🧩">
          <meta name="cfm-version" content="1">
          <meta name="cfm-ui" content="1">
          <title>Contoh Fitur</title>

          </head>
          <body>
          <main class="page">
          <h1 class="h1">Halo</h1>
          <p class="sub" id="out"></p>
          <button class="btn pri" id="b">Hitung klik</button>
          </main>
          <script>
          var n = 0;
          CFM.get('klik').then(function (v) { n = Number(v) || 0; show(); });
          function show() { document.getElementById('out').textContent = 'Klik: ' + n; }
          document.getElementById('b').onclick = function () {
            n++; show(); CFM.set('klik', n);
          };
          </script>
          </body>
          </html>
          ```

          ## Keamanan
          Fitur HTML punya akses clipboard, penyimpanan fitur, dan jaringan (CFM.fetch). Pasang hanya dari sumber yang dipercaya.
