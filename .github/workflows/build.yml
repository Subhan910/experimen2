            if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
            return String(parseFloat(v.toPrecision(12)));
          }
          function group(s) { // 1234567.5 -> 1.234.567,5 hanya untuk tampilan hasil
            var m = s.match(/^(-?)(\d+)(\.\d+)?(e.*)?$/);
            if (!m) return s;
            return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (m[3] ? ',' + m[3].slice(1) : '') + (m[4] || '');
          }

          function paint() {
            disp.textContent = exp || '0';
            var n = (exp || '0').length;
